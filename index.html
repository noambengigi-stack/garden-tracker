function stripSid(d){ if(!d||typeof d!=="object")return d; const {_sid,...rest}=d; return rest; }

async function load(){
  try {
    const { data, error } = await sb.from("app_data").select("data").eq("id", ROW_ID).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      const clean = stripSid(data.data);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(clean)); } catch(_) {}
      return clean;
    }
    return null;
  } catch (e) {
    try { const r = localStorage.getItem(CACHE_KEY); return r ? JSON.parse(r) : null; } catch(_) { return null; }
  }
}
async function save(v){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch(_) {}
  try {
    const payload = { ...v, _sid: MY_SID };
    const { error } = await sb.from("app_data").upsert({ id: ROW_ID, data: payload, updated_at: new Date().toISOString() });

  const n=(name||"").toLowerCase();

    if(n.includes("מגולוון")||n.includes("גלוון"))return "מגולוונים";

    return "מצמדים";

  if(cat==="pipes"){
    if(n.includes("טפטוף")||n.includes("טפטפת"))return "טפטוף";
    if(n.includes("מיקרו")||n.includes("שלוחה"))return "מיקרו";

  }
  if(cat==="sprinklers"){
    if(n.includes("טפטפת")||n.includes("מחלק"))return "טפטפות";
    return "ממטירים";
  }
  if(cat==="spray"){
    if(n.includes("עשב"))return "קוטלי עשבים";
    if(n.includes("דשן")||n.includes("דישון")||n.includes("הזנה"))return "דישון";
    if(n.includes("הרטב")||n.includes("מפזר"))return "עזר";
    if(n.includes("חרק")||n.includes("מזיק")||n.includes("פטר")||n.includes("גופרית")||n.includes("נמל")||n.includes("שמן"))return "הדברה";
    return "הדברה";
  }
  if(cat==="consumables"){
    if(n.includes("חרמש")||n.includes("חוט")||n.includes("דיסק")||n.includes("קסטה"))return "חרמש";
    if(n.includes("שמן")||n.includes("דלק")||n.includes("מיכל"))return "שמנים ודלק";

    return "כללי";
  }
  return "כללי";
}

  const all=[];

  useEffect(()=>{(async()=>{
    const d=await load();
    if(d){
      const merged={...EMPTY,...d};
      // Auto-seed inventory: add any missing default items, never delete existing
      if(!merged.inventory)merged.inventory=[];
      // One-time cleanup: remove obsolete default items that we no longer want
      // Old headsys items (h3-h18) and old generic connectors (c1-c15)
      const obsoleteIds=new Set(["h3","h4","h5","h6","h7","h8","h9","h10","h11","h12","h13","h14","h15","h16","h17","h18","c1","c2","c3","c4","c5","c6","c7","c8","c9","c10","c11","c12","c13","c14","c15"]);
      merged.inventory=merged.inventory.filter(it=>!obsoleteIds.has(it.id));
      const existingIds=new Set(merged.inventory.map(it=>it.id));
      const existingNames=new Set(merged.inventory.map(it=>(it.name||"").trim()));
      let addedCount=0;
      INIT.inventory.forEach(defItem=>{
        if(!existingIds.has(defItem.id) && !existingNames.has(defItem.name.trim())){
          merged.inventory.push({...defItem});
          addedCount++;
        }
      });
      // One-time fix: reassign items stuck in "נוסף ידנית" to proper subgroup by name
      merged.inventory.forEach(it=>{
        if(it.subgroup==="נוסף ידנית"){
          it.subgroup=guessSubgroup(it.name,it.category);
          it.userAdded=true;
        }
      });
      setData(merged);
    }
    else { setData({...INIT}); await save({...INIT}); }
    setLoaded(true);
  })();},[]);

  const saveTimer = useRef(null);
  useEffect(()=>{
    if(!loaded) return;
    setSyncStatus("saving");
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async ()=>{
      const ok = await save(data);
      setSyncStatus(ok ? "saved" : "error");
    }, 400);
    return ()=>{ if(saveTimer.current) clearTimeout(saveTimer.current); };
  },[data,loaded]);

  useEffect(()=>{
    if(!loaded) return;
    const channel = sb.channel("app_data_"+ROW_ID)
      .on("postgres_changes",
          { event: "*", schema: "public", table: "app_data", filter: "id=eq."+ROW_ID },
          (payload)=>{
            const incoming = payload.new && payload.new.data;
            if(!incoming) return;
            if(incoming._sid === MY_SID) return;
            const clean = stripSid(incoming);
            setData(p => {
              if(JSON.stringify(p)===JSON.stringify(clean)) return p;
              // SMART MERGE - never lose inventory items or warehouse quantities
              const merged = {...EMPTY, ...clean};
              // Inventory: union of both lists (keep any item that exists in either)
              const localInv = p.inventory || [];
              const remoteInv = clean.inventory || [];
              const invById = {};
              remoteInv.forEach(it=>{ invById[it.id] = it; });
              localInv.forEach(it=>{ if(!invById[it.id]) invById[it.id] = it; });
              merged.inventory = Object.values(invById);
              // Warehouse: keep the higher quantity / preserve data from both
              const localWh = p.warehouse || {};
              const remoteWh = clean.warehouse || {};
              const mergedWh = {...remoteWh};
              Object.keys(localWh).forEach(id=>{
                if(!mergedWh[id]){ mergedWh[id] = localWh[id]; }
                else {
                  // Keep the entry that has more info (higher qty wins if conflict)
                  const l = localWh[id], r = mergedWh[id];
                  mergedWh[id] = {
                    qty: Math.max(l.qty||0, r.qty||0),
                    threshold: r.threshold||l.threshold||0,
                    note: r.note||l.note||""
                  };
                }
              });
              merged.warehouse = mergedWh;
              return merged;
            });
          })
      .subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[loaded]);

  // ── Detect other open tabs via BroadcastChannel ──
  useEffect(()=>{
    let bc;
    try{ bc=new BroadcastChannel("garden_tabs"); }catch(e){ return; }
    const seen={};
    const announce=()=>{try{bc.postMessage({sid:MY_SID,t:Date.now()});}catch(e){}};
    const cleanup=()=>{
      const now=Date.now();
      Object.keys(seen).forEach(sid=>{if(now-seen[sid]>8000)delete seen[sid];});
      setOtherTabs(Object.keys(seen).length);
    };
    bc.onmessage=(ev)=>{
      const d=ev.data||{};
      if(d.sid && d.sid!==MY_SID){
        seen[d.sid]=Date.now();
        // Respond so the new tab knows about us too
        announce();
      }
      cleanup();
    };
    announce();
    const announceInt=setInterval(announce,3000);
    const cleanInt=setInterval(cleanup,2000);
    return ()=>{clearInterval(announceInt);clearInterval(cleanInt);try{bc.close();}catch(e){}};
  },[]);

  const up=fn=>setData(p=>{const n=JSON.parse(JSON.stringify(p));fn(n);return n;});
  // Force immediate save - returns promise
  const forceSave=async()=>{
    setSyncStatus("saving");
    const ok=await save(data);
    setSyncStatus(ok?"saved":"error");
    return ok;
  };

  // Auto-fix: if startTime > endTime OR invalid times, swap or reset
  useEffect(()=>{
    if(!loaded)return;
    let needsFix=false;
    const isValidTime=(t)=>{if(!t||typeof t!=="string")return false;const m=t.match(/^(\d{1,2}):(\d{1,2})$/);if(!m)return false;return +m[1]<=23 && +m[2]<=59;};
    const att=data.attendance||{};
    Object.keys(att).forEach(dy=>{
      Object.keys(att[dy]||{}).forEach(wid=>{
        const a=att[dy][wid];
        if(!a)return;
        // Check for invalid times (like "30:07")
        if(a.startTime && !isValidTime(a.startTime))needsFix=true;
        if(a.endTime && !isValidTime(a.endTime))needsFix=true;
        // Check for swapped times
        if(a.startTime && a.endTime && isValidTime(a.startTime) && isValidTime(a.endTime) && a.startTime>a.endTime){
          needsFix=true;
        }
      });
    });
    if(needsFix){
      up(d=>{
        const def_s=d.defaultStartTime||"07:00";
        const def_e=d.defaultEndTime||"16:00";
        Object.keys(d.attendance||{}).forEach(dy=>{
          Object.keys(d.attendance[dy]||{}).forEach(wid=>{
            const a=d.attendance[dy][wid];
            if(!a)return;
            // Reset invalid times to defaults
            if(a.startTime && !isValidTime(a.startTime))a.startTime=def_s;
            if(a.endTime && !isValidTime(a.endTime))a.endTime=def_e;
            // Swap if reversed
            if(a.startTime && a.endTime && a.startTime>a.endTime){
              const tmp=a.startTime;
              a.startTime=a.endTime;
              a.endTime=tmp;
            }
          });
        });
      });
    }
  },[loaded]);

  const allSites=useMemo(()=>[...(data.maintenanceSites||[]).map(s=>({...s,type:"m"})),...(data.devSites||[]).map(s=>({...s,type:"d"}))],[data.maintenanceSites,data.devSites]);

  const readInvoice=async(imgDataUrl)=>{
    setForm(p=>({...p,invReading:true,invError:""}));
    try{
      const m=imgDataUrl.match(/^data:(image\/[a-z]+);base64,(.+)$/);
      if(!m)throw new Error("bad image");
      const mediaType=m[1], b64=m[2];
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1000,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mediaType,data:b64}},
            {type:"text",text:"זוהי חשבונית או תעודת משלוח בעברית. חלץ את הפרטים והחזר אך ורק JSON תקין (בלי טקסט נוסף, בלי backticks) במבנה: {\"supplier\":\"שם הספק\",\"amount\":מספר הסכום הכולל לתשלום או 0,\"date\":\"YYYY-MM-DD או ריק\",\"items\":\"תיאור קצר של הפריטים העיקריים\"}. אם פרט חסר השאר מחרוזת ריקה או 0."}
          ]}]
        })
      });
      const data2=await resp.json();
      let txt=(data2.content||[]).map(i=>i.type==="text"?i.text:"").join("").trim();
      txt=txt.replace(/```json/g,"").replace(/```/g,"").trim();
      const parsed=JSON.parse(txt);
      setForm(p=>({...p,invReading:false,
        invSupplier:parsed.supplier||"",
        invAmount:parsed.amount?String(parsed.amount):"",
        invDate:parsed.date||p.invDate||todayISO,
        invItems:parsed.items||""}));
    }catch(err){
      setForm(p=>({...p,invReading:false,invError:"לא הצלחתי לקרוא אוטומטית - מלא ידנית"}));
    }
  };

  // ─── Actions ───

    const daySubs=(data.subContracts||[]).filter(s=>(s.dates||[]).includes(dy));
    const presentCount=Object.values(data.attendance?.[dy]||{}).filter(v=>v?.present).length;
    const openTasks=tasks.filter(t=>t.status!=="done").length;
    const doneTasks=tasks.filter(t=>t.status==="done").length;
    const isToday=dy===todayISO;
    const heb=getHebrewDate(selDay);
    const holiday=getHoliday(selDay);
    const tabs=[{key:"tasks",icon:"✅",label:"משימות",count:openTasks},{key:"workers",icon:"🧑",label:"נוכחות",count:presentCount},{key:"trips",icon:"🚗",label:"נסיעות",count:dayTrips.length},{key:"meetings",icon:"📅",label:"פגישות",count:dayMeetings.filter(m=>!m.done).length},{key:"summary",icon:"📊",label:"סיכום",count:0}];

    return <div style={{padding:16}}>
      {/* Date navigation */}
      <div style={{background:isToday?C.grnP:C.wht,borderRadius:14,border:"2px solid "+(isToday?C.grn:C.bdr),padding:"12px 14px",marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <button onClick={()=>{const d=new Date(selDay);d.setDate(d.getDate()+1);setSelDay(d);}} style={{background:"rgba(0,0,0,0.05)",border:"none",fontSize:22,cursor:"pointer",color:C.txt,width:36,height:36,borderRadius:"50%",fontFamily:"inherit",fontWeight:700}}>{"‹"}</button>
          <div style={{textAlign:"center",flex:1}}>
            <div style={{fontSize:18,fontWeight:700,color:isToday?C.grn:C.txt}}>{isToday?"היום":fmtHeb(selDay)}</div>
            <div style={{fontSize:12,color:C.txtM,display:"flex",justifyContent:"center",gap:8,marginTop:2}}>
              <span>{"יום "+DAYNAMES[selDay.getDay()]}</span>
              {heb && <span>{"· "+heb.full}</span>}
            </div>
            {holiday && <div style={{marginTop:4,padding:"3px 10px",background:C.org,color:"#fff",borderRadius:12,fontSize:11,fontWeight:700,display:"inline-block"}}>{"🕎 "+holiday}</div>}
          </div>
          <button onClick={()=>{const d=new Date(selDay);d.setDate(d.getDate()-1);setSelDay(d);}} style={{background:"rgba(0,0,0,0.05)",border:"none",fontSize:22,cursor:"pointer",color:C.txt,width:36,height:36,borderRadius:"50%",fontFamily:"inherit",fontWeight:700}}>{"›"}</button>
        </div>
        {!isToday && <div style={{textAlign:"center",marginTop:8}}>
          <button onClick={()=>setSelDay(new Date())} style={{padding:"4px 12px",borderRadius:14,border:"1px solid "+C.grn,background:C.grnP,color:C.grn,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"חזור להיום"}</button>
        </div>}
      </div>

      {/* Quick action: prominent camera + small settings */}
      <div style={{display:"flex",gap:6,marginBottom:dayMeetings.length>0?8:12}}>
        <button onClick={()=>{setExpImg(null);setExpStep(0);setForm({});setModal("quickPhoto");}} style={{flex:1,padding:14,borderRadius:12,border:"none",background:C.hdr,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
          <span style={{fontSize:20}}>📸</span>{"צלם תמונה"}
        </button>
        <button onClick={()=>setModal("dayActions")} style={{padding:"14px 16px",borderRadius:12,border:"1.5px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:18,cursor:"pointer",fontFamily:"inherit"}}>
          {"⚙️"}
        </button>
      </div>

      {/* Today's meetings - prominent strip if any */}
      {dayMeetings.length>0 && <div style={{background:C.purpB,border:"2px solid "+C.purp,borderRadius:12,padding:10,marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,color:C.purp,marginBottom:6,textAlign:"right"}}>{"📅 פגישות היום"}</div>
        {dayMeetings.map(m=>{
          const meetingSite=[...(data.maintenanceSites||[]),...(data.devSites||[])].find(s=>s.id===m.siteId);
          return <div key={m.id} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",background:"#fff",borderRadius:8,marginBottom:4,border:"1px solid "+C.purp}}>
            <span style={{fontSize:14,fontWeight:700,color:C.purp}}>{m.time||""}</span>
            <div style={{flex:1,textAlign:"right",fontSize:12}}>
              <div style={{fontWeight:600}}>{meetingSite?meetingSite.name:m.customPlace||"פגישה"}</div>
              {m.notes && <div style={{fontSize:11,color:C.txtM}}>{m.notes}</div>}
            </div>
          </div>;
        })}
      </div>}

      <div style={{display:"flex",background:C.cardA,borderRadius:12,padding:3,marginBottom:14,gap:2,overflow:"auto"}}>{tabs.map(t=><button key={t.key} onClick={()=>setDailyTab(t.key)} style={{flex:"0 0 auto",minWidth:60,padding:"9px 8px",borderRadius:10,border:"none",cursor:"pointer",fontSize:11,fontWeight:dailyTab===t.key?700:400,background:dailyTab===t.key?C.grn:"transparent",color:dailyTab===t.key?"#fff":C.txtM,fontFamily:"inherit",whiteSpace:"nowrap",position:"relative"}}>{t.icon} {t.label}{t.count>0 && <span style={{marginInlineStart:4,padding:"1px 5px",borderRadius:8,fontSize:9,background:dailyTab===t.key?"rgba(255,255,255,0.3)":C.grn,color:"#fff",fontWeight:700}}>{t.count}</span>}</button>)}</div>

      {/* WORKERS */}
      {dailyTab==="workers"&&<div>
        {(data.workers||[]).filter(w=>w.type!=="sub").map(w=>{const a=getAtt(dy,w.id);
          // Get current site IDs (supports both old single siteId and new siteIds array)
          const currentSiteIds=Array.isArray(a.siteIds)?a.siteIds:(a.siteId?[a.siteId]:[]);
          const toggleSite=(sid)=>{
            up(d=>{
              if(!d.attendance)d.attendance={};
              if(!d.attendance[dy])d.attendance[dy]={};
              const c=d.attendance[dy][w.id]||{present:true,startTime:(d.defaultStartTime||"07:00"),endTime:(d.defaultEndTime||"16:00")};
              const cur=Array.isArray(c.siteIds)?c.siteIds:(c.siteId?[c.siteId]:[]);
              const idx=cur.indexOf(sid);
              const nextIds=idx>=0?cur.filter(x=>x!==sid):[...cur,sid];
              d.attendance[dy][w.id]={...c,siteIds:nextIds,siteId:nextIds[0]||""};
            });
          };
          return <div key={w.id} style={{background:a.present?C.grnP:C.wht,borderRadius:14,border:"2px solid "+(a.present?C.grn:C.bdr),padding:"12px 14px",marginBottom:10}}>
          <div onClick={()=>togAtt(dy,w.id)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",marginBottom:a.present?8:(a.absenceReason?6:0)}}>
            <span style={{fontSize:28}}>{a.present?"✅":"⬜"}</span>
            <div style={{textAlign:"right"}}>
              <span style={{fontSize:18,fontWeight:700}}>{w.name}</span>
              {!a.present && a.absenceReason && a.absenceReason.trim() && <div style={{fontSize:12,color:C.org,marginTop:2,fontWeight:600}}>{a.absenceReason}</div>}
            </div>
          </div>
          {a.present&&<div>
            {/* Hours - explicit RTL container ensures from-time on the right */}
            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8,direction:"rtl"}}>
              <span style={{fontSize:11,color:C.txtM}}>{"שעות:"}</span>
              <input type="time" value={a.startTime||dStart()} onChange={e=>upAtt(dy,w.id,"startTime",e.target.value)} style={{padding:"6px",borderRadius:8,border:"1px solid "+C.bdr,fontSize:14,fontFamily:"inherit",width:85,textAlign:"center",direction:"ltr"}}/>
              <span style={{fontSize:11,color:C.txtM}}>{"עד"}</span>
              <input type="time" value={a.endTime||dEnd()} onChange={e=>upAtt(dy,w.id,"endTime",e.target.value)} style={{padding:"6px",borderRadius:8,border:"1px solid "+C.bdr,fontSize:14,fontFamily:"inherit",width:85,textAlign:"center",direction:"ltr"}}/>
            </div>
            {/* Sites - multi-select chips */}
            <div style={{fontSize:11,color:C.txtM,marginBottom:5,textAlign:"right"}}>{"באילו אתרים?"}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
              {allSites.map(s=>{const sel=currentSiteIds.includes(s.id);return <button key={s.id} onClick={()=>toggleSite(s.id)} style={{padding:"5px 10px",borderRadius:14,border:"1.5px solid "+(sel?C.grn:C.bdr),background:sel?C.grn:"#fff",color:sel?"#fff":C.txt,fontSize:11,fontWeight:sel?700:500,cursor:"pointer",fontFamily:"inherit"}}>{(sel?"✓ ":"")+s.name}</button>;})}
              <button onClick={()=>setModal("addSiteQuick")} style={{padding:"5px 10px",borderRadius:14,border:"1.5px dashed "+C.blu,background:"#fff",color:C.blu,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"➕ אתר חדש"}</button>
            </div>
          </div>}
          {!a.present&&(()=>{
            const reasons=["🏖 חופש","🤒 מחלה","🩹 פציעה","🪖 מילואים","👨‍👩‍👧 אישי"];
            const currentReason=a.absenceReason||"";
            const isCustom=currentReason && !reasons.includes(currentReason);
            const setReason=(r)=>upAtt(dy,w.id,"absenceReason",r);
            return <div style={{marginTop:4}}>
              <div style={{fontSize:11,color:C.txtM,marginBottom:5,textAlign:"right"}}>{"סיבת היעדרות (אופציונלי):"}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
                {reasons.map(r=>{const sel=currentReason===r;return <button key={r} onClick={()=>setReason(sel?"":r)} style={{padding:"5px 10px",borderRadius:14,border:"1.5px solid "+(sel?C.org:C.bdr),background:sel?C.org:"#fff",color:sel?"#fff":C.txt,fontSize:11,fontWeight:sel?700:500,cursor:"pointer",fontFamily:"inherit"}}>{r}</button>;})}
                <button onClick={()=>{if(!isCustom)setReason(" ");}} style={{padding:"5px 10px",borderRadius:14,border:"1.5px "+(isCustom?"solid":"dashed")+" "+C.blu,background:isCustom?C.blu:"#fff",color:isCustom?"#fff":C.blu,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"✏️ אחר"}</button>
              </div>
              {isCustom && <input type="text" value={currentReason} onChange={e=>setReason(e.target.value)} placeholder="סיבה אחרת..." style={{width:"100%",padding:"7px 10px",borderRadius:8,border:"1px solid "+C.bdr,fontSize:13,fontFamily:"inherit",direction:"rtl",boxSizing:"border-box"}}/>}
            </div>;
          })()}
        </div>;})}
      </div>}

      {/* TASKS */}
      {dailyTab==="tasks"&&<div>

        {(()=>{const todaySubs=(data.subContracts||[]).filter(s=>(s.dates||[]).includes(dy));if(!todaySubs.length)return null;return <div style={{background:C.bluB,borderRadius:14,border:"2px solid "+C.blu,padding:12,marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,color:C.blu,marginBottom:8}}>{"🔨 קבלני משנה היום"}</div>
          {todaySubs.map(s=>{const isPlanned=s.status!=="done";return <div key={s.id} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+(isPlanned?C.bdr:C.grn)}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{padding:"2px 8px",borderRadius:10,fontSize:10,fontWeight:700,background:isPlanned?C.cardA:C.grnP,color:isPlanned?C.txtM:C.grn}}>{isPlanned?"מתוכנן":"✓ בוצע"}</span>
              <span style={{fontSize:16,fontWeight:700}}>{s.name}</span>
            </div>
            <div style={{fontSize:11,color:C.txtM,lineHeight:1.7}}>
              {s.siteId && <div>{"📍 "+sn(s.siteId)}</div>}
              {!isPlanned && <React.Fragment>
                <div>{"👷 "+(s.workerCount||1)+" עובדים · 🕒 "+(s.hoursFrom||"?")+"-"+(s.hoursTo||"?")}</div>
                {s.notes && <div style={{padding:"4px 8px",background:C.cardA,borderRadius:6,marginTop:4}}>{"📝 "+s.notes}</div>}
              </React.Fragment>}
            </div>
            {isPlanned && <button onClick={()=>{setForm({subId:s.id,subWorkerCount:1,subFrom:dStart(),subTo:dEnd(),subNotes:""});setModal("completeSub");}} style={{marginTop:8,width:"100%",padding:"8px",borderRadius:8,border:"1px solid "+C.grn,background:C.grnP,color:C.grn,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"✓ מילוי פרטי ביצוע"}</button>}
            <button onClick={()=>{setForm({subId:s.id,subDate:dy});setModal("confirmDelSub");}} style={{marginTop:6,width:"100%",padding:"7px",borderRadius:8,border:"1px solid "+C.red,background:"#fff",color:C.red,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"🗑 מחק"}</button>
          </div>;})}
        </div>;})()}

        {/* Free tasks */}
        {(()=>{const free=tasks.filter(t=>!t.siteId);if(!free.length)return null;return <div style={{background:C.wht,borderRadius:14,border:"1px solid "+C.bdr,padding:14,marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:8}}>{"📌 משימות כלליות"}</div>
          {free.map(t=><div key={t.id} style={{padding:"10px 14px",borderRadius:10,marginBottom:6,background:t.status==="done"?C.grnP:C.cardA,border:"1px solid "+(t.status==="done"?C.grnL:C.bdr)}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span onClick={()=>togTask(dy,t.id)} style={{fontSize:22,cursor:"pointer"}}>{t.status==="done"?"✅":"⬜"}</span>
                <span onClick={()=>{setForm({editTaskId:t.id,editTaskDate:dy,notes:t.notes,siteId:t.siteId||"",image:t.image||""});setModal("editTask");}} style={{fontSize:14,color:C.blu,cursor:"pointer"}}>{"✏️"}</span>
                <span onClick={()=>confirmDel(t.notes||"משימה זו",()=>delTask(dy,t.id))} style={{fontSize:14,color:C.red,cursor:"pointer"}}>🗑</span>
              </div>
              <span onClick={()=>togTask(dy,t.id)} style={{fontSize:14,fontWeight:500,textDecoration:t.status==="done"?"line-through":"none",textAlign:"right",flex:1,cursor:"pointer"}}>{t.notes}</span>
            </div>
            {t.image && <img src={t.image} onClick={e=>{e.stopPropagation();setZoomImg(t.image);}} style={{width:"100%",borderRadius:8,marginTop:8,maxHeight:200,objectFit:"cover",cursor:"zoom-in"}} alt=""/>}
          </div>)}
        </div>;})()}

        {assigns.length===0&&tasks.filter(t=>!t.siteId).length===0&&<div style={{background:C.wht,borderRadius:14,padding:20,textAlign:"center",border:"1px solid "+C.bdr}}><span style={{color:C.txtL,fontSize:14}}>{"אין משימות ליום"}</span></div>}

        {/* Sites - collapsed cards, expand one at a time */}
        {assigns.length>0 && (()=>{
          // Compute progress
          const totalSites=assigns.length;
          const reportedSites=assigns.filter(a=>{
            const log=((data.dailyLogs||{})[dy]||{})[a.siteId];
            return log && (log.summary||(log.extras||[]).length>0);
          }).length;
          return <div style={{background:C.cardA,borderRadius:10,padding:"8px 12px",marginBottom:10,fontSize:12,fontWeight:700,color:C.txtM,textAlign:"right",border:"1px solid "+C.bdr}}>
            {"📋 דווח: "+reportedSites+"/"+totalSites+" אתרים"}
            {reportedSites===totalSites && totalSites>0 && <span style={{color:C.grn,marginInlineStart:6}}>{"✓ הכל דווח!"}</span>}
          </div>;
        })()}

        {assigns.map((a,siteIdx)=>{
          const st=tasks.filter(t=>t.siteId===a.siteId);
          const ic=a.type==="m"?"🔧":"🌱";
          const savedLog=((data.dailyLogs||{})[dy]||{})[a.siteId]||{summary:"",extras:[],reminders:[]};
          const hasLog=!!(savedLog.summary||(savedLog.extras||[]).length>0);
          const openTaskCount=st.filter(t=>t.status!=="done").length;
          const doneTaskCount=st.filter(t=>t.status==="done").length;
          const nextNotes=(data.nextVisitNotes?.[a.siteId]||[]).filter(n=>!n.done);
          const openLogModal=()=>{
            setForm({
              logSiteId:a.siteId,
              logDate:dy,
              logSummary:savedLog.summary||"",
              logExtras:[...(savedLog.extras||[])],
              logReminders:[...(savedLog.reminders||[])],
              logEquipment:[]
            });
            setModal("siteLog");
          };
          return <div key={a.siteId} style={{background:C.wht,borderRadius:14,border:"2px solid "+(hasLog?C.grn:openTaskCount>0?C.org:C.bdr),padding:0,marginBottom:10,overflow:"hidden"}}>
            {/* Header */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",background:hasLog?C.grnP:openTaskCount>0?"#fff7ed":"#fff",borderBottom:"1px solid "+C.bdr}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                {hasLog && <span style={{fontSize:11,padding:"3px 9px",borderRadius:10,background:C.grn,color:"#fff",fontWeight:700}}>{"✓ דווח"}</span>}
                {!hasLog && openTaskCount>0 && <span style={{fontSize:11,padding:"3px 9px",borderRadius:10,background:C.org,color:"#fff",fontWeight:700}}>{openTaskCount+" פתוחות"}</span>}
                <button onClick={()=>{setForm({moveSiteId:a.siteId,moveSiteName:sn(a.siteId),moveFromDay:dy});setModal("siteDayActions");}} title="פעולות" style={{background:"none",border:"1px solid "+C.bdr,color:C.txtM,fontSize:14,cursor:"pointer",padding:"2px 8px",borderRadius:6,fontFamily:"inherit",fontWeight:700}}>{"⋯"}</button>
              </div>
              <span onClick={()=>{setForm({siteId:a.siteId});setSiteDetailTab("overview");setModal("siteDetail");}} style={{fontWeight:700,fontSize:17,cursor:"pointer",textDecoration:"underline",textDecorationStyle:"dotted"}}>{ic+" "+sn(a.siteId)}</span>
            </div>

            {/* Content */}
            <div style={{padding:"12px 16px",background:"#fff"}}>

              {/* Tasks list - both done and pending */}
              {st.length>0 && <div style={{marginBottom:10}}>
                {st.map(t=><div key={t.id} style={{padding:"7px 10px",borderRadius:8,marginBottom:4,background:t.status==="done"?C.grnP:C.cardA,border:"1px solid "+(t.status==="done"?C.grnL:C.bdr)}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <span onClick={()=>togTask(dy,t.id)} style={{fontSize:18,cursor:"pointer"}}>{t.status==="done"?"✅":"⬜"}</span>
                      <span onClick={()=>{setForm({editTaskId:t.id,editTaskDate:dy,notes:t.notes,siteId:t.siteId||"",image:t.image||""});setModal("editTask");}} style={{fontSize:11,color:C.blu,cursor:"pointer"}}>{"✏️"}</span>
                      <span onClick={()=>confirmDel(t.notes||"משימה זו",()=>delTask(dy,t.id))} style={{fontSize:11,color:C.red,cursor:"pointer"}}>🗑</span>
                    </div>
                    <span onClick={()=>togTask(dy,t.id)} style={{fontSize:13,fontWeight:500,textDecoration:t.status==="done"?"line-through":"none",textAlign:"right",flex:1,cursor:"pointer",color:t.status==="done"?C.txtM:C.txt}}>{t.notes}</span>
                  </div>
                  {t.image && <img src={t.image} onClick={e=>{e.stopPropagation();setZoomImg(t.image);}} style={{width:"100%",borderRadius:6,marginTop:6,maxHeight:160,objectFit:"cover",cursor:"zoom-in"}} alt=""/>}
                </div>)}
              </div>}

              {/* Next visit notes */}
              {nextNotes.length>0 && <div style={{background:C.purpB,borderRadius:8,padding:"8px 10px",marginBottom:10,border:"1px solid "+C.purp}}>
                <div style={{fontSize:11,fontWeight:700,color:C.purp,marginBottom:4}}>{"💡 הערות לטיפול"}</div>
                {nextNotes.map(n=><div key={n.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,padding:"3px 0"}}>
                  <span onClick={()=>togNextVisit(a.siteId,n.id)} style={{cursor:"pointer"}}>⬜</span>
                  <span style={{flex:1,textAlign:"right"}}>{n.text}</span>
                </div>)}
              </div>}

              {/* Show saved daily log if exists */}
              {hasLog && <div style={{background:C.grnP,borderRadius:8,padding:"8px 10px",marginBottom:10,border:"1px solid "+C.grn}}>
                {savedLog.summary && <div style={{fontSize:12,marginBottom:4}}>
                  <span style={{fontWeight:700,color:C.grn}}>{"📝 "}</span>{savedLog.summary}
                </div>}
                {(savedLog.extras||[]).filter(e=>e.desc).length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}}>
                  {savedLog.extras.filter(e=>e.desc).map((ex,i)=><span key={i} style={{fontSize:10,padding:"3px 7px",background:"#fff7ed",color:C.org,borderRadius:10,border:"1px solid "+C.org,fontWeight:600}}>{"💰 "+ex.desc+(ex.qty?" · "+ex.qty:"")}</span>)}
                </div>}
                {(savedLog.reminders||[]).filter(r=>r.text&&!r.done).length>0 && <div style={{marginTop:6,fontSize:11,color:C.blu}}>
                  {"🔔 "+savedLog.reminders.filter(r=>r.text&&!r.done).map(r=>r.text).join(" · ")}
                </div>}
              </div>}

              {/* Action button */}
              <button onClick={openLogModal} style={{width:"100%",padding:"10px",borderRadius:10,border:"none",background:hasLog?C.bluB:C.org,color:hasLog?C.blu:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",border:hasLog?"1.5px solid "+C.blu:"none"}}>{hasLog?"✏️ ערוך דיווח":"📝 דווח על האתר"}</button>
            </div>
          </div>;
        })}
      </div>}

      {/* TRIPS */}
      {dailyTab==="trips"&&<div>

      const tomorrow=(()=>{const d=new Date(fromDay);d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);})();
      const dayAfter=(()=>{const d=new Date(fromDay);d.setDate(d.getDate()+2);return d.toISOString().slice(0,10);})();
      const nextWeek=(()=>{const d=new Date(fromDay);d.setDate(d.getDate()+7);return d.toISOString().slice(0,10);})();

      const doMove=(tDate)=>{
        if(!tDate||tDate===fromDay)return;
        // Find the type from the source assignment
        up(d=>{
          if(!d.weekAssign||!d.weekAssign[fromDay])return;
          const item=d.weekAssign[fromDay].find(x=>x.siteId===siteId);
          if(!item)return;
          // Remove from source day
          d.weekAssign[fromDay]=d.weekAssign[fromDay].filter(x=>x.siteId!==siteId);
          // Add to target day (if not already there)
          if(!d.weekAssign[tDate])d.weekAssign[tDate]=[];
          if(!d.weekAssign[tDate].some(x=>x.siteId===siteId)){
            d.weekAssign[tDate].push({siteId,type:item.type});
          }
        });
        setModal(null);
        setForm({});
      };

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:420,padding:18}}>
        <h3 style={{textAlign:"right",marginBottom:6,fontSize:17}}>{"📅 העבר ליום אחר"}</h3>
        <div style={{textAlign:"right",fontSize:13,color:C.txtM,marginBottom:14}}>{siteName}</div>

        <div style={{fontSize:11,color:C.txtM,marginBottom:6,textAlign:"right"}}>{"בחירה מהירה:"}</div>
        <button onClick={()=>doMove(tomorrow)} style={{width:"100%",padding:12,marginBottom:6,borderRadius:10,border:"1.5px solid "+C.blu,background:"#fff",color:C.blu,cursor:"pointer",fontFamily:"inherit",textAlign:"right",fontSize:13,fontWeight:700}}>
          {"➡️ מחר ("+fmtFull(new Date(tomorrow))+")"}
        </button>
        <button onClick={()=>doMove(dayAfter)} style={{width:"100%",padding:12,marginBottom:6,borderRadius:10,border:"1.5px solid "+C.blu,background:"#fff",color:C.blu,cursor:"pointer",fontFamily:"inherit",textAlign:"right",fontSize:13,fontWeight:700}}>
          {"➡️ מחרתיים ("+fmtFull(new Date(dayAfter))+")"}
        </button>
        <button onClick={()=>doMove(nextWeek)} style={{width:"100%",padding:12,marginBottom:12,borderRadius:10,border:"1.5px solid "+C.blu,background:"#fff",color:C.blu,cursor:"pointer",fontFamily:"inherit",textAlign:"right",fontSize:13,fontWeight:700}}>
          {"➡️ שבוע הבא ("+fmtFull(new Date(nextWeek))+")"}
        </button>

        <div style={{fontSize:11,color:C.txtM,marginBottom:6,textAlign:"right",marginTop:10,paddingTop:10,borderTop:"1px solid "+C.bdr}}>{"או בחר תאריך אחר:"}</div>
        <div style={{display:"flex",gap:6}}>
          <input type="date" value={targetDate} onChange={e=>setForm({...form,moveTargetDate:e.target.value})} min={fromDay} style={{flex:1,padding:"10px 12px",borderRadius:10,border:"1px solid "+C.bdr,fontSize:13,fontFamily:"inherit"}}/>
          <button onClick={()=>doMove(targetDate)} disabled={!targetDate} style={{padding:"10px 18px",borderRadius:10,border:"none",background:targetDate?C.blu:C.bdr,color:"#fff",fontSize:13,fontWeight:700,cursor:targetDate?"pointer":"not-allowed",fontFamily:"inherit",opacity:targetDate?1:0.5}}>{"העבר"}</button>
        </div>

        <button onClick={()=>{setForm({moveSiteId:siteId,moveSiteName:siteName,moveFromDay:fromDay});setModal("siteDayActions");}} style={{...sb,background:C.cardA,color:C.txt,marginTop:14}}>{"← חזור"}</button>
      </div></div>;
    }

    if(modal==="dayActions"){
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:420,padding:18}}>
        <h3 style={{textAlign:"right",marginBottom:14,fontSize:17}}>{"⚙️ פעולות נוספות"}</h3>

        <button onClick={()=>setModal("addToDay")} style={{width:"100%",padding:14,marginBottom:8,borderRadius:12,border:"2px solid "+C.grn,background:C.grnP,color:C.grn,cursor:"pointer",fontFamily:"inherit",textAlign:"right",fontSize:14,fontWeight:700}}>
          {"➕  הוסף ללוח היום"}
        </button>

        <button onClick={()=>{setForm({meetingSiteId:"",meetingDate:selISO,meetingTime:"",meetingNotes:"",meetingCustomPlace:""});setModal("addMeeting");}} style={{width:"100%",padding:14,marginBottom:8,borderRadius:12,border:"2px solid "+C.purp,background:C.purpB,color:C.purp,cursor:"pointer",fontFamily:"inherit",textAlign:"right",fontSize:14,fontWeight:700}}>
          {"📅  הוסף פגישה"}
        </button>

        <button onClick={()=>{setForm({tripDate:selISO,tripPlace:"",tripNote:""});setModal("addTrip");}} style={{width:"100%",padding:14,marginBottom:8,borderRadius:12,border:"2px solid "+C.purp,background:C.purpB,color:C.purp,cursor:"pointer",fontFamily:"inherit",textAlign:"right",fontSize:14,fontWeight:700}}>
          {"🚗  הוסף נסיעה"}
        </button>

        <button onClick={()=>{setDailyTab("workers");setModal(null);}} style={{width:"100%",padding:14,marginBottom:8,borderRadius:12,border:"2px solid "+C.bdr,background:C.cardA,color:C.txt,cursor:"pointer",fontFamily:"inherit",textAlign:"right",fontSize:14,fontWeight:700}}>
          {"🧑  סמן נוכחות עובדים"}
        </button>

        <button onClick={close} style={{...sb,background:C.cardA,color:C.txt,marginTop:6}}>{"ביטול"}</button>
      </div></div>;
    }

    // ─── ADD TO DAY MENU ───
    if(modal==="addToDay"){
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:420,padding:18}}>
        <h3 style={{textAlign:"right",marginBottom:14,fontSize:17}}>{"➕ הוסף ללוח היום"}</h3>
        <div style={{fontSize:11,color:C.txtM,marginBottom:14,textAlign:"right"}}>{fmtFull(new Date(selISO))}</div>

        <button onClick={()=>{setModal("addSiteToDay");setForm({});}} style={{width:"100%",padding:14,marginBottom:8,borderRadius:12,border:"2px solid "+C.grn,background:C.grnP,color:C.grn,cursor:"pointer",fontFamily:"inherit",textAlign:"right"}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:3}}>{"🏠 הוסף לקוח/אתר ליום"}</div>
          <div style={{fontSize:11,color:C.txtM}}>{"לקוח שלא היה משובץ - יתווסף לרשימה של היום"}</div>
        </button>

        <button onClick={()=>{setForm({notes:"",siteId:"",type:"",image:"",taskDate:selISO});setModal("addTask");}} style={{width:"100%",padding:14,marginBottom:8,borderRadius:12,border:"2px solid "+C.blu,background:C.bluB,color:C.blu,cursor:"pointer",fontFamily:"inherit",textAlign:"right"}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:3}}>{"📋 משימה כללית"}</div>
          <div style={{fontSize:11,color:C.txtM}}>{"משימה כללית - לקנות חומרים, התקשרויות וכד'"}</div>
        </button>

        <button onClick={()=>{setForm({extendSiteId:"",extendDays:1});setModal("extendProject");}} style={{width:"100%",padding:14,marginBottom:8,borderRadius:12,border:"2px solid "+C.org,background:"#fff7ed",color:C.org,cursor:"pointer",fontFamily:"inherit",textAlign:"right"}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:3}}>{"🔄 הארך פרויקט קיים"}</div>
          <div style={{fontSize:11,color:C.txtM}}>{"פרויקט שלא נגמר - להוסיף עוד ימים"}</div>
        </button>

        <button onClick={close} style={{...sb,background:C.cardA,color:C.txt,marginTop:6}}>{"ביטול"}</button>
      </div></div>;
    }

    // ─── ADD SITE TO DAY ───
    if(modal==="addSiteToDay"){
      const allSites=[...(data.maintenanceSites||[]).map(s=>({...s,_isMaint:true})),...(data.devSites||[]).filter(s=>s.status!=="done").map(s=>({...s,_isMaint:false}))];
      // Find sites already assigned today (correct structure: weekAssign[ISO date] = [{siteId, type}])
      const todayAssigns=(data.weekAssign||{})[selISO]||[];
      const alreadyAssigned=new Set(todayAssigns.map(a=>a.siteId));
      const availableSites=allSites.filter(s=>!alreadyAssigned.has(s.id));
      const selectedSiteId=form.targetSiteId||"";

      const doAdd=()=>{
        if(!selectedSiteId)return;
        // Find the site type
        const isMaint=(data.maintenanceSites||[]).some(s=>s.id===selectedSiteId);
        const type=isMaint?"m":"d";
        up(d=>{
          if(!d.weekAssign)d.weekAssign={};
          if(!d.weekAssign[selISO])d.weekAssign[selISO]=[];
          // Don't add duplicate
          if(!d.weekAssign[selISO].some(a=>a.siteId===selectedSiteId)){
            d.weekAssign[selISO].push({siteId:selectedSiteId,type});
          }
        });
        setModal(null);
        setForm({});
      };

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:480,padding:18,maxHeight:"90vh",overflowY:"auto"}}>
        <h3 style={{textAlign:"right",marginBottom:6,fontSize:17}}>{"🏠 הוסף לקוח/אתר ליום"}</h3>
        <div style={{fontSize:11,color:C.txtM,marginBottom:14,textAlign:"right"}}>{fmtFull(new Date(selISO))}</div>

        <label style={{...lb,fontSize:12}}>{"🏠 בחר לקוח / אתר:"}</label>
        {availableSites.length===0 ? <div style={{padding:14,textAlign:"center",color:C.txtM,fontSize:12}}>{"כל הלקוחות כבר משובצים היום"}</div> : <div style={{maxHeight:380,overflowY:"auto",border:"1px solid "+C.bdr,borderRadius:10,marginBottom:14}}>
          {availableSites.map(s=><div key={s.id} onClick={()=>setForm({...form,targetSiteId:s.id})} style={{padding:"12px 14px",borderBottom:"1px solid "+C.bdr,cursor:"pointer",background:selectedSiteId===s.id?C.grnP:"#fff",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:13,color:selectedSiteId===s.id?C.grn:C.txtL,fontWeight:700}}>{selectedSiteId===s.id?"✓":""}</span>
            <span style={{fontWeight:selectedSiteId===s.id?700:500,fontSize:14,textAlign:"right"}}>{(s._isMaint?"🔧 ":"🌱 ")+s.name}</span>
          </div>)}
        </div>}

        <button onClick={doAdd} disabled={!selectedSiteId} style={{...sb,background:selectedSiteId?C.grn:C.bdr,opacity:selectedSiteId?1:0.5}}>{"הוסף ליום"}</button>

        <button onClick={()=>{setModal("addToDay");}} style={{...sb,background:C.cardA,color:C.txt,marginTop:6}}>{"← חזור"}</button>
      </div></div>;
    }

    // ─── EXTEND PROJECT ───
    if(modal==="extendProject"){
      // Find sites currently assigned this day (correct structure: weekAssign[ISO date] = [{siteId, type}])
      const todayAssigns=(data.weekAssign||{})[selISO]||[];
      const allSites=[...(data.maintenanceSites||[]),...(data.devSites||[])];
      const todayAssignedSites=todayAssigns.map(a=>allSites.find(s=>s.id===a.siteId)).filter(Boolean);

      const selSite=form.extendSiteId||"";
      const days=form.extendDays||1;

      const doExtend=()=>{
        if(!selSite||!days)return;
        const isMaint=(data.maintenanceSites||[]).some(s=>s.id===selSite);
        const type=isMaint?"m":"d";
        // Add the site to the next N days
        up(d=>{
          if(!d.weekAssign)d.weekAssign={};
          for(let i=1;i<=days;i++){
            const futureDate=new Date(selISO);
            futureDate.setDate(futureDate.getDate()+i);
            const futureISO=futureDate.toISOString().slice(0,10);
            if(!d.weekAssign[futureISO])d.weekAssign[futureISO]=[];
            // Don't add duplicate
            if(!d.weekAssign[futureISO].some(a=>a.siteId===selSite)){
              d.weekAssign[futureISO].push({siteId:selSite,type});
            }
          }
        });
        setModal(null);
        setForm({});
      };

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:480,padding:18}}>
        <h3 style={{textAlign:"right",marginBottom:6,fontSize:17}}>{"🔄 הארך פרויקט"}</h3>
        <div style={{fontSize:11,color:C.txtM,marginBottom:14,textAlign:"right"}}>{"בחר פרויקט מהיום והוסף אותו לימים הקרובים"}</div>

        {todayAssignedSites.length===0 ? <div style={{padding:20,textAlign:"center",background:"#fee",borderRadius:10,marginBottom:12,color:C.red,fontSize:13}}>
          {"אין פרויקטים משובצים ביום זה"}
        </div> : <React.Fragment>

        <label style={{...lb,fontSize:12}}>{"בחר פרויקט/אתר מהיום:"}</label>
        <div style={{maxHeight:200,overflowY:"auto",border:"1px solid "+C.bdr,borderRadius:10,marginBottom:14}}>
          {todayAssignedSites.map(s=>{
            const isMaint=(data.maintenanceSites||[]).some(m=>m.id===s.id);
            return <div key={s.id} onClick={()=>setForm({...form,extendSiteId:s.id})} style={{padding:"10px 12px",borderBottom:"1px solid "+C.bdr,cursor:"pointer",background:selSite===s.id?C.grnP:"#fff",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:11,color:C.txtL}}>{selSite===s.id?"✓":""}</span>
              <span style={{fontWeight:selSite===s.id?700:500,fontSize:13}}>{(isMaint?"🔧 ":"🌱 ")+s.name}</span>
            </div>;
          })}
        </div>

        <label style={{...lb,fontSize:12}}>{"להאריך לכמה ימים נוספים:"}</label>
        <div style={{display:"flex",gap:6,marginBottom:14}}>
          {[1,2,3,4,5].map(n=><button key={n} onClick={()=>setForm({...form,extendDays:n})} style={{flex:1,padding:"10px 4px",borderRadius:10,border:"1.5px solid "+(days===n?C.grn:C.bdr),background:days===n?C.grnP:"#fff",color:days===n?C.grn:C.txt,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13}}>{n+(n===1?" יום":" ימים")}</button>)}
        </div>

        <button onClick={doExtend} disabled={!selSite} style={{...sb,background:selSite?C.grn:C.bdr,opacity:selSite?1:0.5}}>{"הארך"}</button>
        </React.Fragment>}

        <button onClick={()=>{setModal("addToDay");}} style={{...sb,background:C.cardA,color:C.txt,marginTop:6}}>{"← חזור"}</button>
      </div></div>;
    }


    // ─── SITE DAILY LOG (per-site daily summary modal) ───
    // ─── GENERIC DELETE CONFIRMATION ───
    // ─── REMINDERS ARCHIVE ───
    // ─── MONTHLY REPORT (DETAILED) ───
    if(modal==="monthlyReport"){
      const today=new Date();
      const reportMode=form.reportMode||"month";
      const reportMonth=form.reportMonth!=null?form.reportMonth:today.getMonth();
      const reportYear=form.reportYear!=null?form.reportYear:today.getFullYear();
      let monthStart,monthEnd,monthName;
      if(reportMode==="week"){
        let ws;
        if(form.reportWeekStart){const _p=form.reportWeekStart.split("-");ws=new Date(+_p[0],+_p[1]-1,+_p[2]);}
        else{ws=new Date(today.getFullYear(),today.getMonth(),today.getDate());ws.setDate(ws.getDate()-ws.getDay());}
        monthStart=ws;monthEnd=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6);
        monthName="שבוע "+monthStart.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})+"–"+monthEnd.toLocaleDateString("he-IL",{day:"numeric",month:"numeric",year:"numeric"});
      }else{
        monthStart=new Date(reportYear,reportMonth,1);
        monthEnd=new Date(reportYear,reportMonth+1,0);
        monthName=monthStart.toLocaleDateString("he-IL",{month:"long",year:"numeric"});
      }
      const monthStartISO=iso(monthStart);
      const monthEndISO=iso(monthEnd);
      const reportTab=form.reportTab||"overview";

      const inMonth=(dateStr)=>dateStr>=monthStartISO && dateStr<=monthEndISO;

      // Helper to parse "07:00" to minutes
      const timeToMin=(t)=>{if(!t||typeof t!=="string")return 0;const m=t.match(/^(\d{1,2}):(\d{1,2})$/);if(!m)return 0;return (+m[1])*60+(+m[2]);};

      // Expected visits per frequency
      const expectedVisitsByFreq={
        "2 פעמים בשבוע":8,
        "כל שבוע":4,
        "דו שבועי":2,
        "פעמיים בחודש":2,
        "פעם בחודש":1
      };

      // ── DATA AGGREGATION ──

      // 1. Site visits
      const siteVisits={};
      Object.keys(data.weekAssign||{}).forEach(d=>{
        if(!inMonth(d))return;
        (data.weekAssign[d]||[]).forEach(a=>{
          if(!siteVisits[a.siteId])siteVisits[a.siteId]={count:0,dates:[],type:a.type};
          siteVisits[a.siteId].count++;
          siteVisits[a.siteId].dates.push(d);
        });
      });

      // 2. Worker stats
      const workerStats={};
      (data.workers||[]).filter(w=>w.type!=="sub").forEach(w=>{
        workerStats[w.id]={name:w.name,present:0,absent:0,totalMinutes:0,reasons:{},sitesByWorker:{},dailyHours:[]};
      });
      Object.keys(data.attendance||{}).forEach(d=>{
        if(!inMonth(d))return;
        Object.keys(data.attendance[d]||{}).forEach(wid=>{
          if(!workerStats[wid])return;
          const a=data.attendance[d][wid];
          if(a.present){
            workerStats[wid].present++;
            const start=timeToMin(a.startTime||"07:00");
            const end=timeToMin(a.endTime||"16:00");
            const hours=Math.max(0,end-start);
            workerStats[wid].totalMinutes+=hours;
            workerStats[wid].dailyHours.push({date:d,minutes:hours});
            // Track sites for worker
            const sites=Array.isArray(a.siteIds)?a.siteIds:(a.siteId?[a.siteId]:[]);
            sites.forEach(sid=>{
              if(!workerStats[wid].sitesByWorker[sid])workerStats[wid].sitesByWorker[sid]=0;
              workerStats[wid].sitesByWorker[sid]++;
            });
          } else if(a.absenceReason && a.absenceReason.trim()){
            workerStats[wid].absent++;
            const r=a.absenceReason;
            workerStats[wid].reasons[r]=(workerStats[wid].reasons[r]||0)+1;
          }
        });
      });

      // 3. Tasks
      let tasksCompleted=0,tasksOpen=0;
      const tasksBySite={};
      Object.keys(data.dailyTasks||{}).forEach(d=>{
        if(!inMonth(d))return;
        (data.dailyTasks[d]||[]).forEach(t=>{
          if(t.status==="done")tasksCompleted++;
          else tasksOpen++;
          if(t.siteId){
            if(!tasksBySite[t.siteId])tasksBySite[t.siteId]={done:0,open:0};
            if(t.status==="done")tasksBySite[t.siteId].done++;
            else tasksBySite[t.siteId].open++;
          }
        });
      });

      // 4. Reports
      const reportsBySite={};
      let totalReports=0;
      Object.keys(data.dailyLogs||{}).forEach(d=>{
        if(!inMonth(d))return;
        Object.keys(data.dailyLogs[d]||{}).forEach(sid=>{
          const log=data.dailyLogs[d][sid];
          if(log && (log.summary||(log.extras||[]).length>0)){
            totalReports++;
            if(!reportsBySite[sid])reportsBySite[sid]=[];
            reportsBySite[sid].push({date:d,...log});
          }
        });
      });

      // 5. Orders
      const ordersBySite={};
      let totalOrders=0,totalOrdersAmount=0;
      Object.keys(data.projectOrders||{}).forEach(pid=>{
        (data.projectOrders[pid]||[]).forEach(o=>{
          if(o.date && inMonth(o.date)){
            totalOrders++;
            totalOrdersAmount+=(+o.amount||0);
            if(!ordersBySite[pid])ordersBySite[pid]={count:0,amount:0,items:[]};
            ordersBySite[pid].count++;
            ordersBySite[pid].amount+=(+o.amount||0);
            ordersBySite[pid].items.push(o);
          }
        });
      });

      // 6. Billing extras
      const extrasBySite={};
      let totalExtras=0,totalExtrasAmount=0;
      Object.keys(data.dailyLogs||{}).forEach(d=>{
        if(!inMonth(d))return;
        Object.keys(data.dailyLogs[d]||{}).forEach(sid=>{
          const log=data.dailyLogs[d][sid];
          (log.extras||[]).forEach(ex=>{
            if(ex.desc){
              totalExtras++;
              const amt=+ex.amount||0;
              totalExtrasAmount+=amt;
              if(!extrasBySite[sid])extrasBySite[sid]={count:0,amount:0,items:[]};
              extrasBySite[sid].count++;
              extrasBySite[sid].amount+=amt;
              extrasBySite[sid].items.push({...ex,date:d});
            }
          });
        });
      });

      // 7. Trips & meetings
      let totalTrips=0;
      Object.keys(data.trips||{}).forEach(d=>{if(inMonth(d))totalTrips+=(data.trips[d]||[]).length;});
      let totalMeetings=0;
      Object.keys(data.meetings||{}).forEach(d=>{if(inMonth(d))totalMeetings+=(data.meetings[d]||[]).length;});

      // 8. Consistency check - missed visits
      const missedSites=[];
      (data.maintenanceSites||[]).forEach(s=>{
        const visits=(siteVisits[s.id]||{}).count||0;
        const expected=expectedVisitsByFreq[s.frequency]||0;
        if(expected>0){
          const ratio=visits/expected;
          if(ratio<1){
            missedSites.push({
              site:s,
              visits,
              expected,
              missing:expected-visits,
              ratio
            });
          }
        }
      });
      missedSites.sort((a,b)=>a.ratio-b.ratio);

      // Helper: format minutes to "H:MM"
      const fmtMin=(min)=>{const h=Math.floor(min/60);const m=min%60;return h+":"+(m<10?"0":"")+m;};

      // ── TABS ──
      const tabs=[
        {id:"overview",label:"סקירה",icon:"📊"},
        {id:"workers",label:"עובדים",icon:"👷"},
        {id:"sites",label:"לקוחות",icon:"🏠"},
        {id:"alerts",label:"התראות",icon:"⚠️"}
      ];

      // Month navigation
      const prevMonth=()=>{
        if(reportMode==="week"){const d=new Date(monthStart);d.setDate(d.getDate()-7);setForm({...form,reportWeekStart:iso(d)});return;}
        let m=reportMonth-1,y=reportYear;
        if(m<0){m=11;y--;}
        setForm({...form,reportMonth:m,reportYear:y});
      };
      const nextMonth=()=>{
        if(reportMode==="week"){const d=new Date(monthStart);d.setDate(d.getDate()+7);setForm({...form,reportWeekStart:iso(d)});return;}
        let m=reportMonth+1,y=reportYear;
        if(m>11){m=0;y++;}
        setForm({...form,reportMonth:m,reportYear:y});
      };

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:600,width:"100%",padding:0,maxHeight:"95vh"}}>
        <div style={{background:C.org,color:"#fff",padding:"12px 16px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"center",flex:1}}>
              <div style={{fontSize:16,fontWeight:700}}>{"📊 דוח חודשי"}</div>
            </div>
            <div style={{width:28}}></div>
          </div>
          {/* Period mode toggle */}
          <div className="no-print" style={{display:"flex",gap:6,marginBottom:8,justifyContent:"center"}}>
            <button onClick={()=>setForm({...form,reportMode:"month"})} style={{padding:"5px 18px",borderRadius:8,border:"none",background:reportMode==="month"?"rgba(255,255,255,0.4)":"rgba(255,255,255,0.12)",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"חודשי"}</button>
            <button onClick={()=>setForm({...form,reportMode:"week"})} style={{padding:"5px 18px",borderRadius:8,border:"none",background:reportMode==="week"?"rgba(255,255,255,0.4)":"rgba(255,255,255,0.12)",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"שבועי"}</button>
          </div>
          {/* Period nav */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
            <button onClick={nextMonth} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:34,height:34,borderRadius:"50%",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>{"›"}</button>
            <div style={{flex:1,textAlign:"center",fontSize:14,fontWeight:700}}>{monthName}</div>
            <button onClick={prevMonth} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:34,height:34,borderRadius:"50%",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>{"‹"}</button>
          </div>
          <div className="no-print" style={{display:"flex",justifyContent:"center",marginBottom:10}}>
            {reportMode==="month"
              ? <input type="month" value={iso(monthStart).slice(0,7)} onChange={e=>{const v=e.target.value;if(v){const p=v.split("-");setForm({...form,reportYear:+p[0],reportMonth:+p[1]-1});}}} style={{border:"none",borderRadius:6,padding:"5px 10px",fontSize:12,fontFamily:"inherit",cursor:"pointer"}}/>
              : <input type="date" value={iso(monthStart)} onChange={e=>{const v=e.target.value;if(v){const p=v.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()-d.getDay());setForm({...form,reportWeekStart:iso(d)});}}} style={{border:"none",borderRadius:6,padding:"5px 10px",fontSize:12,fontFamily:"inherit",cursor:"pointer"}}/>}
          </div>
          {/* Tabs */}
          <div style={{display:"flex",gap:4,overflowX:"auto"}}>
            {tabs.map(t=><button key={t.id} onClick={()=>setForm({...form,reportTab:t.id,drillDown:null,drillWorker:null,drillSite:null})} style={{flex:"1 1 0",padding:"7px 6px",borderRadius:14,border:"none",background:reportTab===t.id?"rgba(255,255,255,0.35)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:11,fontWeight:reportTab===t.id?700:500,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{t.icon+" "+t.label}</button>)}
          </div>
        </div>

        <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(95vh - 130px)"}}>

          {/* ── OVERVIEW TAB ── */}
          {reportTab==="overview" && (()=>{
            const drillDown=form.drillDown||null;

            // Build drill-down data once
            const allTasksDone=[];
            const allTasksOpen=[];
            Object.keys(data.dailyTasks||{}).forEach(d=>{
              if(!inMonth(d))return;
              (data.dailyTasks[d]||[]).forEach(t=>{
                const item={...t,date:d};
                if(t.status==="done")allTasksDone.push(item);
                else allTasksOpen.push(item);
              });
            });
            // Sort by date newest first
            allTasksDone.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
            allTasksOpen.sort((a,b)=>(a.date||"").localeCompare(b.date||""));

            // All reports
            const allReports=[];
            Object.keys(data.dailyLogs||{}).forEach(d=>{
              if(!inMonth(d))return;
              Object.keys(data.dailyLogs[d]||{}).forEach(sid=>{
                const log=data.dailyLogs[d][sid];
                if(log && (log.summary||(log.extras||[]).length>0)){
                  allReports.push({date:d,siteId:sid,...log});
                }
              });
            });
            allReports.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

            // All orders
            const allOrdersList=[];
            Object.keys(data.projectOrders||{}).forEach(pid=>{
              (data.projectOrders[pid]||[]).forEach(o=>{
                if(o.date && inMonth(o.date)){
                  allOrdersList.push({...o,pid});
                }
              });
            });
            allOrdersList.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

            // All trips
            const allTrips=[];
            Object.keys(data.trips||{}).forEach(d=>{
              if(!inMonth(d))return;
              (data.trips[d]||[]).forEach(t=>allTrips.push({...t,date:d}));
            });
            allTrips.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

            // All meetings
            const allMeetingsList=[];
            Object.keys(data.meetings||{}).forEach(d=>{
              if(!inMonth(d))return;
              (data.meetings[d]||[]).forEach(m=>allMeetingsList.push({...m,date:d}));
            });
            allMeetingsList.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

            // Back button for drill-down
            const backBtn=<button onClick={()=>setForm({...form,drillDown:null})} style={{padding:"7px 12px",borderRadius:8,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"← חזור לסקירה"}</button>;

            const sectionHeader=(title,color,count)=><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:11,padding:"3px 9px",borderRadius:10,background:color,color:"#fff",fontWeight:700}}>{count}</span>
              <span style={{fontSize:15,fontWeight:700,color:color}}>{title}</span>
            </div>;

            // ── DRILL DOWN: Sites ──
            if(drillDown==="sites"){
              return <div>
                {backBtn}
                {sectionHeader("🏠 לקוחות שטופלו",C.grn,Object.keys(siteVisits).length)}
                {Object.entries(siteVisits).sort((a,b)=>b[1].count-a[1].count).map(([sid,info])=>{
                  const ic=info.type==="m"?"🔧":"🌱";
                  return <div key={sid} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.bdr}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                      <span style={{fontSize:11,padding:"2px 8px",borderRadius:8,background:C.grnP,color:C.grn,fontWeight:700}}>{info.count+" ביקורים"}</span>
                      <span style={{fontSize:14,fontWeight:700}}>{ic+" "+sn(sid)}</span>
                    </div>
                    <div style={{fontSize:11,color:C.txtM,textAlign:"right"}}>{info.dates.map(d=>new Date(d).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})).join(" · ")}</div>
                  </div>;
                })}
              </div>;
            }

            // ── DRILL DOWN: Tasks Done ──
            if(drillDown==="tasksDone"){
              return <div>
                {backBtn}
                {sectionHeader("✅ משימות שבוצעו",C.org,allTasksDone.length)}
                {allTasksDone.map((t,i)=><div key={t.id+"_"+i} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.grnL}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6,marginBottom:4}}>
                    <span style={{fontSize:10,color:C.txtL,whiteSpace:"nowrap"}}>{new Date(t.date).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})}</span>
                    <span style={{textAlign:"right",flex:1,fontSize:13,fontWeight:500}}>{t.notes}</span>
                  </div>
                  {t.siteId && <div style={{fontSize:11,color:C.grn,textAlign:"right"}}>{"🏠 "+sn(t.siteId)}</div>}
                  {t.image && <img src={t.image} onClick={()=>setZoomImg(t.image)} style={{width:"100%",borderRadius:6,marginTop:6,maxHeight:160,objectFit:"cover",cursor:"zoom-in"}} alt=""/>}
                </div>)}
                {allTasksDone.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20,fontSize:12}}>{"אין משימות שבוצעו"}</div>}
              </div>;
            }

            // ── DRILL DOWN: Tasks Open ──
            if(drillDown==="tasksOpen"){
              return <div>
                {backBtn}
                {sectionHeader("📋 משימות פתוחות",C.org,allTasksOpen.length)}
                {allTasksOpen.map((t,i)=>{
                  const daysOld=Math.floor((new Date(todayISO)-new Date(t.date))/(1000*60*60*24));
                  return <div key={t.id+"_"+i} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+(daysOld>14?C.red:C.bdr)}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6,marginBottom:4}}>
                      <span style={{fontSize:10,padding:"2px 7px",borderRadius:8,background:daysOld>14?C.red:daysOld>7?C.org:C.cardA,color:daysOld>14?"#fff":daysOld>7?"#fff":C.txtM,fontWeight:700,whiteSpace:"nowrap"}}>{daysOld+" ימים"}</span>
                      <span style={{textAlign:"right",flex:1,fontSize:13,fontWeight:500}}>{t.notes}</span>
                    </div>
                    {t.siteId && <div style={{fontSize:11,color:C.txtM,textAlign:"right"}}>{"🏠 "+sn(t.siteId)+" · "+new Date(t.date).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})}</div>}
                  </div>;
                })}
                {allTasksOpen.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20,fontSize:12}}>{"אין משימות פתוחות"}</div>}
              </div>;
            }

            // ── DRILL DOWN: Reports ──
            if(drillDown==="reports"){
              return <div>
                {backBtn}
                {sectionHeader("📝 דיווחים",C.blu,allReports.length)}
                {allReports.map((r,i)=><div key={r.date+"_"+r.siteId+"_"+i} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.bdr}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <span style={{fontSize:10,color:C.txtL,whiteSpace:"nowrap"}}>{new Date(r.date).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})}</span>
                    <span style={{fontSize:13,fontWeight:700,color:C.blu}}>{"🏠 "+sn(r.siteId)}</span>
                  </div>
                  {r.summary && <div style={{fontSize:12,textAlign:"right",marginBottom:5,padding:"6px 8px",background:C.cardA,borderRadius:6}}>{r.summary}</div>}
                  {(r.extras||[]).filter(e=>e.desc).length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:5}}>
                    {r.extras.filter(e=>e.desc).map((ex,j)=><span key={j} style={{fontSize:10,padding:"3px 7px",background:"#fff7ed",color:C.org,borderRadius:8,fontWeight:600,border:"1px solid "+C.org}}>{"💰 "+ex.desc+(ex.qty?" ×"+ex.qty:"")+(ex.amount?" ₪"+ex.amount:"")}</span>)}
                  </div>}
                  {(r.reminders||[]).filter(rm=>rm.text).length>0 && <div style={{fontSize:11,color:C.purp,textAlign:"right"}}>{"🔔 "+r.reminders.filter(rm=>rm.text).map(rm=>rm.text).join(" · ")}</div>}
                </div>)}
                {allReports.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20,fontSize:12}}>{"אין דיווחים"}</div>}
              </div>;
            }

            // ── DRILL DOWN: Orders ──
            if(drillDown==="orders"){
              const getDestInfo=(pid)=>{
                if(pid==="__test__")return "🧪 טסט";
                if(pid==="__free__")return "✏️ חופשי";
                return sn(pid);
              };
              return <div>
                {backBtn}
                {sectionHeader("📦 הזמנות",C.purp,allOrdersList.length)}
                <div style={{background:C.purpB,borderRadius:8,padding:"8px 12px",marginBottom:10,textAlign:"center",fontSize:13,color:C.purp,fontWeight:700}}>
                  {"סה״כ: ₪"+totalOrdersAmount.toLocaleString()}
                </div>
                {allOrdersList.map(o=>{
                  const sc={ordered:{bg:"#fff3cd",clr:C.org,label:"📞 הוזמן"},onway:{bg:C.bluB,clr:C.blu,label:"🚛 בדרך"},received:{bg:C.grnP,clr:C.grn,label:"✅ התקבל"}}[o.status||"ordered"];
                  return <div key={o.id} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.bdr}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                      <span style={{fontSize:10,padding:"2px 7px",borderRadius:8,background:sc.bg,color:sc.clr,fontWeight:700}}>{sc.label}</span>
                      <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                        <div style={{fontSize:13,fontWeight:700}}>{o.desc}</div>
                        <div style={{fontSize:10,color:C.txtM}}>{new Date(o.date).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})+" · "+getDestInfo(o.pid)}</div>
                      </div>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.txtM,marginTop:4}}>
                      {o.amount>0 && <span style={{fontWeight:700,color:C.txt}}>{"₪"+(+o.amount).toLocaleString()}</span>}
                      {o.supplier && <span>{"🏪 "+o.supplier}</span>}
                    </div>
                  </div>;
                })}
                {allOrdersList.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20,fontSize:12}}>{"אין הזמנות"}</div>}
              </div>;
            }

            // ── DRILL DOWN: Trips ──
            if(drillDown==="trips"){
              return <div>
                {backBtn}
                {sectionHeader("🚗 נסיעות",C.purp,allTrips.length)}
                {allTrips.map((t,i)=><div key={t.id+"_"+i} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.bdr}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6}}>
                    <span style={{fontSize:10,color:C.txtL,whiteSpace:"nowrap"}}>{new Date(t.date).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})}</span>
                    <div style={{textAlign:"right",flex:1}}>
                      <div style={{fontSize:13,fontWeight:700}}>{"🚗 "+(t.place||"")}</div>
                      {t.note && <div style={{fontSize:11,color:C.txtM,marginTop:2}}>{t.note}</div>}
                    </div>
                  </div>
                </div>)}
                {allTrips.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20,fontSize:12}}>{"אין נסיעות"}</div>}
              </div>;
            }

            // ── DRILL DOWN: Meetings ──
            if(drillDown==="meetings"){
              return <div>
                {backBtn}
                {sectionHeader("📅 פגישות",C.purp,allMeetingsList.length)}
                {allMeetingsList.map((m,i)=><div key={m.id+"_"+i} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.bdr}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6}}>
                    <span style={{fontSize:10,color:C.txtL,whiteSpace:"nowrap"}}>{new Date(m.date).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})+(m.time?" "+m.time:"")}</span>
                    <div style={{textAlign:"right",flex:1}}>
                      <div style={{fontSize:13,fontWeight:700}}>{"📅 "+(m.with||m.title||"פגישה")}</div>
                      {m.place && <div style={{fontSize:11,color:C.txtM,marginTop:2}}>{"📍 "+m.place}</div>}
                      {m.notes && <div style={{fontSize:11,color:C.txtM,marginTop:2}}>{m.notes}</div>}
                    </div>
                  </div>
                </div>)}
                {allMeetingsList.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20,fontSize:12}}>{"אין פגישות"}</div>}
              </div>;
            }

            // ── DRILL DOWN: Financial - expenses ──
            if(drillDown==="expenses"){
              return <div>
                {backBtn}
                {sectionHeader("💸 הוצאות (הזמנות)",C.red,allOrdersList.length)}
                <div style={{background:"#fee",borderRadius:8,padding:"8px 12px",marginBottom:10,textAlign:"center",fontSize:14,color:C.red,fontWeight:700}}>
                  {"סה״כ: ₪"+totalOrdersAmount.toLocaleString()}
                </div>
                {allOrdersList.filter(o=>o.amount>0).map(o=><div key={o.id} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.bdr}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontWeight:700,color:C.red,fontSize:14}}>{"₪"+(+o.amount).toLocaleString()}</span>
                    <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                      <div style={{fontSize:13,fontWeight:700}}>{o.desc}</div>
                      <div style={{fontSize:10,color:C.txtM}}>{new Date(o.date).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})+" · "+sn(o.pid)}</div>
                    </div>
                  </div>
                </div>)}
              </div>;
            }

            // ── DRILL DOWN: Financial - income ──
            if(drillDown==="income"){
              const allExtras=[];
              Object.keys(data.dailyLogs||{}).forEach(d=>{
                if(!inMonth(d))return;
                Object.keys(data.dailyLogs[d]||{}).forEach(sid=>{
                  const log=data.dailyLogs[d][sid];
                  (log.extras||[]).forEach(ex=>{
                    if(ex.desc)allExtras.push({...ex,date:d,siteId:sid});
                  });
                });
              });
              allExtras.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
              return <div>
                {backBtn}
                {sectionHeader("💰 הכנסות (תוספות חיוב)",C.grn,allExtras.length)}
                <div style={{background:C.grnP,borderRadius:8,padding:"8px 12px",marginBottom:10,textAlign:"center",fontSize:14,color:C.grn,fontWeight:700}}>
                  {"סה״כ: ₪"+totalExtrasAmount.toLocaleString()}
                </div>
                {allExtras.map((e,i)=><div key={i} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.bdr}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontWeight:700,color:C.grn,fontSize:14}}>{e.amount?"₪"+(+e.amount).toLocaleString():""}</span>
                    <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                      <div style={{fontSize:13,fontWeight:700}}>{e.desc+(e.qty?" ×"+e.qty:"")}</div>
                      <div style={{fontSize:10,color:C.txtM}}>{new Date(e.date).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})+" · "+sn(e.siteId)}</div>
                    </div>
                  </div>
                </div>)}
                {allExtras.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20,fontSize:12}}>{"אין הכנסות"}</div>}
              </div>;
            }

            // ── MAIN OVERVIEW ──
            return <div>
              <div style={{fontSize:11,color:C.txtM,marginBottom:8,textAlign:"center"}}>{"💡 לחץ על כל מספר לפירוט מלא"}</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2, 1fr)",gap:8,marginBottom:14}}>
                <div onClick={()=>setForm({...form,drillDown:"sites"})} style={{background:C.grnP,borderRadius:10,padding:12,textAlign:"center",border:"1px solid "+C.grn,cursor:"pointer"}}>
                  <div style={{fontSize:26,fontWeight:700,color:C.grn}}>{Object.keys(siteVisits).length}</div>
                  <div style={{fontSize:11,color:C.txtM}}>{"לקוחות שטופלו ›"}</div>
                </div>
                <div onClick={()=>setForm({...form,drillDown:"tasksDone"})} style={{background:"#fff7ed",borderRadius:10,padding:12,textAlign:"center",border:"1px solid "+C.org,cursor:"pointer"}}>
                  <div style={{fontSize:26,fontWeight:700,color:C.org}}>{tasksCompleted}</div>
                  <div style={{fontSize:11,color:C.txtM}}>{"משימות בוצעו ›"}</div>
                </div>
                <div onClick={()=>setForm({...form,drillDown:"reports"})} style={{background:C.bluB,borderRadius:10,padding:12,textAlign:"center",border:"1px solid "+C.blu,cursor:"pointer"}}>
                  <div style={{fontSize:26,fontWeight:700,color:C.blu}}>{totalReports}</div>
                  <div style={{fontSize:11,color:C.txtM}}>{"דיווחים ›"}</div>
                </div>
                <div onClick={()=>setForm({...form,drillDown:"orders"})} style={{background:C.purpB,borderRadius:10,padding:12,textAlign:"center",border:"1px solid "+C.purp,cursor:"pointer"}}>
                  <div style={{fontSize:26,fontWeight:700,color:C.purp}}>{totalOrders}</div>
                  <div style={{fontSize:11,color:C.txtM}}>{"הזמנות ›"}</div>
                </div>
              </div>

              {/* Financial */}
              {(totalOrdersAmount>0 || totalExtrasAmount>0) && <div style={{background:"#fff",borderRadius:12,padding:14,marginBottom:14,border:"2px solid "+C.org}}>
                <div style={{fontSize:13,fontWeight:700,marginBottom:10,color:C.org,textAlign:"right"}}>{"💰 סיכום כספי"}</div>
                {totalOrdersAmount>0 && <div onClick={()=>setForm({...form,drillDown:"expenses"})} style={{display:"flex",justifyContent:"space-between",padding:"8px 10px",fontSize:13,cursor:"pointer",background:C.cardA,borderRadius:6,marginBottom:5}}>
                  <span style={{fontWeight:700,color:C.red}}>{"-₪"+totalOrdersAmount.toLocaleString()+" ›"}</span>
                  <span style={{color:C.txtM}}>{"הוצאות (הזמנות)"}</span>
                </div>}

function stripSid(d){ if(!d||typeof d!=="object")return d; const {_sid,...rest}=d; return rest; }

async function load(){
  try {
    const { data, error } = await sb.from("app_data").select("data").eq("id", ROW_ID).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      const clean = stripSid(data.data);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(clean)); } catch(_) {}
      return clean;
    }
    return null;
  } catch (e) {
    try { const r = localStorage.getItem(CACHE_KEY); return r ? JSON.parse(r) : null; } catch(_) { return null; }
  }
}
async function save(v){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch(_) {}
  try {
    const payload = { ...v, _sid: MY_SID };
    const { error } = await sb.from("app_data").upsert({ id: ROW_ID, data: payload, updated_at: new Date().toISOString() });
    if (error) throw error;
    return true;
  } catch (e) { return false; }
}

function getHebrewDate(d){
  try{
    const fmt=new Intl.DateTimeFormat("he-u-ca-hebrew",{day:"numeric",month:"long"});
    const parts=fmt.formatToParts(d);
    let day="",month="";
    parts.forEach(p=>{if(p.type==="day")day=p.value;if(p.type==="month")month=p.value;});
    return {day,month,full:day+" "+month};
  }catch(e){return null;}
}

// Helper: get all photos sorted/filtered
function getAllPhotos(data){
  const all=[];
  Object.keys(data.photos||{}).forEach(key=>{
    (data.photos[key]||[]).forEach(p=>{
      all.push({...p, _key:key});
    });
  });
  return all;
}

  const editTask=()=>{const dy=form.editTaskDate;const tid=form.editTaskId;if(!dy||!tid)return;up(d=>{const t=(d.dailyTasks?.[dy]||[]).find(x=>x.id===tid);if(t){t.notes=form.notes||t.notes;t.image=form.image||"";if(form.siteId!==undefined){t.siteId=form.siteId;t.type=allSites.find(s=>s.id===form.siteId)?.type||"";}}});setModal(null);setForm({});};
  const saveReminder=()=>{if(!form.notes||!form.notes.trim())return;up(d=>{if(!d.dailyTasks)d.dailyTasks={};if(!d.dailyTasks[todayISO])d.dailyTasks[todayISO]=[];d.dailyTasks[todayISO].push({id:uid(),siteId:"",type:"",notes:form.notes.trim(),status:"todo",image:form.image||"",billable:""});});setModal(null);setForm({});};
  const editReminder=()=>{const dy=form.editTaskDate;const tid=form.editTaskId;if(!dy||!tid)return;up(d=>{const t=(d.dailyTasks?.[dy]||[]).find(x=>x.id===tid);if(t){t.notes=form.notes||t.notes;t.image=form.image||"";}});setModal(null);setForm({});};
  const markBillable=(dy,tid,extras)=>{up(d=>{const t=(d.dailyTasks?.[dy]||[]).find(x=>x.id===tid);if(t){t.billable="ready";t.billingExtras=extras||"";}});};
  const markInvoiced=(dy,tid)=>{up(d=>{const t=(d.dailyTasks?.[dy]||[]).find(x=>x.id===tid);if(t)t.billable="invoiced";});};
  const saveReceipt=()=>{up(d=>{if(!d.receipts)d.receipts=[];d.receipts.push({id:uid(),date:selISO,amount:+form.amount||0,client:form.client,desc:form.desc});});setModal(null);};
  const quickSaveExp=(siteId)=>{up(d=>{if(!d.expenses)d.expenses=[];d.expenses.push({id:uid(),date:todayISO,amount:0,desc:"",siteId,type:"invoice",image:expImg||""});});setExpImg(null);setExpStep(0);setModal(null);};

  // ─── Photo: store under SITE id (not date) so site has its own gallery ───
  const savePhoto=(siteId,photoType,note,image,date)=>{
    up(d=>{
      if(!d.photos)d.photos={};
      const key=siteId||"general";
      if(!d.photos[key])d.photos[key]=[];
      d.photos[key].push({id:uid(),date:date||todayISO,photoType:photoType||"",note:note||"",image:image||"",siteId:siteId||""});
    });
  };
  const delPhoto=(key,id)=>{up(d=>{if(d.photos?.[key])d.photos[key]=d.photos[key].filter(p=>p.id!==id);});};
  const movePhoto=(oldKey,id,newSiteId)=>{up(d=>{const ph=(d.photos?.[oldKey]||[]).find(p=>p.id===id);if(!ph)return;d.photos[oldKey]=d.photos[oldKey].filter(p=>p.id!==id);const nk=newSiteId||"general";if(!d.photos[nk])d.photos[nk]=[];ph.siteId=newSiteId||"";d.photos[nk].push(ph);});};

  // ─── Trip ───
  const saveTrip=()=>{const dateKey=form.tripDate||selISO;const place=(form.tripPlace||"").trim();if(!place)return;up(d=>{if(!d.trips)d.trips={};if(!d.trips[dateKey])d.trips[dateKey]=[];d.trips[dateKey].push({id:uid(),place,note:(form.tripNote||"").trim()});});setModal(null);setForm({});};
  const delTrip=(dy,tid)=>{up(d=>{if(d.trips?.[dy])d.trips[dy]=d.trips[dy].filter(x=>x.id!==tid);});};

  // ─── Next Visit Notes (per site) ───
  const addNextVisitNote=(siteId,text)=>{if(!text.trim())return;up(d=>{if(!d.nextVisitNotes)d.nextVisitNotes={};if(!d.nextVisitNotes[siteId])d.nextVisitNotes[siteId]=[];d.nextVisitNotes[siteId].push({id:uid(),text:text.trim(),done:false,addedDate:todayISO});});};
  const togNextVisit=(siteId,nid)=>{up(d=>{const n=(d.nextVisitNotes?.[siteId]||[]).find(x=>x.id===nid);if(n)n.done=!n.done;});};
  const delNextVisit=(siteId,nid)=>{up(d=>{if(d.nextVisitNotes?.[siteId])d.nextVisitNotes[siteId]=d.nextVisitNotes[siteId].filter(x=>x.id!==nid);});};

  // ─── Meetings ───
  const saveMeeting=()=>{up(d=>{if(!d.meetings)d.meetings=[];const isCust=form.meetingSiteId==="__custom__";d.meetings.push({id:uid(),siteId:isCust?"":(form.meetingSiteId||""),customPlace:isCust?(form.meetingCustomPlace||"פגישה"):"",date:form.meetingDate||todayISO,time:form.meetingTime||"",notes:form.meetingNotes||"",done:false});});setModal(null);setForm({});};
  const togMeeting=(mid)=>{up(d=>{const m=(d.meetings||[]).find(x=>x.id===mid);if(m)m.done=!m.done;});};
  const delMeeting=(mid)=>{up(d=>{if(d.meetings)d.meetings=d.meetings.filter(x=>x.id!==mid);});};

  // ─── Billing Extras (per site, accumulate) ───
  const addBillingExtra=()=>{const amt=+form.extraAmount;if(!amt||!form.extraSiteId)return;up(d=>{if(!d.billingExtras)d.billingExtras=[];d.billingExtras.push({id:uid(),siteId:form.extraSiteId,date:form.extraDate||todayISO,amount:amt,desc:form.extraDesc||"",invoiced:false});});setModal(null);setForm({});};
  const togExtraInvoiced=(eid)=>{up(d=>{const e=(d.billingExtras||[]).find(x=>x.id===eid);if(e)e.invoiced=!e.invoiced;});};
  const delExtra=(eid)=>{up(d=>{if(d.billingExtras)d.billingExtras=d.billingExtras.filter(x=>x.id!==eid);});};

  // ─── Project Orders (materials/equipment per project) ───
  const addOrder=()=>{if(!form.orderProjectId||!form.orderDesc)return;up(d=>{if(!d.projectOrders)d.projectOrders={};if(!d.projectOrders[form.orderProjectId])d.projectOrders[form.orderProjectId]=[];d.projectOrders[form.orderProjectId].push({id:uid(),desc:form.orderDesc.trim(),supplier:form.orderSupplier||"",amount:+form.orderAmount||0,status:form.orderStatus||"ordered",date:todayISO,note:form.orderNote||""});});setModal(null);setForm({});};
  const upOrderStatus=(pid,oid,status)=>{up(d=>{const o=(d.projectOrders?.[pid]||[]).find(x=>x.id===oid);if(o)o.status=status;});};
  const delOrder=(pid,oid)=>{up(d=>{if(d.projectOrders?.[pid])d.projectOrders[pid]=d.projectOrders[pid].filter(x=>x.id!==oid);});};
  // Bulk order: form.bulkItems is array [{desc,amount,projectId}]; common supplier+status+date
  const saveBulkOrder=()=>{
    const items=(form.bulkItems||[]).filter(it=>it.desc && it.desc.trim() && it.projectId);
    if(items.length===0)return;
    const supplier=form.bulkSupplier||"";
    const status=form.bulkStatus||"ordered";
    const date=form.bulkDate||todayISO;
    const note=form.bulkNote||"";
    up(d=>{
      if(!d.projectOrders)d.projectOrders={};
      items.forEach(it=>{
        if(!d.projectOrders[it.projectId])d.projectOrders[it.projectId]=[];
        d.projectOrders[it.projectId].push({id:uid(),desc:it.desc.trim(),supplier,amount:+it.amount||0,status,date,note});
      });
    });
    setModal(null);setForm({});
  };
  const editOrder=()=>{const pid=form.editOrderPid;const oid=form.editOrderOid;if(!pid||!oid)return;up(d=>{const o=(d.projectOrders?.[pid]||[]).find(x=>x.id===oid);if(o){o.desc=form.orderDesc||o.desc;o.supplier=form.orderSupplier||"";o.amount=+form.orderAmount||0;o.status=form.orderStatus||o.status;o.note=form.orderNote||"";}});setModal(null);setForm({});};

  // ─── Inventory (preset items library) ───
  const addInvItem=()=>{const name=(form.invName||"").trim();if(!name||!form.invCategory)return;up(d=>{if(!d.inventory)d.inventory=[];d.inventory.push({id:uid(),name,category:form.invCategory,size:form.invSize||"",defaultPrice:+form.invPrice||0});});setForm({...form,invName:"",invSize:"",invPrice:""});};
  const delInvItem=(id)=>{up(d=>{if(d.inventory)d.inventory=d.inventory.filter(x=>x.id!==id);});};
  const editInvItem=(id,patch)=>{up(d=>{const it=(d.inventory||[]).find(x=>x.id===id);if(it)Object.assign(it,patch);});};

  // ─── Sub contractors ───
  const quickAddSub=()=>{const n=(form.subName||"").trim();if(!n)return;const dates=(form.subDates||[todayISO]).filter(d=>d);if(!dates.length)return;up(d=>{if(!d.subContracts)d.subContracts=[];let siteId=form.subSiteId||"";if(siteId==="__new__"){const newName=(form.subNewSite||"").trim();if(newName){const newId=uid();if(!d.devSites)d.devSites=[];d.devSites.push({id:newId,name:newName,deadline:""});siteId=newId;}else{siteId="";}}d.subContracts.push({id:uid(),name:n,siteId,dates,status:"planned"});});setModal(null);setForm({});};
  const completeSub=()=>{up(d=>{const s=(d.subContracts||[]).find(x=>x.id===form.subId);if(!s)return;s.status="done";s.workerCount=+form.subWorkerCount||1;s.hoursFrom=form.subFrom||dStart();s.hoursTo=form.subTo||dEnd();s.notes=form.subNotes||"";});setModal(null);setForm({});};
  const delSub=(id)=>{up(d=>{if(d.subContracts)d.subContracts=d.subContracts.filter(x=>x.id!==id);});};
  const removeSubFromDay=(subId,dateKey)=>{up(d=>{const s=(d.subContracts||[]).find(x=>x.id===subId);if(!s)return;s.dates=(s.dates||[]).filter(x=>x!==dateKey);if(s.dates.length===0)d.subContracts=d.subContracts.filter(x=>x.id!==subId);});};

  const togWA=(dy,sid,type)=>{up(d=>{if(!d.weekAssign)d.weekAssign={};if(!d.weekAssign[dy])d.weekAssign[dy]=[];const i=d.weekAssign[dy].findIndex(a=>a.siteId===sid);if(i>=0)d.weekAssign[dy].splice(i,1);else d.weekAssign[dy].push({siteId:sid,type});});};
  const isAsgn=(dy,sid)=>(data.weekAssign?.[dy]||[]).some(a=>a.siteId===sid);
  const addDev=()=>{if(!sND.trim())return;up(d=>{d.devSites=[...(d.devSites||[]),{id:uid(),name:sND.trim(),deadline:sNDD,quotedPrice:0,status:"active"}];});setSND("");setSNDD("");};

  const login=()=>{if(pw===PW){setAuthed(true);setPwErr(false);}else{setPwErr(true);setShake(true);setTimeout(()=>setShake(false),500);}};

  // LOGIN
  if(!authed)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(160deg,#1b4332,#2d6a4f 50%,#40916c)",fontFamily:"'Rubik',sans-serif",direction:"rtl"}}>
      <style>{`@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}*{box-sizing:border-box;margin:0}`}</style>
      <div style={{width:360,maxWidth:"92vw",padding:"40px 32px",borderRadius:20,background:"rgba(255,253,245,0.96)",boxShadow:"0 24px 80px rgba(0,0,0,0.25)",animation:shake?"shake 0.4s":"fadeIn 0.5s",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:4,animation:"fl 3s ease-in-out infinite"}}>🌿</div>
        <h1 style={{fontSize:24,fontWeight:700,color:C.grn,margin:"0 0 24px"}}>{"מעקב גינון"}</h1>
        <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setPwErr(false);}} onKeyDown={e=>e.key==="Enter"&&login()} placeholder={"סיסמה"} style={{width:"100%",padding:14,borderRadius:10,border:"2px solid "+(pwErr?C.red:C.bdr),fontSize:20,textAlign:"center",letterSpacing:6,fontFamily:"inherit",outline:"none",boxSizing:"border-box",marginBottom:12}}/>
        {pwErr&&<p style={{color:C.red,fontSize:13,marginBottom:8}}>{"שגויה"}</p>}
        <button onClick={login} style={{width:"100%",padding:16,borderRadius:12,border:"none",background:C.grn,color:"#fff",fontSize:18,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"כניסה"}</button>
      </div>
    </div>
  );

  const vs=["monthly","weekly","daily","gallery","projects","settings"];
  const cv=vs.includes(view)?view:"monthly";
  const inSubView = cv!=="monthly";

  // HEADER
  const header=<div style={{background:C.hdr,padding:"12px 16px",color:"#fff",position:"sticky",top:0,zIndex:100}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        {inSubView && <button onClick={()=>setView("monthly")} style={{background:"rgba(255,255,255,0.18)",border:"none",color:"#fff",width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit",lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center"}}>{"←"}</button>}
        <button onClick={()=>setAuthed(false)} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",padding:"4px 12px",borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>{"יציאה"}</button>
        {syncStatus==="error" && <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 8px",borderRadius:10,fontSize:10,fontWeight:600,background:"rgba(252,165,165,0.25)",color:"#fff"}}><span style={{width:6,height:6,borderRadius:"50%",background:"#ff6b6b"}}></span>{"לא מחובר"}</span>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>setView("settings")} title={"הגדרות"} style={{background:cv==="settings"?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.15)",border:"none",color:"#fff",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit",lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center"}}>{"⚙️"}</button>
        <span style={{fontSize:17,fontWeight:700}}>{"מעקב גינון"}</span>
        <span style={{fontSize:22}}>🌿</span>
      </div>
    </div>
  </div>;

  // ═══ MONTHLY ═══
  const monthlyView=(()=>{
    const now=new Date();
    const baseM=now.getMonth()+monthOffset;
    const baseY=now.getFullYear();
    const dispDate=new Date(baseY,baseM,1);
    const mm=dispDate.getMonth(),yy=dispDate.getFullYear();
    const firstDay=new Date(yy,mm,1);
    const daysInMonth=new Date(yy,mm+1,0).getDate();
    const firstDow=firstDay.getDay();
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push(null);
    for(let d=1;d<=daysInMonth;d++) cells.push(new Date(yy,mm,d));

    // Hebrew month label (combines hebrew month names that span this gregorian month)
    let hebLabel="";
    try{
      const h1=getHebrewDate(new Date(yy,mm,1));
      const h2=getHebrewDate(new Date(yy,mm,daysInMonth));
      if(h1 && h2){
        if(h1.month===h2.month) hebLabel=h1.month;
        else hebLabel=h1.month+" / "+h2.month;
      }
    }catch(e){}

    const billReady=[];
    const reminders=[];
    Object.keys(data.dailyTasks||{}).forEach(d=>{(data.dailyTasks[d]||[]).forEach(t=>{
      if(t.billable==="ready")billReady.push({...t,date:d});
      if(t.status!=="done" && !t.siteId)reminders.push({...t,date:d});
    });});
    reminders.sort((a,b)=>a.date.localeCompare(b.date));

    // Upcoming meetings (next 14 days)
    const upcomingMeetings=(data.meetings||[]).filter(m=>{const md=new Date(m.date);const dd=(md-new Date())/(1000*60*60*24);return !m.done && dd>=-1 && dd<=14;}).sort((a,b)=>a.date.localeCompare(b.date));

    // Active projects
    const activeProjects=(data.devSites||[]).filter(s=>s.status!=="done");

    return <div style={{padding:16}}>
      {/* Bills alert */}
      {billReady.length>0 && <div onClick={()=>setModal("billingList")} style={{background:"#fff3cd",borderRadius:12,border:"2px solid "+C.org,padding:12,marginBottom:10,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:18}}>{"←"}</span>
        <span style={{fontSize:14,fontWeight:700,color:C.org}}>{"💰 "+billReady.length+" משימות מוכנות לחיוב"}</span>
      </div>}

      {/* Upcoming meetings alert */}
      {upcomingMeetings.length>0 && <div onClick={()=>setModal("meetingsList")} style={{background:C.purpB,borderRadius:12,border:"2px solid "+C.purp,padding:12,marginBottom:10,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:18}}>{"←"}</span>
        <span style={{fontSize:14,fontWeight:700,color:C.purp}}>{"📅 "+upcomingMeetings.length+" פגישות קרובות"}</span>
      </div>}

      {/* Reminders */}
      <div style={{background:"#fff",borderRadius:14,border:"2px solid "+C.grn,padding:14,marginBottom:14,boxShadow:"0 2px 8px rgba(45,106,79,0.08)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <button onClick={()=>{setForm({notes:"",siteId:"",type:"",image:""});setModal("addReminder");}} style={{background:C.grn,color:"#fff",border:"none",padding:"6px 14px",borderRadius:20,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"+ תזכורת"}</button>
          <div style={{fontSize:15,fontWeight:700,color:C.grn,display:"flex",alignItems:"center",gap:6}}>
            {"📌 תזכורות"}
            <span style={{background:C.grn,color:"#fff",padding:"2px 8px",borderRadius:10,fontSize:11}}>{reminders.length}</span>
          </div>
        </div>
        {reminders.length===0 && <div style={{textAlign:"center",color:C.txtL,fontSize:13,padding:"12px 0"}}>{"אין תזכורות"}</div>}
        {reminders.slice(0,6).map((t,i)=><div key={t.id+"_"+i} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",borderRadius:8,background:C.cardA,marginBottom:6,border:"1px solid "+C.bdr}}>
          <span onClick={()=>togTask(t.date,t.id)} style={{fontSize:22,cursor:"pointer"}}>{"⬜"}</span>
          <span onClick={()=>{setForm({editTaskId:t.id,editTaskDate:t.date,notes:t.notes,image:t.image||""});setModal("editReminder");}} style={{fontSize:14,color:C.blu,cursor:"pointer"}}>{"✏️"}</span>
          <span onClick={()=>delTask(t.date,t.id)} style={{fontSize:14,color:C.red,cursor:"pointer"}}>{"🗑"}</span>
          <div style={{flex:1,textAlign:"right"}}>
            <div style={{fontSize:14,fontWeight:500}}>{t.notes}</div>
          </div>
          {t.image && <img src={t.image} onClick={()=>setZoomImg(t.image)} style={{width:40,height:40,objectFit:"cover",borderRadius:6,cursor:"pointer"}} alt=""/>}
        </div>)}
      </div>

      {/* CALENDAR */}
      <div style={{background:C.card,borderRadius:14,border:"1px solid "+C.bdr,padding:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <button onClick={()=>setMonthOffset(monthOffset+1)} style={{background:C.grnP,border:"none",color:C.grn,fontSize:20,cursor:"pointer",width:36,height:36,borderRadius:"50%",fontWeight:700,fontFamily:"inherit"}}>{"‹"}</button>
          <div style={{textAlign:"center",flex:1}}>
            <div style={{fontSize:16,fontWeight:700,color:C.grn}}>{MONTHS[mm]+" "+yy}</div>
            {hebLabel && <div style={{fontSize:11,color:C.txtM,marginTop:2}}>{hebLabel}</div>}
          </div>
          <button onClick={()=>setMonthOffset(monthOffset-1)} style={{background:C.grnP,border:"none",color:C.grn,fontSize:20,cursor:"pointer",width:36,height:36,borderRadius:"50%",fontWeight:700,fontFamily:"inherit"}}>{"›"}</button>
        </div>
        {monthOffset!==0 && <div style={{textAlign:"center",marginBottom:8}}>
          <button onClick={()=>setMonthOffset(0)} style={{padding:"4px 12px",borderRadius:14,border:"1px solid "+C.grn,background:C.grnP,color:C.grn,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"חזור להיום"}</button>
        </div>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7, 1fr)",gap:3,marginBottom:4}}>
          {DAYNAMES.map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:C.txtM,padding:4}}>{d.slice(0,3)}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7, 1fr)",gap:3}}>
          {cells.map((d,i)=>{
            if(!d)return <div key={i} style={{minHeight:64}}></div>;
            const dy=iso(d);
            const assigns=data.weekAssign?.[dy]||[];
            const tasks=data.dailyTasks?.[dy]||[];
            const daySubs=(data.subContracts||[]).filter(s=>(s.dates||[]).includes(dy));
            const dayTrips=(data.trips?.[dy]||[]);
            const dayMeetings=(data.meetings||[]).filter(m=>m.date===dy);
            const isToday=dy===todayISO;
            const isSel=dy===selISO;
            const holiday=getHoliday(d);
            const isShabbat=d.getDay()===6;
            const heb=getHebrewDate(d);
            const allCells=[
              ...assigns.slice(0,1).map(a=>({type:a.type==="m"?"m":"d",label:sn(a.siteId)})),
              ...dayMeetings.slice(0,1).map(m=>({type:"meet",label:"📅 "+(m.time||"")+" "+meetingLabel(m)})),
              ...dayTrips.slice(0,1).map(t=>({type:"trip",label:"🚗 "+t.place})),
              ...daySubs.slice(0,1).map(s=>({type:"sub",label:"🔨 "+s.name}))
            ];
            const moreCount=(assigns.length+dayMeetings.length+dayTrips.length+daySubs.length)-allCells.length;
            return <div key={i} onClick={()=>{setSelDay(d);setView("daily");}} style={{minHeight:68,padding:3,borderRadius:6,border:"1px solid "+(isToday?C.grn:isSel?C.blu:holiday?C.org:isShabbat?C.bdr:C.bdr),background:isToday?C.grnP:isSel?C.bluB:holiday?"#fff8e7":isShabbat?"#faf7f0":"#fff",cursor:"pointer",fontSize:10,overflow:"hidden",position:"relative"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:1,gap:2}}>
                <div style={{fontSize:8,color:C.txtL,fontWeight:600}}>{heb?heb.day:""}</div>
                <div style={{fontSize:11,fontWeight:isToday?700:500,color:isToday?C.grn:holiday?C.org:C.txt,textAlign:"center"}}>{d.getDate()}</div>

      <div style={{marginBottom:10}}><label style={lb}>{"מה הוזמן?"}</label><input value={form.orderDesc||""} onChange={e=>setForm({...form,orderDesc:e.target.value})} placeholder={"לדוגמה: דקל אדום, 5 שתילים"} style={inp} autoFocus={!!form.orderProjectId}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"ספק"}</label><input value={form.orderSupplier||""} onChange={e=>setForm({...form,orderSupplier:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"מחיר (₪)"}</label><input type="number" value={form.orderAmount||""} onChange={e=>setForm({...form,orderAmount:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"סטטוס"}</label>
        <select value={form.orderStatus||"ordered"} onChange={e=>setForm({...form,orderStatus:e.target.value})} style={inp}>
          <option value="ordered">{"📞 הוזמן"}</option><option value="onway">{"🚛 בדרך"}</option><option value="received">{"✅ התקבל"}</option>
        </select>
      </div>
      <div style={{marginBottom:14}}><label style={lb}>{"הערות"}</label><textarea value={form.orderNote||""} onChange={e=>setForm({...form,orderNote:e.target.value})} style={{...inp,minHeight:50}}/></div>
      <button onClick={addOrder} style={{...sb,background:C.org}}>{"שמור הזמנה"}</button>
    </div></div>;

    // ─── EDIT ORDER ───
    if(modal==="editOrder")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:18,color:C.blu,marginBottom:14,textAlign:"center"}}>{"✏️ עריכת הזמנה"}</h3>
      <div style={{marginBottom:10,padding:"8px 10px",background:C.bluB,borderRadius:8,fontSize:13,color:C.blu,fontWeight:600,textAlign:"center"}}>{"🌱 "+(allSites.find(s=>s.id===form.editOrderPid)?.name||"")}</div>
      <div style={{marginBottom:10}}><label style={lb}>{"מה הוזמן?"}</label><input value={form.orderDesc||""} onChange={e=>setForm({...form,orderDesc:e.target.value})} style={inp} autoFocus/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"ספק"}</label><input value={form.orderSupplier||""} onChange={e=>setForm({...form,orderSupplier:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"מחיר (₪)"}</label><input type="number" value={form.orderAmount||""} onChange={e=>setForm({...form,orderAmount:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"סטטוס"}</label>
        <select value={form.orderStatus||"ordered"} onChange={e=>setForm({...form,orderStatus:e.target.value})} style={inp}>
          <option value="ordered">{"📞 הוזמן"}</option><option value="onway">{"🚛 בדרך"}</option><option value="received">{"✅ התקבל"}</option>
        </select>
      </div>
      <div style={{marginBottom:14}}><label style={lb}>{"הערות"}</label><textarea value={form.orderNote||""} onChange={e=>setForm({...form,orderNote:e.target.value})} style={{...inp,minHeight:50}}/></div>
      <button onClick={editOrder} style={{...sb,background:C.blu}}>{"שמור שינויים"}</button>
    </div></div>;

    // ─── ADD BULK ORDER (supermarket-style picker) ───
    if(modal==="addBulkOrder"){
      const items=form.bulkItems||[];
      const inv=data.inventory||[];
      // Group inventory by category
      const byCat={};
      INV_CATS.forEach(c=>{byCat[c.id]={cat:c,items:[]};});
      inv.forEach(it=>{if(byCat[it.category])byCat[it.category].items.push(it);});

      // Add or merge item to cart
      const addToCart=(invItem,size,qty)=>{
        qty=+qty||1;
        const desc=size?invItem.name+" - "+size:invItem.name;
        // Check if same item+size already in cart, merge quantities
        const existingIdx=items.findIndex(it=>it.invItemId===invItem.id && it.size===size);
        if(existingIdx>=0){
          const newItems=[...items];
          newItems[existingIdx]={...newItems[existingIdx],qty:(+newItems[existingIdx].qty||1)+qty};
          setForm({...form,bulkItems:newItems,sizeModalFor:null});
        } else {
          setForm({...form,bulkItems:[...items,{invItemId:invItem.id,name:invItem.name,size,qty,desc,amount:invItem.defaultPrice||"",projectId:form.bulkAssignAll||""}],sizeModalFor:null});
        }
      };
      const removeFromCart=(idx)=>{setForm({...form,bulkItems:items.filter((_,i)=>i!==idx)});};
      const updateCartItem=(idx,field,val)=>{const newItems=[...items];newItems[idx]={...newItems[idx],[field]:val};setForm({...form,bulkItems:newItems});};
      const incQty=(idx,delta)=>{const newItems=[...items];const cur=+newItems[idx].qty||1;newItems[idx]={...newItems[idx],qty:Math.max(1,cur+delta)};setForm({...form,bulkItems:newItems});};
      const total=items.reduce((s,it)=>s+((+it.amount||0)*(+it.qty||1)),0);
      const totalQty=items.reduce((s,it)=>s+(+it.qty||1),0);
      const assignAllToProject=(targetType,targetId,targetText)=>{setForm({...form,bulkAssignAll:targetType+":"+(targetId||""),bulkAssignAllText:targetText||"",bulkItems:items.map(it=>({...it,assignType:targetType,projectId:targetId||"",freeText:targetText||""}))});};
      // Manual custom item add
      const addCustomItem=()=>{setForm({...form,bulkItems:[...items,{name:"",size:"",qty:1,desc:"",amount:"",projectId:"",assignType:"project",saveToInv:false,saveToCat:"shrubs"}],editingIdx:items.length});};
      // Save custom items to inventory (called before saving the order)
      const saveCustomItemsToInventory=(d)=>{
        if(!d.inventory)d.inventory=[];
        items.forEach(it=>{
          if(!it.invItemId && it.saveToInv && it.name && it.name.trim()){
            const exists=d.inventory.some(inv=>(inv.name||"").trim().toLowerCase()===it.name.trim().toLowerCase());
            if(!exists){
              d.inventory.push({id:uid(),name:it.name.trim(),category:it.saveToCat||"shrubs"});
            }
          }
        });
      };
      // Step: 1=pick items, 2=details (project/supplier/save)
      const step=form.bulkStep||1;
      const setStep=(s)=>setForm({...form,bulkStep:s});
      // Save handler
      const saveBulkOrderEnhanced=()=>{
        // Validate: each item must have a destination
        const validItems=items.filter(it=>{
          if(!(it.desc||it.name))return false;
          const t=it.assignType||"project";
          if(t==="project"||t==="maintenance")return !!it.projectId;
          if(t==="test")return true;
          if(t==="free")return !!(it.freeText||"").trim();
          return false;
        });
        if(validItems.length===0)return;
        const supplier=form.bulkSupplier||"";
        const status=form.bulkStatus||"ordered";
        const date=form.bulkDate||todayISO;
        const orderNote=(form.bulkOrderNote||"").trim();
        up(d=>{
          // First save any custom items to inventory if requested
          saveCustomItemsToInventory(d);
          if(!d.projectOrders)d.projectOrders={};
          validItems.forEach(it=>{
            const t=it.assignType||"project";
            // Build destination key: real project id, maintenance site id (m1, m2), or special keys
            let destKey;
            if(t==="project"||t==="maintenance"){destKey=it.projectId;}
            else if(t==="test"){destKey="__test__";}
            else if(t==="free"){destKey="__free__";}
            if(!d.projectOrders[destKey])d.projectOrders[destKey]=[];
            const qty=+it.qty||1;
            let desc=qty>1?qty+"× "+(it.desc||it.name+(it.size?" - "+it.size:"")):(it.desc||it.name+(it.size?" - "+it.size:""));
            // Build combined note: free text (if applicable) + order note
            const parts=[];
            if(t==="free" && it.freeText)parts.push(it.freeText);
            if(orderNote)parts.push(orderNote);
            const note=parts.join(" · ");
            d.projectOrders[destKey].push({id:uid(),desc,supplier,amount:(+it.amount||0)*qty,status,date,note,assignType:t});
          });
        });
        setModal(null);setForm({});
      };

      // Size picker mini-modal (when user clicks an inventory item)
      const sizeModalItem=form.sizeModalFor;
      if(sizeModalItem){
        const cat=INV_CATS.find(c=>c.id===sizeModalItem.category);
        const sizes=cat?.sizes||[];
        const selectedSize=form.tempSize||sizes[0]||"";
        const selectedQty=+form.tempQty||1;
        return <div onClick={()=>setForm({...form,sizeModalFor:null})} style={{...ov,zIndex:1100}}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:400}}>
          <h3 style={{fontSize:18,color:C.grn,marginBottom:14,textAlign:"center"}}>{(cat?.icon||"")+" "+sizeModalItem.name}</h3>
          {sizes.length>0 && <div style={{marginBottom:14}}>
            <label style={lb}>{"גודל"}</label>
            <div style={{display:"grid",gridTemplateColumns:"repeat("+Math.min(sizes.length,4)+", 1fr)",gap:6}}>
              {sizes.map(sz=><button key={sz} onClick={()=>setForm({...form,tempSize:sz})} style={{padding:"12px 4px",borderRadius:8,border:"2px solid "+(selectedSize===sz?C.grn:C.bdr),background:selectedSize===sz?C.grnP:"#fff",color:selectedSize===sz?C.grn:C.txtM,fontSize:14,fontWeight:selectedSize===sz?700:500,cursor:"pointer",fontFamily:"inherit"}}>{sz}</button>)}
            </div>
          </div>}
          <div style={{marginBottom:14}}>
            <label style={lb}>{"כמות"}</label>
            <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"center",marginBottom:8}}>
              <button onClick={()=>setForm({...form,tempQty:Math.max(1,selectedQty-1)})} style={{width:42,height:42,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:22,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>−</button>
              <input type="number" min="1" value={selectedQty} onChange={e=>{const v=parseInt(e.target.value)||1;setForm({...form,tempQty:Math.max(1,v)});}} onFocus={e=>e.target.select()} style={{width:90,height:50,fontSize:24,fontWeight:700,textAlign:"center",border:"2px solid "+C.grn,borderRadius:10,fontFamily:"inherit",outline:"none",background:C.grnP,color:C.grn}}/>
              <button onClick={()=>setForm({...form,tempQty:selectedQty+1})} style={{width:42,height:42,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:22,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>+</button>
            </div>
            {/* Quick increment buttons for big quantities */}
            <div style={{display:"flex",gap:5,justifyContent:"center"}}>
              {[5,10,25,50,100].map(n=><button key={n} onClick={()=>setForm({...form,tempQty:selectedQty+n})} style={{flex:1,padding:"6px 4px",borderRadius:8,border:"1px solid "+C.bdr,background:C.cardA,color:C.grn,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"+"+n}</button>)}
            </div>
          </div>
          <button onClick={()=>{addToCart(sizeModalItem,selectedSize,selectedQty);setForm(p=>({...p,sizeModalFor:null,tempSize:"",tempQty:1}));}} style={{...sb,background:C.grn}}>{"➕ הוסף לעגלה"}</button>
          <button onClick={()=>setForm({...form,sizeModalFor:null,tempSize:"",tempQty:1})} style={{width:"100%",padding:10,borderRadius:10,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:13,cursor:"pointer",fontFamily:"inherit",marginTop:6}}>{"ביטול"}</button>
        </div></div>;
      }

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"94vh"}}>
        {/* Sticky header */}
        <div style={{background:C.org,color:"#fff",padding:"12px 16px",position:"sticky",top:0,zIndex:10,borderRadius:"16px 16px 0 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right",flex:1,marginInlineStart:10}}>
              <div style={{fontSize:17,fontWeight:700}}>{step===1?"🛒 בחר פריטים":"📋 פרטי הזמנה"}</div>
              <div style={{fontSize:11,opacity:0.85}}>{items.length>0?(totalQty+" פריטים"+(total>0?" · ₪"+total.toLocaleString():"")):"עגלה ריקה"}</div>
            </div>
          </div>
          {/* Step tabs */}
          <div style={{display:"flex",gap:4,marginTop:10}}>
            <button onClick={()=>setStep(1)} style={{flex:1,padding:"6px",borderRadius:14,border:"none",background:step===1?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:12,fontWeight:step===1?700:500,cursor:"pointer",fontFamily:"inherit"}}>{"1. פריטים"}</button>
            <button onClick={()=>{if(items.length>0)setStep(2);}} style={{flex:1,padding:"6px",borderRadius:14,border:"none",background:step===2?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:12,fontWeight:step===2?700:500,cursor:items.length>0?"pointer":"not-allowed",fontFamily:"inherit",opacity:items.length>0?1:0.5}}>{"2. שמירה"}</button>
          </div>
        </div>

        <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(94vh - 110px)"}}>
          {/* STEP 1: Pick items */}
          {step===1 && <div>
            {/* Cart preview */}
            {items.length>0 && <div style={{background:C.grnP,borderRadius:10,padding:10,marginBottom:14,border:"1px solid "+C.grn}}>
              <div style={{fontSize:12,fontWeight:700,color:C.grn,marginBottom:8,display:"flex",justifyContent:"space-between"}}>
                <span>{totalQty+" פריטים"}</span>
                <span>{"🛒 בעגלה"}</span>
              </div>
              {items.map((it,i)=><div key={i} style={{background:"#fff",borderRadius:6,padding:"6px 8px",marginBottom:4,fontSize:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <span onClick={()=>removeFromCart(i)} style={{cursor:"pointer",color:C.red,fontSize:14,marginInlineEnd:4}}>{"✕"}</span>
                  <button onClick={()=>incQty(i,-1)} style={{width:24,height:24,borderRadius:"50%",border:"1px solid "+C.bdr,background:"#fff",fontSize:12,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>−</button>
                  <input type="number" min="1" value={it.qty||1} onChange={e=>{const v=parseInt(e.target.value)||1;updateCartItem(i,"qty",Math.max(1,v));}} onFocus={e=>e.target.select()} style={{width:50,height:26,fontSize:13,fontWeight:700,textAlign:"center",border:"1px solid "+C.grn,borderRadius:6,fontFamily:"inherit",outline:"none",background:C.grnP,color:C.grn}}/>
                  <button onClick={()=>incQty(i,1)} style={{width:24,height:24,borderRadius:"50%",border:"1px solid "+C.bdr,background:"#fff",fontSize:12,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>+</button>
                </div>
                <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                  <div style={{fontWeight:600}}>{it.name||it.desc}</div>
                  {it.size && <div style={{fontSize:10,color:C.txtM}}>{"גודל: "+it.size}</div>}
                </div>
              </div>)}
              <button onClick={()=>setStep(2)} style={{width:"100%",padding:"10px",borderRadius:8,border:"none",background:C.grn,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginTop:6}}>{"המשך לשמירה ← ("+totalQty+" פריטים)"}</button>
            </div>}

            {/* Search filter */}
            <div style={{marginBottom:12,position:"sticky",top:0,zIndex:5,background:C.card,paddingBottom:6}}>
              <input value={form.bulkSearch||""} onChange={e=>setForm({...form,bulkSearch:e.target.value})} placeholder={"🔍 חפש פריט..."} style={{...inp,fontSize:13,padding:"10px 14px"}}/>
            </div>

            {/* Categories with items */}
            {INV_CATS.map(cat=>{
              const allCatItems=byCat[cat.id]?.items||[];
              const searchQ=(form.bulkSearch||"").trim().toLowerCase();
              const catItems=searchQ?allCatItems.filter(it=>(it.name||"").toLowerCase().includes(searchQ)):allCatItems;
              if(searchQ && catItems.length===0)return null;
              return <div key={cat.id} style={{marginBottom:14}}>
                <div style={{fontSize:14,fontWeight:700,marginBottom:8,padding:"6px 10px",background:C.grnP,color:C.grn,borderRadius:6,display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontSize:11,opacity:0.7}}>{catItems.length+(searchQ?"/"+allCatItems.length:"")}</span>
                  <span>{cat.icon+" "+cat.label}</span>
                </div>
                {allCatItems.length===0 && <div style={{textAlign:"center",color:C.txtL,fontSize:11,padding:10}}>{"אין פריטים. הוסף בהגדרות → מאגר ציוד"}</div>}
                <div style={{display:"grid",gridTemplateColumns:"repeat(2, 1fr)",gap:6}}>
                  {catItems.map(it=>{
                    const inCart=items.filter(c=>c.invItemId===it.id).reduce((s,c)=>s+(+c.qty||1),0);
                    return <div key={it.id} style={{padding:"12px 8px",borderRadius:10,border:"2px solid "+(inCart>0?C.grn:C.bdr),background:inCart>0?C.grnP:"#fff",fontFamily:"inherit",textAlign:"center",position:"relative",cursor:"pointer"}} onClick={()=>setForm({...form,sizeModalFor:it,tempSize:cat.sizes[0]||"",tempQty:1})}>
                      {/* Delete button (top-left, only on hover) */}
                      <button onClick={e=>{e.stopPropagation();if(confirm("למחוק את \""+it.name+"\" מהמאגר?\n(ההזמנות הקיימות לא יושפעו)"))delInvItem(it.id);}} style={{position:"absolute",top:-7,left:-7,background:"#fff",border:"1px solid "+C.bdr,color:C.txtL,width:20,height:20,borderRadius:"50%",cursor:"pointer",fontSize:11,fontFamily:"inherit",padding:0,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}} title={"מחק מהמאגר"}>{"🗑"}</button>
                      {inCart>0 && <span style={{position:"absolute",top:-6,right:-6,background:C.grn,color:"#fff",borderRadius:"50%",minWidth:22,height:22,fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{inCart}</span>}
                      <div style={{fontSize:13,fontWeight:600,color:inCart>0?C.grn:C.txt,lineHeight:1.3}}>{it.name}</div>
                    </div>;
                  })}
                </div>
              </div>;
            })}

            {/* Custom item button */}
            <button onClick={addCustomItem} style={{width:"100%",padding:"10px",borderRadius:10,border:"2px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:10}}>{"+ פריט חופשי (לא במאגר)"}</button>

            {/* Custom items being edited */}
            {items.map((it,i)=>{
              if(it.invItemId)return null; // already shown in cart
              return <div key={i} style={{background:"#fff",border:"1px solid "+C.bdr,borderRadius:10,padding:10,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{fontSize:11,fontWeight:700,color:C.txtM}}>{"פריט חופשי #"+(i+1)}</span>
                  <button onClick={()=>removeFromCart(i)} style={{background:"none",border:"none",color:C.red,fontSize:16,cursor:"pointer",padding:0,fontWeight:700}}>{"×"}</button>
                </div>
                <input value={it.name||""} onChange={e=>updateCartItem(i,"name",e.target.value)} placeholder={"שם הפריט"} style={{...inp,fontSize:13,padding:"8px 10px",marginBottom:6}}/>
                <div style={{display:"flex",gap:6,marginBottom:8}}>
                  <input value={it.size||""} onChange={e=>updateCartItem(i,"size",e.target.value)} placeholder={"גודל"} style={{...inp,fontSize:13,padding:"8px 10px",flex:1}}/>
                  <input type="number" value={it.qty||1} onChange={e=>{const v=parseInt(e.target.value)||1;updateCartItem(i,"qty",Math.max(1,v));}} placeholder={"כמות"} style={{...inp,fontSize:13,padding:"8px 10px",width:80,textAlign:"center"}}/>
                </div>
                {/* Save to inventory checkbox */}
                <div style={{background:C.grnP,borderRadius:8,padding:"8px 10px",border:"1px solid "+C.grn}}>
                  <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:12,fontWeight:600,color:C.grn}}>
                    <input type="checkbox" checked={!!it.saveToInv} onChange={e=>updateCartItem(i,"saveToInv",e.target.checked)} style={{width:18,height:18,cursor:"pointer",accentColor:C.grn}}/>
                    <span>{"💾 שמור במאגר לעתיד"}</span>
                  </label>
                  {it.saveToInv && it.name && <div style={{marginTop:8,display:"flex",gap:4}}>
                    {INV_CATS.map(cat=><button key={cat.id} onClick={()=>updateCartItem(i,"saveToCat",cat.id)} style={{flex:1,padding:"6px 4px",borderRadius:6,border:"1px solid "+((it.saveToCat||"shrubs")===cat.id?C.grn:C.bdr),background:(it.saveToCat||"shrubs")===cat.id?C.grn:"#fff",color:(it.saveToCat||"shrubs")===cat.id?"#fff":C.txtM,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{cat.icon+" "+cat.label}</button>)}
                  </div>}
                </div>
              </div>;
            })}
          </div>}

          {/* STEP 2: Details and save */}
          {step===2 && <div>
            {/* Bulk assign all items to one destination */}
            <div style={{background:C.bluB,borderRadius:10,padding:12,marginBottom:10,border:"1px solid "+C.blu}}>
              <div style={{fontSize:12,fontWeight:700,color:C.blu,marginBottom:8}}>{"🎯 שייך את כל הקניות בלחיצה אחת:"}</div>
              {/* Type selector */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:3,marginBottom:8}}>
                {[
                  {id:"project",label:"🌱 פרויקט",color:C.grn},
                  {id:"maintenance",label:"🌳 תחזוקה",color:C.blu},
                  {id:"test",label:"🧪 טסט",color:C.purp},
                  {id:"free",label:"✏️ חופשי",color:C.org},
                ].map(opt=>{
                  const active=form.bulkAllType===opt.id;

              <input value={form.bulkOrderNote||""} onChange={e=>setForm({...form,bulkOrderNote:e.target.value})} placeholder={"למשל: הזמנת אביב לפרויקט הגן הקהילתי"} style={{...inp,fontSize:13,padding:"10px 12px"}}/>
            </div>

            {/* Items list with full assignment options */}
            <div style={{fontSize:12,fontWeight:700,marginBottom:8,color:C.org}}>{"📦 פריטים בהזמנה ("+totalQty+"):"}</div>
            {items.map((it,i)=>{
              const aType=it.assignType||"project";
              const isValid=(aType==="project"||aType==="maintenance")?!!it.projectId:(aType==="test"?true:!!(it.freeText||"").trim());
              return <div key={i} style={{background:"#fff",border:"1px solid "+C.bdr,borderRadius:10,padding:10,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <button onClick={()=>removeFromCart(i)} style={{background:"none",border:"none",color:C.red,fontSize:14,cursor:"pointer",padding:0}}>{"✕"}</button>

                <div style={{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:3,marginBottom:6}}>

                    {id:"maintenance",label:"🌳 תחזוקה",color:C.blu},
                    {id:"test",label:"🧪 טסט",color:C.purp},
                    {id:"free",label:"✏️ חופשי",color:C.org},
                  ].map(opt=>{
                    const active=aType===opt.id;
                    return <button key={opt.id} onClick={()=>{updateCartItem(i,"assignType",opt.id);if(opt.id!=="project"&&opt.id!=="maintenance")updateCartItem(i,"projectId","");}} style={{padding:"5px 2px",borderRadius:6,border:"1.5px solid "+(active?opt.color:C.bdr),background:active?opt.color:"#fff",color:active?"#fff":C.txtM,fontSize:10,fontWeight:active?700:500,cursor:"pointer",fontFamily:"inherit"}}>{opt.label}</button>;

                </div>
                {/* Conditional input based on assignment type */}
                <div style={{display:"flex",gap:6}}>
                  {aType==="project" && <select value={it.projectId||""} onChange={e=>updateCartItem(i,"projectId",e.target.value)} style={{...inp,fontSize:12,padding:"7px 10px",flex:2,border:"1px solid "+(it.projectId?C.bdr:C.red)}}>
                    <option value="">{"-- בחר פרויקט --"}</option>
                    {(data.devSites||[]).filter(p=>p.status!=="done").map(p=><option key={p.id} value={p.id}>{"🌱 "+p.name}</option>)}
                  </select>}
                  {aType==="maintenance" && <select value={it.projectId||""} onChange={e=>updateCartItem(i,"projectId",e.target.value)} style={{...inp,fontSize:12,padding:"7px 10px",flex:2,border:"1px solid "+(it.projectId?C.bdr:C.red)}}>
                    <option value="">{"-- בחר אתר תחזוקה --"}</option>

                  </select>}
                  {aType==="test" && <div style={{flex:2,padding:"7px 10px",fontSize:12,color:C.purp,fontWeight:600,background:"#f3e8ff",borderRadius:8,border:"1px solid "+C.purp,textAlign:"center"}}>{"🧪 ללא שיוך - לטסט / ניסיון"}</div>}
                  {aType==="free" && <input value={it.freeText||""} onChange={e=>updateCartItem(i,"freeText",e.target.value)} placeholder={"לאן זה הולך? (טקסט חופשי)"} style={{...inp,fontSize:12,padding:"7px 10px",flex:2,border:"1px solid "+((it.freeText||"").trim()?C.bdr:C.red)}}/>}
                  <input type="number" value={it.amount||""} onChange={e=>updateCartItem(i,"amount",e.target.value)} placeholder={"₪/יח'"} style={{...inp,fontSize:12,padding:"7px 10px",flex:1,textAlign:"center"}}/>

            {total>0 && <div style={{background:C.grnP,borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:15,fontWeight:700,color:C.grn,display:"flex",justifyContent:"space-between"}}>

            </div>}

            <div style={{display:"flex",gap:6}}>

              <button onClick={saveBulkOrderEnhanced} style={{flex:2,padding:14,borderRadius:12,border:"none",background:C.org,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"💾 שמור הזמנה"}</button>
            </div>
            {(()=>{const invalid=items.filter(it=>{const t=it.assignType||"project";if(t==="project"||t==="maintenance")return !it.projectId;if(t==="free")return !(it.freeText||"").trim();return false;}).length;return invalid>0?<div style={{fontSize:11,color:C.red,textAlign:"center",marginTop:6}}>{"⚠️ "+invalid+" פריטים חסרים שיוך"}</div>:null;})()}

    if(modal==="pickInventory"){setModal("addBulkOrder");return null;}

    // ─── ALL ORDERS (centralized view) ───
    if(modal==="allOrders"){
      const allOrders=[];
      const getDestInfo=(pid,o)=>{
        if(pid==="__test__")return {label:"🧪 טסט / ניסיון",color:C.purp};
        if(pid==="__free__")return {label:"✏️ "+(o.note||"חופשי"),color:C.org};
        // Check if it's a maintenance site
        const mSite=(data.maintenanceSites||[]).find(s=>s.id===pid);
        if(mSite)return {label:"🌳 "+mSite.name,color:C.blu};
        // Check if it's a dev project
        const dSite=(data.devSites||[]).find(s=>s.id===pid);
        if(dSite)return {label:"🌱 "+dSite.name,color:C.grn};
        return {label:"❓ "+sn(pid),color:C.txtM};
      };
      Object.keys(data.projectOrders||{}).forEach(pid=>{
        (data.projectOrders[pid]||[]).forEach(o=>{
          const di=getDestInfo(pid,o);
          allOrders.push({...o,projectId:pid,projectName:di.label,projectColor:di.color});
        });
      });
      // Filter
      let filtered=allOrders;
      if(ordersFilter!=="all")filtered=filtered.filter(o=>o.status===ordersFilter);
      if(ordersSearch.trim()){
        const q=ordersSearch.trim().toLowerCase();
        filtered=filtered.filter(o=>(o.desc||"").toLowerCase().includes(q)||(o.supplier||"").toLowerCase().includes(q)||(o.projectName||"").toLowerCase().includes(q));
      }
      filtered.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      const counts={all:allOrders.length,ordered:allOrders.filter(o=>o.status==="ordered").length,onway:allOrders.filter(o=>o.status==="onway").length,received:allOrders.filter(o=>o.status==="received").length};

      const filters=[{id:"all",label:"הכל",count:counts.all,color:C.txtM},{id:"ordered",label:"📞 הוזמן",count:counts.ordered,color:C.org},{id:"onway",label:"🚛 בדרך",count:counts.onway,color:C.blu},{id:"received",label:"✅ התקבל",count:counts.received,color:C.grn}];

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"92vh"}}>
        <div style={{background:C.org,color:"#fff",padding:"14px 18px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:18,fontWeight:700}}>{"📦 כל ההזמנות"}</div>
              <div style={{fontSize:11,opacity:0.85}}>{counts.all+" הזמנות · ₪"+totalAmount.toLocaleString()+" סה״כ מוצג"}</div>
            </div>
          </div>
          {/* Search */}
          <input value={ordersSearch} onChange={e=>setOrdersSearch(e.target.value)} placeholder={"🔍 חפש לפי פריט / ספק / פרויקט..."} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"none",fontSize:13,fontFamily:"inherit",direction:"rtl",outline:"none",boxSizing:"border-box",marginBottom:8}}/>
          {/* Filter tabs */}
          <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:2}}>
            {filters.map(f=><button key={f.id} onClick={()=>setOrdersFilter(f.id)} style={{flex:"0 0 auto",padding:"5px 10px",borderRadius:14,border:"none",background:ordersFilter===f.id?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:11,fontWeight:ordersFilter===f.id?700:400,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{f.label+" ("+f.count+")"}</button>)}
          </div>
        </div>

        <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(92vh - 130px)"}}>
          <button onClick={()=>{setForm({bulkSupplier:"",bulkStatus:"ordered",bulkDate:todayISO,bulkNote:"",bulkItems:[],bulkStep:1});setModal("addBulkOrder");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.org,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"🛒 + הזמנה משולבת חדשה"}</button>

          {filtered.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:30,fontSize:13}}>{ordersSearch?"לא נמצאו תוצאות":"אין הזמנות"}</div>}

            return <div key={o.id} style={{background:"#fff",borderRadius:10,border:"1px solid "+C.bdr,padding:12,marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                <span style={{padding:"3px 8px",borderRadius:10,fontSize:10,fontWeight:700,background:sc.bg,color:sc.clr,border:"1px solid "+sc.bdr}}>{sc.label}</span>
                <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                  <div style={{fontSize:14,fontWeight:700,marginBottom:2}}>{o.desc}</div>
                  <div style={{fontSize:11,color:o.projectColor||C.blu,fontWeight:600}}>{o.projectName}</div>
                </div>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11,color:C.txtM,marginTop:6,paddingTop:6,borderTop:"1px solid "+C.bdr}}>

      <div style={{marginBottom:10}}><label style={lb}>{"סכום (₪)"}</label><input type="number" value={form.extraAmount||""} onChange={e=>setForm({...form,extraAmount:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"תיאור"}</label><input value={form.extraDesc||""} onChange={e=>setForm({...form,extraDesc:e.target.value})} placeholder={"דשן נוסף, שתילי בוקסוס..."} style={inp}/></div>

    // ─── SITE DETAIL ───

      const site=allSites.find(s=>s.id===form.siteId);

      const isDev=site.type==="d";
      const accent=isDev?C.blu:C.org;
      const accentBg=isDev?C.bluB:C.orgB;
      const siteTasks=[];
      Object.keys(data.dailyTasks||{}).forEach(d=>{(data.dailyTasks[d]||[]).forEach(t=>{if(t.siteId===site.id)siteTasks.push({...t,date:d});});});
      siteTasks.sort((a,b)=>b.date.localeCompare(a.date));
      const sitePhotos=(data.photos?.[site.id]||[]).slice().reverse();
      const siteOrders=(data.projectOrders?.[site.id]||[]);
      const siteExtras=(data.billingExtras||[]).filter(e=>e.siteId===site.id);
      const siteMeetings=(data.meetings||[]).filter(m=>m.siteId===site.id).sort((a,b)=>b.date.localeCompare(a.date));
      const nextNotes=(data.nextVisitNotes?.[site.id]||[]);
      const billPending=siteTasks.filter(t=>t.billable==="ready").length;
      const billInvoiced=siteTasks.filter(t=>t.billable==="invoiced").length;
      const updateSite=(patch)=>{up(d=>{const arr=isDev?"devSites":"maintenanceSites";const idx=d[arr].findIndex(x=>x.id===site.id);if(idx>=0)d[arr][idx]={...d[arr][idx],...patch};});};

      const detailTabs=[
        {key:"overview",label:"סקירה",icon:"📊"},
        {key:"notes",label:"הערות",icon:"📝"},
        {key:"nextvisit",label:"לטיפול הבא",icon:"💡"},
        {key:"tasks",label:"משימות",icon:"📋"},
        {key:"photos",label:"תמונות",icon:"📷"},
        ...(isDev?[{key:"orders",label:"הזמנות",icon:"📦"}]:[]),
        {key:"billing",label:"חיוב",icon:"💰"},
        {key:"meetings",label:"פגישות",icon:"📅"},
      ];

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"92vh"}}>

        <div style={{background:accent,color:"#fff",padding:"14px 18px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:11,opacity:0.85}}>{isDev?"🌱 פרויקט":"🔧 תחזוקה"}</div>
              <div style={{fontSize:18,fontWeight:700}}>{site.name}</div>

          </div>

          </div>
        </div>

        <div style={{padding:"16px 18px",overflowY:"auto",maxHeight:"calc(92vh - 110px)"}}>
          {/* OVERVIEW */}
          {siteDetailTab==="overview" && <div>
            {/* Quick action buttons */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:6,marginBottom:14}}>

          {/* NOTES */}
          {siteDetailTab==="notes" && <div>

          {siteDetailTab==="nextvisit" && <div>

            {nextNotes.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין הערות"}</div>}
            {nextNotes.map(n=><div key={n.id} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",borderRadius:10,background:n.done?C.grnP:C.purpB,marginBottom:6,border:"1px solid "+(n.done?C.grnL:C.purp)}}>

                <div style={{fontSize:14,fontWeight:500,textDecoration:n.done?"line-through":"none"}}>{n.text}</div>

              </div>

          {siteDetailTab==="tasks" && <div>
            <button onClick={()=>{setForm({notes:"",siteId:site.id,type:site.type,image:"",taskDate:todayISO});setModal("addTask");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.grn,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ משימה חדשה"}</button>
            {siteTasks.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין משימות"}</div>}
            {siteTasks.map(t=><div key={t.id} style={{padding:"10px 12px",borderRadius:8,background:t.status==="done"?C.grnP:C.cardA,marginBottom:6,border:"1px solid "+(t.status==="done"?C.grnL:C.bdr)}}>

                  <div style={{fontWeight:500,textDecoration:t.status==="done"?"line-through":"none"}}>{t.notes}</div>
                  <div style={{fontSize:10,color:C.txtM}}>{fmtFull(t.date)}</div>
                </div>
                {t.image && <img src={t.image} onClick={()=>setZoomImg(t.image)} style={{width:36,height:36,objectFit:"cover",borderRadius:5,cursor:"pointer"}} alt=""/>}
              </div>
              {t.status==="done" && !t.billable && <button onClick={()=>{setForm({taskDay:t.date,taskId:t.id,extras:""});setModal("billingForm");}} style={{marginTop:6,width:"100%",padding:"6px",borderRadius:6,border:"1px solid "+C.org,background:"#fff3cd",color:C.org,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"💰 שלח לחיוב"}</button>}
              {t.billable==="ready" && <div style={{marginTop:6,fontSize:11,color:C.org,fontWeight:700}}>{"💰 מוכן לחיוב"+(t.billingExtras?" · "+t.billingExtras:"")}</div>}
              {t.billable==="invoiced" && <div style={{marginTop:6,fontSize:11,color:C.grn,fontWeight:700}}>{"✓ חויב"}</div>}
            </div>)}
          </div>}

          {/* PHOTOS */}
          {siteDetailTab==="photos" && <div>
            <button onClick={()=>{setExpImg(null);setExpStep(0);setForm({siteId:site.id,photoType:""});setModal("quickPhoto");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.hdr,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"📷 הוסף תמונה"}</button>
            {sitePhotos.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין תמונות"}</div>}

                <img src={p.image} style={{width:"100%",aspectRatio:"1",objectFit:"cover",borderRadius:8}} alt=""/>

              </div>)}
            </div>
          </div>}

          {/* ORDERS */}
          {siteDetailTab==="orders" && isDev && <div>

                  <span style={{padding:"2px 8px",borderRadius:8,fontSize:10,fontWeight:700,background:statusInfo.bg,color:statusInfo.col}}>{statusInfo.ic+" "+statusInfo.label}</span>

                </div>
                <div style={{fontSize:11,color:C.txtM,marginBottom:6}}>{(o.supplier?"👤 "+o.supplier+" · ":"")+"₪"+(+o.amount||0).toLocaleString()+" · "+fmtFull(o.date)}</div>
                {o.note && <div style={{fontSize:11,color:C.txtM,padding:"4px 8px",background:C.cardA,borderRadius:5,marginBottom:6}}>{o.note}</div>}
                <div style={{display:"flex",gap:4}}>

                  {o.status!=="onway" && <button onClick={()=>upOrderStatus(site.id,o.id,"onway")} style={{flex:1,padding:5,borderRadius:6,border:"1px solid "+C.bdr,background:"#fff",fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"🚛 בדרך"}</button>}
                  {o.status!=="received" && <button onClick={()=>upOrderStatus(site.id,o.id,"received")} style={{flex:1,padding:5,borderRadius:6,border:"1px solid "+C.grn,background:C.grnP,color:C.grn,fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>{"✅ התקבל"}</button>}
                  <button onClick={()=>delOrder(site.id,o.id)} style={{padding:"5px 8px",borderRadius:6,border:"1px solid "+C.red,background:"#fff",color:C.red,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"🗑"}</button>
                </div>
              </div>;
            })}
          </div>}

          {/* BILLING */}
          {siteDetailTab==="billing" && <div>
            <button onClick={()=>{setForm({extraSiteId:site.id,extraAmount:"",extraDesc:"",extraDate:todayISO});setModal("addBillingExtra");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.org,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ תוספת לחיוב"}</button>

            {/* Pending bills (tasks) */}
            {siteTasks.filter(t=>t.billable==="ready").length>0 && <div style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.org}}>{"💰 משימות מוכנות לחיוב"}</div>
              {siteTasks.filter(t=>t.billable==="ready").map(t=><div key={t.id} style={{padding:"10px 12px",borderRadius:8,background:"#fff3cd",marginBottom:6,border:"1px solid "+C.org}}>
                <div style={{fontWeight:700,fontSize:13}}>{t.notes}</div>
                <div style={{fontSize:10,color:C.txtM,marginTop:2}}>{fmtFull(t.date)+(t.billingExtras?" · "+t.billingExtras:"")}</div>
                <button onClick={()=>markInvoiced(t.date,t.id)} style={{marginTop:6,padding:"4px 10px",borderRadius:6,border:"none",background:C.org,color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"✓ סמן כחויב"}</button>
              </div>)}
            </div>}

            {/* Extras */}
            {siteExtras.length>0 && <div style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.org}}>{"📌 תוספות לחיוב"}</div>
              <div style={{fontSize:11,color:C.txtM,marginBottom:6}}>{"לא חויב: ₪"+siteExtras.filter(e=>!e.invoiced).reduce((s,e)=>s+(+e.amount||0),0).toLocaleString()+" · חויב: ₪"+siteExtras.filter(e=>e.invoiced).reduce((s,e)=>s+(+e.amount||0),0).toLocaleString()}</div>
              {siteExtras.map(e=><div key={e.id} style={{padding:"10px 12px",borderRadius:8,background:e.invoiced?C.grnP:"#fff3cd",marginBottom:6,border:"1px solid "+(e.invoiced?C.grnL:C.org)}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontWeight:700,color:e.invoiced?C.grn:C.org}}>{"₪"+(+e.amount).toLocaleString()}</span>
                  <span style={{fontSize:13}}>{e.desc||"תוספת"}</span>
                </div>
                <div style={{fontSize:10,color:C.txtM,marginTop:2}}>{fmtFull(e.date)}</div>
                <div style={{display:"flex",gap:4,marginTop:6}}>
                  <button onClick={()=>togExtraInvoiced(e.id)} style={{flex:1,padding:5,borderRadius:6,border:"none",background:e.invoiced?C.cardA:C.org,color:e.invoiced?C.txt:"#fff",fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>{e.invoiced?"בטל חיוב":"סמן חויב ✓"}</button>
                  <button onClick={()=>delExtra(e.id)} style={{padding:"5px 8px",borderRadius:6,border:"1px solid "+C.red,background:"#fff",color:C.red,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"🗑"}</button>
                </div>
              </div>)}
            </div>}

            {/* Invoiced history */}
            {siteTasks.filter(t=>t.billable==="invoiced").length>0 && <div>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.grn}}>{"✓ חויבו ("+siteTasks.filter(t=>t.billable==="invoiced").length+")"}</div>
              {siteTasks.filter(t=>t.billable==="invoiced").map(t=><div key={t.id} style={{padding:"6px 10px",borderRadius:6,background:C.grnP,marginBottom:4,fontSize:11}}>
                <div style={{fontWeight:600}}>{t.notes}</div>
                <div style={{fontSize:9,color:C.txtM}}>{fmtFull(t.date)}</div>
              </div>)}
            </div>}
          </div>}

          {/* MEETINGS */}
          {siteDetailTab==="meetings" && <div>
            <button onClick={()=>{setForm({meetingSiteId:site.id,meetingDate:todayISO,meetingTime:"",meetingNotes:""});setModal("addMeeting");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.purp,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ פגישה חדשה"}</button>
            {siteMeetings.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין פגישות"}</div>}
            {siteMeetings.map(m=><div key={m.id} style={{padding:"10px 12px",borderRadius:8,background:m.done?C.grnP:C.purpB,marginBottom:6,border:"1px solid "+(m.done?C.grnL:C.purp)}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span onClick={()=>togMeeting(m.id)} style={{fontSize:20,cursor:"pointer"}}>{m.done?"✅":"⬜"}</span>
                <span style={{fontWeight:700,fontSize:13}}>{fmtFull(m.date)+(m.time?" · "+m.time:"")}</span>
              </div>
              {m.notes && <div style={{fontSize:12,color:C.txtM,padding:"4px 8px",background:"#fff",borderRadius:5}}>{m.notes}</div>}
            </div>)}
          </div>}
        </div>
      </div></div>;
    }

    // ─── BILLING LIST (all sites) ───
    if(modal==="billingList"){
      const items=[];
      Object.keys(data.dailyTasks||{}).forEach(d=>{(data.dailyTasks[d]||[]).forEach(t=>{if(t.billable==="ready")items.push({...t,date:d});});});
      const extras=(data.billingExtras||[]).filter(e=>!e.invoiced);
      // Group by site
      const grouped={};
      items.forEach(t=>{const k=t.siteId||"_none";if(!grouped[k])grouped[k]={tasks:[],extras:[]};grouped[k].tasks.push(t);});
      extras.forEach(e=>{const k=e.siteId||"_none";if(!grouped[k])grouped[k]={tasks:[],extras:[]};grouped[k].extras.push(e);});

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:520}}>
        <h3 style={{fontSize:18,color:C.org,marginBottom:14,textAlign:"center"}}>{"💰 מוכנות לחיוב"}</h3>
        {Object.keys(grouped).length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין משימות מוכנות"}</div>}
        {Object.entries(grouped).map(([sid,{tasks,extras}])=>{
          const siteName=sid==="_none"?"ללא לקוח":sn(sid);

          <button onClick={addDate} style={{padding:"6px 12px",borderRadius:8,border:"1px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"+ יום נוסף"}</button>
        </div>
        <button onClick={quickAddSub} style={{...sb,background:C.blu}}>{"שבץ"}</button>
      </div></div>;
    }

    // ─── COMPLETE SUB ───
    if(modal==="completeSub"){
      const sub=(data.subContracts||[]).find(s=>s.id===form.subId);
      if(!sub)return null;
      const adjustCount=(n)=>setForm(p=>({...p,subWorkerCount:Math.max(1,(p.subWorkerCount||1)+n)}));
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:500}}>
        <h3 style={{fontSize:18,color:C.blu,marginBottom:14,textAlign:"center"}}>{"✓ פרטי ביצוע"}</h3>
        <div style={{marginBottom:12}}>
          <label style={lb}>{"כמה עובדים"}</label>
          <div style={{display:"flex",alignItems:"center",gap:10,justifyContent:"center"}}>
            <button onClick={()=>adjustCount(-1)} style={{width:36,height:36,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:18,cursor:"pointer",fontWeight:700}}>−</button>
            <span style={{fontSize:22,fontWeight:700,minWidth:40,textAlign:"center"}}>{form.subWorkerCount||1}</span>
            <button onClick={()=>adjustCount(1)} style={{width:36,height:36,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:18,cursor:"pointer",fontWeight:700}}>+</button>
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={lb}>{"שעות"}</label>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input type="time" value={form.subFrom||dStart()} onChange={e=>setForm({...form,subFrom:e.target.value})} style={{...inp,flex:1}}/>
            <span>{"עד"}</span>
            <input type="time" value={form.subTo||dEnd()} onChange={e=>setForm({...form,subTo:e.target.value})} style={{...inp,flex:1}}/>
          </div>
        </div>
        <div style={{marginBottom:14}}><label style={lb}>{"הערות"}</label><textarea value={form.subNotes||""} onChange={e=>setForm({...form,subNotes:e.target.value})} style={{...inp,minHeight:60}}/></div>
        <button onClick={completeSub} style={{...sb,background:C.grn}}>{"✓ שמור"}</button>
      </div></div>;
    }

    // ─── CONFIRM DELETE SUB ───
    if(modal==="confirmDelSub"){
      const sub=(data.subContracts||[]).find(s=>s.id===form.subId);
      if(!sub)return null;
      const dateKey=form.subDate||todayISO;
      const multipleDates=(sub.dates||[]).length>1;
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
        <h3 style={{fontSize:17,color:C.red,textAlign:"center",marginBottom:14}}>{"🗑 מחק "+sub.name+"?"}</h3>
        {multipleDates ? <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button onClick={()=>{removeSubFromDay(form.subId,dateKey);setModal(null);setForm({});}} style={{padding:"14px",borderRadius:10,border:"2px solid "+C.org,background:"#fff",color:C.org,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"רק היום הזה"}</button>
          <button onClick={()=>{delSub(form.subId);setModal(null);setForm({});}} style={{padding:"14px",borderRadius:10,border:"2px solid "+C.red,background:C.red,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"מחק הכל"}</button>
          <button onClick={close} style={{padding:"10px",borderRadius:10,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{"ביטול"}</button>
        </div> : <div style={{display:"flex",gap:8}}>
          <button onClick={close} style={{flex:1,padding:"12px",borderRadius:10,border:"1px solid "+C.bdr,background:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"ביטול"}</button>
          <button onClick={()=>{delSub(form.subId);setModal(null);setForm({});}} style={{flex:1,padding:"12px",borderRadius:10,border:"none",background:C.red,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"מחק"}</button>
        </div>}
      </div></div>;
    }

    // ─── ADD SITE QUICK ───
    if(modal==="addSiteQuick")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.grn,marginBottom:14}}>{"הוסף אתר / פרויקט"}</h3>
      <div style={{marginBottom:10}}><input value={form.newSiteName||""} onChange={e=>setForm({...form,newSiteName:e.target.value})} placeholder={"שם"} style={inp}/></div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>{if(!(form.newSiteName||"").trim())return;up(d=>{d.devSites=[...(d.devSites||[]),{id:uid(),name:form.newSiteName.trim(),deadline:"",status:"active"}];});setForm({});setModal(null);}} style={{flex:1,...sb,background:C.blu}}>{"🌱 פרויקט"}</button>
        <button onClick={()=>{if(!(form.newSiteName||"").trim())return;up(d=>{d.maintenanceSites=[...(d.maintenanceSites||[]),{id:uid(),name:form.newSiteName.trim(),frequency:"כל שבוע"}];});setForm({});setModal(null);}} style={{flex:1,...sb,background:C.org}}>{"🔧 תחזוקה"}</button>
      </div>
    </div></div>;

    // ─── RESET ───
    if(modal==="reset")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.red,textAlign:"center",marginBottom:10}}>{"⚠️ למחוק הכל?"}</h3>
      <div style={{display:"flex",gap:8}}>
        <button onClick={async()=>{await save({...INIT});setData({...INIT});setModal(null);}} style={{flex:1,padding:14,borderRadius:10,border:"none",background:C.red,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"כן"}</button>
        <button onClick={close} style={{flex:1,padding:14,borderRadius:10,border:"1px solid "+C.bdr,background:C.wht,fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"לא"}</button>
      </div>
    </div></div>;

    return null;
  };

  // ZOOM IMAGE OVERLAY
  const zoomOverlay = zoomImg && <div onClick={()=>setZoomImg(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2000,padding:20}}>
    <button onClick={()=>setZoomImg(null)} style={{position:"absolute",top:20,right:20,background:"rgba(255,255,255,0.2)",color:"#fff",border:"none",width:40,height:40,borderRadius:"50%",fontSize:20,cursor:"pointer",fontFamily:"inherit"}}>{"×"}</button>
    <img src={typeof zoomImg==="string"?zoomImg:zoomImg.image} style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain"}} alt=""/>
    {typeof zoomImg!=="string" && <div style={{position:"absolute",bottom:20,left:20,right:20,padding:"10px 14px",background:"rgba(0,0,0,0.7)",color:"#fff",borderRadius:10,fontSize:13}}>
      {zoomImg.siteId && <div style={{fontWeight:700,marginBottom:4}}>{sn(zoomImg.siteId)}</div>}
      {zoomImg.photoType && <span style={{padding:"2px 8px",borderRadius:6,fontSize:11,background:zoomImg.photoType==="before"?"#fff3cd":"#d8f3dc",color:zoomImg.photoType==="before"?C.org:C.grn,marginLeft:8}}>{zoomImg.photoType==="before"?"לפני":"אחרי"}</span>}
      {zoomImg.note && <div style={{fontSize:12,marginTop:4,opacity:0.9}}>{zoomImg.note}</div>}
      {zoomImg.date && <div style={{fontSize:11,opacity:0.7,marginTop:4}}>{fmtFull(zoomImg.date)}</div>}
    </div>}
  </div>;

  return(<div style={{minHeight:"100vh",background:C.bg,fontFamily:"'Rubik',sans-serif",direction:"rtl",color:C.txt,maxWidth:480,margin:"0 auto",boxShadow:"0 0 40px rgba(0,0,0,0.08)"}}>
    {header}
    <div style={{paddingBottom:20}}>
      {cv==="monthly"&&monthlyView}
      {cv==="weekly"&&weeklyView}
      {cv==="daily"&&dailyView}
      {cv==="gallery"&&galleryView}
      {cv==="projects"&&projectsView}
      {cv==="settings"&&settingsView}
    </div>
    {renderModal()}
    {zoomOverlay}
  </div>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>

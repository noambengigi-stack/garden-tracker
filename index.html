<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ─── Supabase ───
const SUPABASE_URL = "https://qsylkgwekxjftdycenwr.supabase.co";
const SUPABASE_KEY = "sb_publishable_PsXMWx7QRpTkxzb59KGEGw_lKFamShd";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ROW_ID = "main";
const CACHE_KEY = "go-v11";
const MY_SID = Math.random().toString(36).slice(2) + "-" + Date.now();

function stripSid(d){ if(!d||typeof d!=="object")return d; const {_sid,...rest}=d; return rest; }

async function load(){
  try {
    const { data, error } = await sb.from("app_data").select("data").eq("id", ROW_ID).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      const clean = stripSid(data.data);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(clean)); } catch(_) {}
      return clean;
    }
    return null;
  } catch (e) {
    try { const r = localStorage.getItem(CACHE_KEY); return r ? JSON.parse(r) : null; } catch(_) { return null; }
  }
}
async function save(v){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch(_) {}
  try {
    const payload = { ...v, _sid: MY_SID };
    const { error } = await sb.from("app_data").upsert({ id: ROW_ID, data: payload, updated_at: new Date().toISOString() });
    if (error) throw error;
    return true;
  } catch (e) { return false; }
}

const uid=()=>Math.random().toString(36).slice(2,8);
const DAYS=["א'","ב'","ג'","ד'","ה'","ו'","ש'"];
const MONTHS=["ינו'","פבר'","מרץ","אפר'","מאי","יוני","יולי","אוג'","ספט'","אוק'","נוב'","דצמ'"];
const DAYNAMES=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const PW="1234";
const TRIP_PRESETS=["סופר לנג","דרך המשי"];

const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const fmtD=d=>{const x=new Date(d);return x.getDate()+"."+(x.getMonth()+1);};
const fmtHeb=d=>{const x=new Date(d);return x.getDate()+" ב"+MONTHS[x.getMonth()]+" "+x.getFullYear();};
const fmtFull=d=>{const x=new Date(d);return x.getDate()+"."+(x.getMonth()+1)+"."+x.getFullYear();};
function getWeek(b){const d=new Date(b),dy=d.getDay(),s=new Date(d);s.setDate(d.getDate()-dy);return Array.from({length:7},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return x;});}

const C={bg:"#f5f0e6",hdr:"#2d6a4f",hdrL:"#40916c",card:"#fffdf5",cardA:"#f9f4e8",bdr:"#e0d8c4",grn:"#2d6a4f",grnL:"#b7e4c7",grnP:"#d8f3dc",org:"#e09f3e",orgB:"#fff3cd",red:"#bc4749",blu:"#0077b6",bluB:"#d4eaf7",purp:"#7209b7",purpB:"#e5d4f2",txt:"#2d3a2e",txtM:"#5a6b5d",txtL:"#8a9a8d",wht:"#fff"};

const EMPTY={workers:[],maintenanceSites:[],devSites:[],weekAssign:{},weekNotes:{},attendance:{},dailyTasks:{},receipts:[],expenses:[],photos:{},trips:{},nextVisitNotes:{},meetings:[],billingExtras:[],projectOrders:{},log:[]};

const INIT={
  workers:[{id:"w1",name:"Agith"},{id:"w2",name:"Anil"},{id:"w3",name:"Cintaka"},{id:"w4",name:"Maari"}],
  maintenanceSites:[{id:"m1",name:"כפר עציון",frequency:"2 פעמים בשבוע"},{id:"m2",name:"ביס",frequency:"2 פעמים בשבוע"},{id:"m3",name:"נוקדים",frequency:"2 פעמים בשבוע"},{id:"m4",name:"ראש צורים",frequency:"כל שבוע"},{id:"m5",name:"כרמי צור",frequency:"כל שבוע"},{id:"m6",name:"מתחם לולים",frequency:"פעם בחודש"},{id:"m7",name:"חצר הכפר",frequency:"פעמיים בחודש"}],
  devSites:[],weekAssign:{},weekNotes:{},attendance:{},dailyTasks:{},receipts:[],expenses:[],trips:{},nextVisitNotes:{},meetings:[],billingExtras:[],projectOrders:{},log:[],
};

// Helper: get all photos sorted/filtered
function getAllPhotos(data){
  const all=[];
  Object.keys(data.photos||{}).forEach(key=>{
    (data.photos[key]||[]).forEach(p=>{
      all.push({...p, _key:key});
    });
  });
  return all;
}

function App(){
  const [authed,setAuthed]=useState(true);
  const [pw,setPw]=useState("");
  const [pwErr,setPwErr]=useState(false);
  const [shake,setShake]=useState(false);
  const [loaded,setLoaded]=useState(false);
  const [data,setData]=useState({...EMPTY});
  const [view,setView]=useState("monthly");
  const [dailyTab,setDailyTab]=useState("tasks");
  const [weekBase,setWeekBase]=useState(new Date());
  const [selDay,setSelDay]=useState(new Date());
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [sNW,setSNW]=useState("");
  const [sNM,setSNM]=useState("");
  const [sNMF,setSNMF]=useState("כל שבוע");
  const [sND,setSND]=useState("");
  const [sNDD,setSNDD]=useState("");
  const [expImg,setExpImg]=useState(null);
  const [expStep,setExpStep]=useState(0);
  const [syncStatus,setSyncStatus]=useState("saved");
  const [siteDetailTab,setSiteDetailTab]=useState("overview");
  const [galleryFilter,setGalleryFilter]=useState("all");
  const [zoomImg,setZoomImg]=useState(null);

  const week=useMemo(()=>getWeek(weekBase),[weekBase]);
  const wkLabel=fmtD(week[0])+" – "+fmtD(week[6]);
  const todayISO=iso(new Date());
  const selISO=iso(selDay);

  useEffect(()=>{(async()=>{
    const d=await load();
    if(d)setData({...EMPTY,...d});
    else { setData({...INIT}); await save({...INIT}); }
    setLoaded(true);
  })();},[]);

  const saveTimer = useRef(null);
  useEffect(()=>{
    if(!loaded) return;
    setSyncStatus("saving");
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async ()=>{
      const ok = await save(data);
      setSyncStatus(ok ? "saved" : "error");
    }, 400);
    return ()=>{ if(saveTimer.current) clearTimeout(saveTimer.current); };
  },[data,loaded]);

  useEffect(()=>{
    if(!loaded) return;
    const channel = sb.channel("app_data_"+ROW_ID)
      .on("postgres_changes",
          { event: "*", schema: "public", table: "app_data", filter: "id=eq."+ROW_ID },
          (payload)=>{
            const incoming = payload.new && payload.new.data;
            if(!incoming) return;
            if(incoming._sid === MY_SID) return;
            const clean = stripSid(incoming);
            setData(p => JSON.stringify(p)===JSON.stringify(clean) ? p : {...EMPTY, ...clean});
          })
      .subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[loaded]);

  const up=fn=>setData(p=>{const n=JSON.parse(JSON.stringify(p));fn(n);return n;});
  const allSites=useMemo(()=>[...(data.maintenanceSites||[]).map(s=>({...s,type:"m"})),...(data.devSites||[]).map(s=>({...s,type:"d"}))],[data.maintenanceSites,data.devSites]);
  const sn=sid=>allSites.find(s=>s.id===sid)?.name||"?";

  // Universal image picker - camera OR gallery
  const handleAnyImg=(callback)=>(e)=>{
    const f=e.target.files?.[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=ev=>callback(ev.target.result);
    r.readAsDataURL(f);
    e.target.value="";
  };

  // ─── Actions ───
  const togAtt=(dy,wid)=>{up(d=>{if(!d.attendance)d.attendance={};if(!d.attendance[dy])d.attendance[dy]={};const c=d.attendance[dy][wid];if(c&&c.present)d.attendance[dy][wid]={...c,present:false};else d.attendance[dy][wid]={present:true,startTime:(c?.startTime)||"07:30",endTime:(c?.endTime)||"16:00",siteId:(c?.siteId)||""};});};
  const upAtt=(dy,wid,f,v)=>{if(f==="siteId"&&v==="__add__"){setModal("addSiteQuick");return;}up(d=>{if(!d.attendance)d.attendance={};if(!d.attendance[dy])d.attendance[dy]={};const c=d.attendance[dy][wid]||{present:true,startTime:"07:30",endTime:"16:00",siteId:""};d.attendance[dy][wid]={...c,[f]:v};});};
  const getAtt=(dy,wid)=>data.attendance?.[dy]?.[wid]||{present:false,startTime:"07:30",endTime:"16:00",siteId:""};
  const togTask=(dy,tid)=>{up(d=>{const t=(d.dailyTasks?.[dy]||[]).find(x=>x.id===tid);if(t)t.status=t.status==="done"?"todo":"done";});};
  const delTask=(dy,tid)=>{up(d=>{if(d.dailyTasks?.[dy])d.dailyTasks[dy]=d.dailyTasks[dy].filter(x=>x.id!==tid);});};
  const saveTask=()=>{const dateKey=form.taskDate||selISO;up(d=>{if(!d.dailyTasks)d.dailyTasks={};if(!d.dailyTasks[dateKey])d.dailyTasks[dateKey]=[];d.dailyTasks[dateKey].push({id:uid(),siteId:form.siteId,type:form.type,notes:form.notes||"משימה",status:"todo",image:form.image||"",billable:""});});setModal(null);setForm({});};
  const markBillable=(dy,tid,extras)=>{up(d=>{const t=(d.dailyTasks?.[dy]||[]).find(x=>x.id===tid);if(t){t.billable="ready";t.billingExtras=extras||"";}});};
  const markInvoiced=(dy,tid)=>{up(d=>{const t=(d.dailyTasks?.[dy]||[]).find(x=>x.id===tid);if(t)t.billable="invoiced";});};
  const saveReceipt=()=>{up(d=>{if(!d.receipts)d.receipts=[];d.receipts.push({id:uid(),date:selISO,amount:+form.amount||0,client:form.client,desc:form.desc});});setModal(null);};
  const quickSaveExp=(siteId)=>{up(d=>{if(!d.expenses)d.expenses=[];d.expenses.push({id:uid(),date:todayISO,amount:0,desc:"",siteId,type:"invoice",image:expImg||""});});setExpImg(null);setExpStep(0);setModal(null);};

  // ─── Photo: store under SITE id (not date) so site has its own gallery ───
  const savePhoto=(siteId,photoType,note,image,date)=>{
    up(d=>{
      if(!d.photos)d.photos={};
      const key=siteId||"general";
      if(!d.photos[key])d.photos[key]=[];
      d.photos[key].push({id:uid(),date:date||todayISO,photoType:photoType||"",note:note||"",image:image||"",siteId:siteId||""});
    });
  };
  const delPhoto=(key,id)=>{up(d=>{if(d.photos?.[key])d.photos[key]=d.photos[key].filter(p=>p.id!==id);});};
  const movePhoto=(oldKey,id,newSiteId)=>{up(d=>{const ph=(d.photos?.[oldKey]||[]).find(p=>p.id===id);if(!ph)return;d.photos[oldKey]=d.photos[oldKey].filter(p=>p.id!==id);const nk=newSiteId||"general";if(!d.photos[nk])d.photos[nk]=[];ph.siteId=newSiteId||"";d.photos[nk].push(ph);});};

  // ─── Trip ───
  const saveTrip=()=>{const dateKey=form.tripDate||selISO;const place=(form.tripPlace||"").trim();if(!place)return;up(d=>{if(!d.trips)d.trips={};if(!d.trips[dateKey])d.trips[dateKey]=[];d.trips[dateKey].push({id:uid(),place,note:(form.tripNote||"").trim()});});setModal(null);setForm({});};
  const delTrip=(dy,tid)=>{up(d=>{if(d.trips?.[dy])d.trips[dy]=d.trips[dy].filter(x=>x.id!==tid);});};

  // ─── Next Visit Notes (per site) ───
  const addNextVisitNote=(siteId,text)=>{if(!text.trim())return;up(d=>{if(!d.nextVisitNotes)d.nextVisitNotes={};if(!d.nextVisitNotes[siteId])d.nextVisitNotes[siteId]=[];d.nextVisitNotes[siteId].push({id:uid(),text:text.trim(),done:false,addedDate:todayISO});});};
  const togNextVisit=(siteId,nid)=>{up(d=>{const n=(d.nextVisitNotes?.[siteId]||[]).find(x=>x.id===nid);if(n)n.done=!n.done;});};
  const delNextVisit=(siteId,nid)=>{up(d=>{if(d.nextVisitNotes?.[siteId])d.nextVisitNotes[siteId]=d.nextVisitNotes[siteId].filter(x=>x.id!==nid);});};

  // ─── Meetings ───
  const saveMeeting=()=>{up(d=>{if(!d.meetings)d.meetings=[];d.meetings.push({id:uid(),siteId:form.meetingSiteId||"",date:form.meetingDate||todayISO,time:form.meetingTime||"",notes:form.meetingNotes||"",done:false});});setModal(null);setForm({});};
  const togMeeting=(mid)=>{up(d=>{const m=(d.meetings||[]).find(x=>x.id===mid);if(m)m.done=!m.done;});};
  const delMeeting=(mid)=>{up(d=>{if(d.meetings)d.meetings=d.meetings.filter(x=>x.id!==mid);});};

  // ─── Billing Extras (per site, accumulate) ───
  const addBillingExtra=()=>{const amt=+form.extraAmount;if(!amt||!form.extraSiteId)return;up(d=>{if(!d.billingExtras)d.billingExtras=[];d.billingExtras.push({id:uid(),siteId:form.extraSiteId,date:form.extraDate||todayISO,amount:amt,desc:form.extraDesc||"",invoiced:false});});setModal(null);setForm({});};
  const togExtraInvoiced=(eid)=>{up(d=>{const e=(d.billingExtras||[]).find(x=>x.id===eid);if(e)e.invoiced=!e.invoiced;});};
  const delExtra=(eid)=>{up(d=>{if(d.billingExtras)d.billingExtras=d.billingExtras.filter(x=>x.id!==eid);});};

  // ─── Project Orders (materials/equipment per project) ───
  const addOrder=()=>{if(!form.orderProjectId||!form.orderDesc)return;up(d=>{if(!d.projectOrders)d.projectOrders={};if(!d.projectOrders[form.orderProjectId])d.projectOrders[form.orderProjectId]=[];d.projectOrders[form.orderProjectId].push({id:uid(),desc:form.orderDesc.trim(),supplier:form.orderSupplier||"",amount:+form.orderAmount||0,status:form.orderStatus||"ordered",date:todayISO,note:form.orderNote||""});});setModal(null);setForm({});};
  const upOrderStatus=(pid,oid,status)=>{up(d=>{const o=(d.projectOrders?.[pid]||[]).find(x=>x.id===oid);if(o)o.status=status;});};
  const delOrder=(pid,oid)=>{up(d=>{if(d.projectOrders?.[pid])d.projectOrders[pid]=d.projectOrders[pid].filter(x=>x.id!==oid);});};

  // ─── Sub contractors ───
  const quickAddSub=()=>{const n=(form.subName||"").trim();if(!n)return;const dates=(form.subDates||[todayISO]).filter(d=>d);if(!dates.length)return;up(d=>{if(!d.subContracts)d.subContracts=[];let siteId=form.subSiteId||"";if(siteId==="__new__"){const newName=(form.subNewSite||"").trim();if(newName){const newId=uid();if(!d.devSites)d.devSites=[];d.devSites.push({id:newId,name:newName,deadline:""});siteId=newId;}else{siteId="";}}d.subContracts.push({id:uid(),name:n,siteId,dates,status:"planned"});});setModal(null);setForm({});};
  const completeSub=()=>{up(d=>{const s=(d.subContracts||[]).find(x=>x.id===form.subId);if(!s)return;s.status="done";s.workerCount=+form.subWorkerCount||1;s.hoursFrom=form.subFrom||"07:00";s.hoursTo=form.subTo||"16:00";s.notes=form.subNotes||"";});setModal(null);setForm({});};
  const delSub=(id)=>{up(d=>{if(d.subContracts)d.subContracts=d.subContracts.filter(x=>x.id!==id);});};
  const removeSubFromDay=(subId,dateKey)=>{up(d=>{const s=(d.subContracts||[]).find(x=>x.id===subId);if(!s)return;s.dates=(s.dates||[]).filter(x=>x!==dateKey);if(s.dates.length===0)d.subContracts=d.subContracts.filter(x=>x.id!==subId);});};

  const togWA=(dy,sid,type)=>{up(d=>{if(!d.weekAssign)d.weekAssign={};if(!d.weekAssign[dy])d.weekAssign[dy]=[];const i=d.weekAssign[dy].findIndex(a=>a.siteId===sid);if(i>=0)d.weekAssign[dy].splice(i,1);else d.weekAssign[dy].push({siteId:sid,type});});};
  const isAsgn=(dy,sid)=>(data.weekAssign?.[dy]||[]).some(a=>a.siteId===sid);
  const addDev=()=>{if(!sND.trim())return;up(d=>{d.devSites=[...(d.devSites||[]),{id:uid(),name:sND.trim(),deadline:sNDD,quotedPrice:0,status:"active"}];});setSND("");setSNDD("");};

  const login=()=>{if(pw===PW){setAuthed(true);setPwErr(false);}else{setPwErr(true);setShake(true);setTimeout(()=>setShake(false),500);}};

  // LOGIN
  if(!authed)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(160deg,#1b4332,#2d6a4f 50%,#40916c)",fontFamily:"'Rubik',sans-serif",direction:"rtl"}}>
      <style>{`@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}*{box-sizing:border-box;margin:0}`}</style>
      <div style={{width:360,maxWidth:"92vw",padding:"40px 32px",borderRadius:20,background:"rgba(255,253,245,0.96)",boxShadow:"0 24px 80px rgba(0,0,0,0.25)",animation:shake?"shake 0.4s":"fadeIn 0.5s",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:4,animation:"fl 3s ease-in-out infinite"}}>🌿</div>
        <h1 style={{fontSize:24,fontWeight:700,color:C.grn,margin:"0 0 24px"}}>{"מעקב גינון"}</h1>
        <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setPwErr(false);}} onKeyDown={e=>e.key==="Enter"&&login()} placeholder={"סיסמה"} style={{width:"100%",padding:14,borderRadius:10,border:"2px solid "+(pwErr?C.red:C.bdr),fontSize:20,textAlign:"center",letterSpacing:6,fontFamily:"inherit",outline:"none",boxSizing:"border-box",marginBottom:12}}/>
        {pwErr&&<p style={{color:C.red,fontSize:13,marginBottom:8}}>{"שגויה"}</p>}
        <button onClick={login} style={{width:"100%",padding:16,borderRadius:12,border:"none",background:C.grn,color:"#fff",fontSize:18,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"כניסה"}</button>
      </div>
    </div>
  );

  const vs=["monthly","weekly","daily","gallery","projects","settings"];
  const cv=vs.includes(view)?view:"monthly";
  const inSubView = cv!=="monthly";

  // HEADER
  const header=<div style={{background:C.hdr,padding:"12px 16px",color:"#fff",position:"sticky",top:0,zIndex:100}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        {inSubView && <button onClick={()=>setView("monthly")} style={{background:"rgba(255,255,255,0.18)",border:"none",color:"#fff",width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit",lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center"}}>{"←"}</button>}
        <button onClick={()=>setAuthed(false)} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",padding:"4px 12px",borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>{"יציאה"}</button>
        {syncStatus==="error" && <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 8px",borderRadius:10,fontSize:10,fontWeight:600,background:"rgba(252,165,165,0.25)",color:"#fff"}}><span style={{width:6,height:6,borderRadius:"50%",background:"#ff6b6b"}}></span>{"לא מחובר"}</span>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>setView("settings")} title={"הגדרות"} style={{background:cv==="settings"?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.15)",border:"none",color:"#fff",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit",lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center"}}>{"⚙️"}</button>
        <span style={{fontSize:17,fontWeight:700}}>{"מעקב גינון"}</span>
        <span style={{fontSize:22}}>🌿</span>
      </div>
    </div>
  </div>;

  // ═══ MONTHLY ═══
  const monthlyView=(()=>{
    const now=new Date();
    const mm=now.getMonth(),yy=now.getFullYear();
    const firstDay=new Date(yy,mm,1);
    const daysInMonth=new Date(yy,mm+1,0).getDate();
    const firstDow=firstDay.getDay();
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push(null);
    for(let d=1;d<=daysInMonth;d++) cells.push(new Date(yy,mm,d));

    const billReady=[];
    const reminders=[];
    Object.keys(data.dailyTasks||{}).forEach(d=>{(data.dailyTasks[d]||[]).forEach(t=>{
      if(t.billable==="ready")billReady.push({...t,date:d});
      if(t.status!=="done" && !t.siteId)reminders.push({...t,date:d});
    });});
    reminders.sort((a,b)=>a.date.localeCompare(b.date));

    // Upcoming meetings (next 7 days)

      <div style={{fontSize:15,fontWeight:700,textAlign:"center",marginBottom:10}}>{"🔧 תחזוקות"}</div>
      {(data.maintenanceSites||[]).map(s=><div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderRadius:8,background:C.cardA,marginBottom:6}}><div style={{display:"flex",alignItems:"center",gap:6}}><span onClick={()=>up(d=>{d.maintenanceSites=d.maintenanceSites.filter(x=>x.id!==s.id);})} style={{cursor:"pointer",color:C.red,fontSize:16}}>✕</span><span style={{padding:"2px 6px",borderRadius:10,fontSize:9,background:C.orgB,color:C.org}}>{s.frequency}</span></div><span style={{fontWeight:500}}>{s.name}</span></div>)}
      <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
        <button onClick={()=>{if(!sNM.trim())return;up(d=>{d.maintenanceSites=[...(d.maintenanceSites||[]),{id:uid(),name:sNM.trim(),frequency:sNMF}];});setSNM("");}} style={{padding:"8px 12px",borderRadius:8,border:"1px solid "+C.bdr,background:C.wht,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}}>+</button>
        <select value={sNMF} onChange={e=>setSNMF(e.target.value)} style={{padding:8,borderRadius:8,border:"1px solid "+C.bdr,fontSize:11,fontFamily:"inherit",direction:"rtl"}}><option>{"2 פעמים בשבוע"}</option><option>{"כל שבוע"}</option><option>{"דו שבועי"}</option><option>{"פעמיים בחודש"}</option><option>{"פעם בחודש"}</option></select>
        <input value={sNM} onChange={e=>setSNM(e.target.value)} placeholder={"שם אתר"} style={{flex:1,minWidth:80,padding:"8px 12px",borderRadius:8,border:"1px solid "+C.bdr,fontSize:14,fontFamily:"inherit",direction:"rtl",outline:"none",boxSizing:"border-box"}}/>
      </div>
    </div>
    <div style={{background:C.card,borderRadius:14,border:"1px solid "+C.bdr,padding:16,marginBottom:12}}>
      <div style={{fontSize:15,fontWeight:700,textAlign:"center",marginBottom:10}}>{"🌱 פרויקטים"}</div>
      {(data.devSites||[]).map(s=><div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderRadius:8,background:C.cardA,marginBottom:6}}><div style={{display:"flex",alignItems:"center",gap:6}}><span onClick={()=>up(d=>{d.devSites=d.devSites.filter(x=>x.id!==s.id);})} style={{cursor:"pointer",color:C.red,fontSize:16}}>✕</span>{s.deadline&&<span style={{padding:"2px 6px",borderRadius:10,fontSize:9,background:C.bluB,color:C.blu}}>{s.deadline}</span>}</div><span style={{fontWeight:500}}>{s.name}</span></div>)}
      <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
        <button onClick={addDev} style={{padding:"8px 12px",borderRadius:8,border:"1px solid "+C.bdr,background:C.wht,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}}>+</button>
        <input type="date" value={sNDD} onChange={e=>setSNDD(e.target.value)} style={{padding:8,borderRadius:8,border:"1px solid "+C.bdr,fontSize:11,fontFamily:"inherit"}}/>
        <input value={sND} onChange={e=>setSND(e.target.value)} placeholder={"שם פרויקט"} style={{flex:1,minWidth:80,padding:"8px 12px",borderRadius:8,border:"1px solid "+C.bdr,fontSize:14,fontFamily:"inherit",direction:"rtl",outline:"none",boxSizing:"border-box"}}/>
      </div>
    </div>
    <div style={{textAlign:"center",marginTop:16}}><button onClick={()=>setModal("reset")} style={{padding:"10px 20px",borderRadius:10,border:"none",background:C.red,color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"🗑 איפוס"}</button></div>
  </div>;

  // ═══ MODALS ═══
  const renderModal=()=>{
    if(!modal)return null;
    const ov={position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(3px)",padding:16};
    const bx={background:C.card,borderRadius:16,padding:22,width:400,maxWidth:"95vw",maxHeight:"85vh",overflowY:"auto"};
    const close=()=>{setModal(null);setExpImg(null);setExpStep(0);};
    const inp={width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid "+C.bdr,fontSize:14,fontFamily:"inherit",boxSizing:"border-box",direction:"rtl",outline:"none"};
    const sb={width:"100%",padding:14,borderRadius:12,border:"none",background:C.grn,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginTop:8};
    const lb={fontSize:12,fontWeight:600,color:C.txtM,display:"block",marginBottom:4};

    // ─── ADD TRIP ───
    if(modal==="addTrip")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:18,color:C.purp,marginBottom:14,textAlign:"center"}}>{"🚗 הוספת נסיעה"}</h3>
      <div style={{marginBottom:12}}>
        <label style={lb}>{"לאיפה?"}</label>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:8}}>
          {TRIP_PRESETS.map(p=><button key={p} onClick={()=>setForm({...form,tripPlace:p})} style={{width:"100%",padding:"14px",borderRadius:10,border:"2px solid "+(form.tripPlace===p?C.purp:C.bdr),background:form.tripPlace===p?C.purpB:"#fff",color:form.tripPlace===p?C.purp:C.txt,fontSize:16,fontWeight:form.tripPlace===p?700:500,cursor:"pointer",fontFamily:"inherit",textAlign:"right",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span>{form.tripPlace===p?"✓":""}</span>
            <span>{"📍 "+p}</span>
          </button>)}
        </div>
        <input value={(TRIP_PRESETS.includes(form.tripPlace)?"":form.tripPlace)||""} onChange={e=>setForm({...form,tripPlace:e.target.value})} placeholder={"או מקום אחר..."} style={inp}/>
      </div>
      <div style={{marginBottom:12}}>
        <label style={lb}>{"מה הלכת להביא / הערה"}</label>
        <textarea value={form.tripNote||""} onChange={e=>setForm({...form,tripNote:e.target.value})} placeholder={"לדוגמה: דשן, זרעים..."} style={{...inp,minHeight:70,resize:"vertical"}}/>
      </div>
      <div style={{marginBottom:14}}>
        <label style={lb}>{"תאריך"}</label>
        <input type="date" value={form.tripDate||selISO} onChange={e=>setForm({...form,tripDate:e.target.value})} style={inp}/>
      </div>
      <button onClick={saveTrip} style={{...sb,background:C.purp}}>{"שמור נסיעה"}</button>
    </div></div>;

    // ─── ADD MEETING ───
    if(modal==="addMeeting")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:18,color:C.purp,marginBottom:14,textAlign:"center"}}>{"📅 פגישה חדשה"}</h3>
      <div style={{marginBottom:12}}>
        <label style={lb}>{"לקוח / אתר"}</label>
        <select value={form.meetingSiteId||""} onChange={e=>setForm({...form,meetingSiteId:e.target.value})} style={inp}>
          <option value="">{"-- בחר --"}</option>
          {allSites.map(s=><option key={s.id} value={s.id}>{(s.type==="m"?"🔧 ":"🌱 ")+s.name}</option>)}
        </select>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <div style={{flex:1}}><label style={lb}>{"תאריך"}</label><input type="date" value={form.meetingDate||todayISO} onChange={e=>setForm({...form,meetingDate:e.target.value})} style={inp}/></div>
        <div style={{flex:1}}><label style={lb}>{"שעה"}</label><input type="time" value={form.meetingTime||""} onChange={e=>setForm({...form,meetingTime:e.target.value})} style={inp}/></div>
      </div>
      <div style={{marginBottom:14}}>
        <label style={lb}>{"הערות / נושאים"}</label>
        <textarea value={form.meetingNotes||""} onChange={e=>setForm({...form,meetingNotes:e.target.value})} placeholder={"מה לדבר עליו..."} style={{...inp,minHeight:70,resize:"vertical"}}/>
      </div>
      <button onClick={saveMeeting} style={{...sb,background:C.purp}}>{"שמור פגישה"}</button>
    </div></div>;

    // ─── ADD PROJECT ───
    if(modal==="addProject")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:18,color:C.blu,marginBottom:14,textAlign:"center"}}>{"🌱 פרויקט חדש"}</h3>
      <div style={{marginBottom:10}}><label style={lb}>{"שם הפרויקט"}</label><input value={form.newProjectName||""} onChange={e=>setForm({...form,newProjectName:e.target.value})} style={inp} autoFocus/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"שם הלקוח"}</label><input value={form.newProjectClient||""} onChange={e=>setForm({...form,newProjectClient:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"טלפון"}</label><input type="tel" value={form.newProjectPhone||""} onChange={e=>setForm({...form,newProjectPhone:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"כתובת"}</label><input value={form.newProjectAddress||""} onChange={e=>setForm({...form,newProjectAddress:e.target.value})} style={inp}/></div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <div style={{flex:1}}><label style={lb}>{"💼 הצעת מחיר (₪)"}</label><input type="number" value={form.newProjectPrice||""} onChange={e=>setForm({...form,newProjectPrice:e.target.value})} placeholder={"4500"} style={inp}/></div>
        <div style={{flex:1}}><label style={lb}>{"יעד"}</label><input type="date" value={form.newProjectDeadline||""} onChange={e=>setForm({...form,newProjectDeadline:e.target.value})} style={inp}/></div>
      </div>
      <button onClick={()=>{if(!(form.newProjectName||"").trim())return;up(d=>{d.devSites=[...(d.devSites||[]),{id:uid(),name:form.newProjectName.trim(),deadline:form.newProjectDeadline||"",quotedPrice:+form.newProjectPrice||0,client:form.newProjectClient||"",phone:form.newProjectPhone||"",address:form.newProjectAddress||"",status:"active"}];});setForm({});setModal(null);}} style={{...sb,background:C.blu}}>{"צור פרויקט"}</button>
    </div></div>;

    // ─── ADD ORDER ───
    if(modal==="addOrder")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:18,color:C.org,marginBottom:14,textAlign:"center"}}>{"📦 הזמנה חדשה"}</h3>
      <div style={{marginBottom:10}}><label style={lb}>{"מה הוזמן?"}</label><input value={form.orderDesc||""} onChange={e=>setForm({...form,orderDesc:e.target.value})} placeholder={"לדוגמה: דקל אדום, 5 שתילים"} style={inp} autoFocus/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"ספק"}</label><input value={form.orderSupplier||""} onChange={e=>setForm({...form,orderSupplier:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"מחיר (₪)"}</label><input type="number" value={form.orderAmount||""} onChange={e=>setForm({...form,orderAmount:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"סטטוס"}</label>
        <select value={form.orderStatus||"ordered"} onChange={e=>setForm({...form,orderStatus:e.target.value})} style={inp}>
          <option value="ordered">{"📞 הוזמן"}</option><option value="onway">{"🚛 בדרך"}</option><option value="received">{"✅ התקבל"}</option>
        </select>
      </div>
      <div style={{marginBottom:14}}><label style={lb}>{"הערות"}</label><textarea value={form.orderNote||""} onChange={e=>setForm({...form,orderNote:e.target.value})} style={{...inp,minHeight:50}}/></div>
      <button onClick={addOrder} style={{...sb,background:C.org}}>{"שמור הזמנה"}</button>
    </div></div>;

    // ─── ADD BILLING EXTRA ───
    if(modal==="addBillingExtra")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:18,color:C.org,marginBottom:14,textAlign:"center"}}>{"💰 תוספת לחיוב"}</h3>
      <div style={{marginBottom:10}}><label style={lb}>{"לקוח / אתר"}</label>
        <select value={form.extraSiteId||""} onChange={e=>setForm({...form,extraSiteId:e.target.value})} style={inp}>
          <option value="">{"-- בחר --"}</option>{allSites.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </div>
      <div style={{marginBottom:10}}><label style={lb}>{"סכום (₪)"}</label><input type="number" value={form.extraAmount||""} onChange={e=>setForm({...form,extraAmount:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"תיאור"}</label><input value={form.extraDesc||""} onChange={e=>setForm({...form,extraDesc:e.target.value})} placeholder={"דשן נוסף, שתילי בוקסוס..."} style={inp}/></div>
      <div style={{marginBottom:14}}><label style={lb}>{"תאריך"}</label><input type="date" value={form.extraDate||todayISO} onChange={e=>setForm({...form,extraDate:e.target.value})} style={inp}/></div>
      <button onClick={addBillingExtra} style={{...sb,background:C.org}}>{"הוסף תוספת"}</button>
    </div></div>;

    // ─── SITE DETAIL ───
    if(modal==="siteDetail"){
      const site=allSites.find(s=>s.id===form.siteId);
      if(!site)return null;
      const isDev=site.type==="d";
      const accent=isDev?C.blu:C.org;
      const accentBg=isDev?C.bluB:C.orgB;
      const siteTasks=[];
      Object.keys(data.dailyTasks||{}).forEach(d=>{(data.dailyTasks[d]||[]).forEach(t=>{if(t.siteId===site.id)siteTasks.push({...t,date:d});});});
      siteTasks.sort((a,b)=>b.date.localeCompare(a.date));
      const sitePhotos=(data.photos?.[site.id]||[]).slice().reverse();
      const siteOrders=(data.projectOrders?.[site.id]||[]);
      const siteExtras=(data.billingExtras||[]).filter(e=>e.siteId===site.id);
      const siteMeetings=(data.meetings||[]).filter(m=>m.siteId===site.id).sort((a,b)=>b.date.localeCompare(a.date));
      const nextNotes=(data.nextVisitNotes?.[site.id]||[]);
      const billPending=siteTasks.filter(t=>t.billable==="ready").length;
      const billInvoiced=siteTasks.filter(t=>t.billable==="invoiced").length;
      const updateSite=(patch)=>{up(d=>{const arr=isDev?"devSites":"maintenanceSites";const idx=d[arr].findIndex(x=>x.id===site.id);if(idx>=0)d[arr][idx]={...d[arr][idx],...patch};});};

      const detailTabs=[
        {key:"overview",label:"סקירה",icon:"📊"},
        {key:"notes",label:"הערות",icon:"📝"},
        {key:"nextvisit",label:"לטיפול הבא",icon:"💡"},
        {key:"tasks",label:"משימות",icon:"📋"},
        {key:"photos",label:"תמונות",icon:"📷"},
        ...(isDev?[{key:"orders",label:"הזמנות",icon:"📦"}]:[]),
        {key:"billing",label:"חיוב",icon:"💰"},
        {key:"meetings",label:"פגישות",icon:"📅"},
      ];

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"92vh"}}>
        {/* Sticky header */}
        <div style={{background:accent,color:"#fff",padding:"14px 18px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:11,opacity:0.85}}>{isDev?"🌱 פרויקט":"🔧 תחזוקה"}</div>
              <div style={{fontSize:18,fontWeight:700}}>{site.name}</div>
            </div>
          </div>
          {/* Sub tabs */}
          <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:2}}>
            {detailTabs.map(t=><button key={t.key} onClick={()=>setSiteDetailTab(t.key)} style={{flex:"0 0 auto",padding:"6px 10px",borderRadius:14,border:"none",background:siteDetailTab===t.key?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:11,fontWeight:siteDetailTab===t.key?700:400,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{t.icon+" "+t.label}</button>)}
          </div>
        </div>

        <div style={{padding:"16px 18px",overflowY:"auto",maxHeight:"calc(92vh - 110px)"}}>
          {/* OVERVIEW */}
          {siteDetailTab==="overview" && <div>
            {/* Quick action buttons */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:6,marginBottom:14}}>
              <button onClick={()=>{setForm({notes:"",siteId:site.id,type:site.type,image:"",taskDate:todayISO});setModal("addTask");}} style={{padding:"10px 4px",borderRadius:10,border:"none",background:C.grn,color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"➕ משימה"}</button>
              <button onClick={()=>{setExpImg(null);setExpStep(0);setForm({siteId:site.id});setModal("quickPhoto");}} style={{padding:"10px 4px",borderRadius:10,border:"none",background:C.hdr,color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"📷 תמונה"}</button>
              <button onClick={()=>{setForm({extraSiteId:site.id,extraAmount:"",extraDesc:"",extraDate:todayISO});setModal("addBillingExtra");}} style={{padding:"10px 4px",borderRadius:10,border:"none",background:C.org,color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"💰 תוספת"}</button>
            </div>

            {/* Stats */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:6,marginBottom:14}}>
              {[["📋",siteTasks.filter(t=>t.status!=="done").length,"פתוחות"],["📷",sitePhotos.length,"תמונות"],["💰",billPending,"לחיוב"],["✓",billInvoiced,"חויבו"]].map(([i,v,l],k)=><div key={k} style={{background:accentBg,borderRadius:8,padding:"8px 4px",textAlign:"center"}}>
                <div style={{fontSize:14}}>{i}</div>
                <div style={{fontSize:16,fontWeight:700,color:accent}}>{v}</div>
                <div style={{fontSize:9,color:C.txtM}}>{l}</div>
              </div>)}
            </div>

            {/* Project price summary */}
            {isDev && site.quotedPrice>0 && <div style={{background:C.bluB,borderRadius:10,padding:12,marginBottom:14,border:"1px solid "+C.blu}}>
              <div style={{fontSize:12,fontWeight:700,color:C.blu,marginBottom:6}}>{"💼 סיכום כספי"}</div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}>
                <span style={{fontWeight:700,color:C.blu}}>{"₪"+site.quotedPrice.toLocaleString()}</span>
                <span style={{color:C.txtM}}>{"הצעת מחיר:"}</span>
              </div>
              {siteExtras.filter(e=>!e.invoiced).length>0 && <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.org}}>
                <span style={{fontWeight:700}}>{"+₪"+siteExtras.filter(e=>!e.invoiced).reduce((s,e)=>s+(+e.amount||0),0).toLocaleString()}</span>
                <span>{"תוספות לחיוב:"}</span>
              </div>}
              {siteOrders.length>0 && <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.red,marginTop:3}}>
                <span style={{fontWeight:700}}>{"-₪"+siteOrders.reduce((s,o)=>s+(+o.amount||0),0).toLocaleString()}</span>
                <span>{"הוצאות חומרים:"}</span>
              </div>}
              <hr style={{border:"none",borderTop:"1px solid "+C.blu+"40",margin:"8px 0"}}/>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:700}}>
                <span style={{color:C.grn}}>{"₪"+(site.quotedPrice+siteExtras.filter(e=>!e.invoiced).reduce((s,e)=>s+(+e.amount||0),0)-siteOrders.reduce((s,o)=>s+(+o.amount||0),0)).toLocaleString()}</span>
                <span>{"רווח צפוי:"}</span>
              </div>
            </div>}

            {/* Quick info */}
            <div style={{background:C.cardA,borderRadius:10,padding:12,fontSize:13,lineHeight:1.8}}>
              {site.client && <div>{"👤 "+site.client}</div>}
              {site.phone && <div>{"📞 "}<a href={"tel:"+site.phone} style={{color:accent}}>{site.phone}</a></div>}
              {site.address && <div>{"📍 "+site.address}</div>}
              {isDev?(site.deadline && <div>{"📅 יעד: "+site.deadline}</div>):<div>{"🔄 "+site.frequency}</div>}
            </div>

            {/* Status toggle for projects */}
            {isDev && <button onClick={()=>updateSite({status:site.status==="done"?"active":"done"})} style={{marginTop:12,width:"100%",padding:12,borderRadius:10,border:"none",background:site.status==="done"?C.grn:C.cardA,color:site.status==="done"?"#fff":C.txt,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{site.status==="done"?"✓ הפרויקט הושלם (לחץ לפתיחה מחדש)":"סמן כהושלם ✓"}</button>}
          </div>}

          {/* NOTES */}
          {siteDetailTab==="notes" && <div>
            <div style={{fontSize:12,color:C.txtM,marginBottom:8}}>{"הערות קבועות שנשמרות לכרטיס זה"}</div>
            <textarea value={site.notes||""} onChange={e=>updateSite({notes:e.target.value})} placeholder={"לדוגמה: יש כלב, השער מקודקד 1234, להתקשר לפני הגעה..."} style={{width:"100%",minHeight:200,padding:12,borderRadius:10,border:"1px solid "+C.bdr,fontSize:14,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box",direction:"rtl"}}/>

            {/* Site fields */}
            <div style={{marginTop:14,background:C.cardA,borderRadius:10,padding:12}}>
              <div style={{fontSize:12,fontWeight:700,marginBottom:8,color:accent}}>{"⚙️ פרטי הלקוח"}</div>
              <div style={{display:"flex",flexDirection:"column",gap:6,fontSize:13}}>
                <input value={site.client||""} onChange={e=>updateSite({client:e.target.value})} placeholder={"שם לקוח"} style={{...inp,fontSize:13,padding:"8px 10px"}}/>
                <input value={site.phone||""} onChange={e=>updateSite({phone:e.target.value})} placeholder={"טלפון"} type="tel" style={{...inp,fontSize:13,padding:"8px 10px"}}/>
                <input value={site.address||""} onChange={e=>updateSite({address:e.target.value})} placeholder={"כתובת"} style={{...inp,fontSize:13,padding:"8px 10px"}}/>
                {isDev && <React.Fragment>
                  <input type="number" value={site.quotedPrice||""} onChange={e=>updateSite({quotedPrice:+e.target.value})} placeholder={"💼 הצעת מחיר ₪"} style={{...inp,fontSize:13,padding:"8px 10px"}}/>
                  <input type="date" value={site.deadline||""} onChange={e=>updateSite({deadline:e.target.value})} style={{...inp,fontSize:13,padding:"8px 10px"}}/>
                </React.Fragment>}
                {!isDev && <select value={site.frequency||"כל שבוע"} onChange={e=>updateSite({frequency:e.target.value})} style={{...inp,fontSize:13,padding:"8px 10px"}}>
                  <option>{"2 פעמים בשבוע"}</option><option>{"כל שבוע"}</option><option>{"דו שבועי"}</option><option>{"פעמיים בחודש"}</option><option>{"פעם בחודש"}</option>
                </select>}
              </div>
            </div>
          </div>}

          {/* NEXT VISIT NOTES */}
          {siteDetailTab==="nextvisit" && <div>
            <div style={{fontSize:12,color:C.txtM,marginBottom:10}}>{"💡 הערות לטיפול הבא - יופיעו בשיבוץ הבא של אתר זה"}</div>
            <div style={{display:"flex",gap:6,marginBottom:14}}>
              <button onClick={()=>{const t=form.newNoteText;if(!t)return;addNextVisitNote(site.id,t);setForm({...form,newNoteText:""});}} style={{padding:"10px 14px",borderRadius:8,border:"none",background:C.purp,color:"#fff",cursor:"pointer",fontSize:14,fontWeight:700,fontFamily:"inherit"}}>{"+"}</button>
              <input value={form.newNoteText||""} onChange={e=>setForm({...form,newNoteText:e.target.value})} onKeyDown={e=>{if(e.key==="Enter"&&form.newNoteText){addNextVisitNote(site.id,form.newNoteText);setForm({...form,newNoteText:""});}}} placeholder={"לדוגמה: להביא דשן..."} style={inp}/>
            </div>
            {nextNotes.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין הערות"}</div>}
            {nextNotes.map(n=><div key={n.id} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",borderRadius:10,background:n.done?C.grnP:C.purpB,marginBottom:6,border:"1px solid "+(n.done?C.grnL:C.purp)}}>
              <span onClick={()=>delNextVisit(site.id,n.id)} style={{fontSize:14,color:C.red,cursor:"pointer"}}>🗑</span>
              <span onClick={()=>togNextVisit(site.id,n.id)} style={{fontSize:22,cursor:"pointer"}}>{n.done?"✅":"⬜"}</span>
              <div style={{flex:1,textAlign:"right"}}>
                <div style={{fontSize:14,fontWeight:500,textDecoration:n.done?"line-through":"none"}}>{n.text}</div>
                <div style={{fontSize:10,color:C.txtM}}>{"נוסף "+fmtFull(n.addedDate)}</div>
              </div>
            </div>)}
          </div>}

          {/* TASKS */}
          {siteDetailTab==="tasks" && <div>
            <button onClick={()=>{setForm({notes:"",siteId:site.id,type:site.type,image:"",taskDate:todayISO});setModal("addTask");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.grn,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ משימה חדשה"}</button>
            {siteTasks.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין משימות"}</div>}
            {siteTasks.map(t=><div key={t.id} style={{padding:"10px 12px",borderRadius:8,background:t.status==="done"?C.grnP:C.cardA,marginBottom:6,border:"1px solid "+(t.status==="done"?C.grnL:C.bdr)}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span onClick={()=>togTask(t.date,t.id)} style={{fontSize:22,cursor:"pointer"}}>{t.status==="done"?"✅":"⬜"}</span>
                <span onClick={()=>delTask(t.date,t.id)} style={{fontSize:12,color:C.red,cursor:"pointer"}}>🗑</span>
                <div style={{flex:1,textAlign:"right",fontSize:13}}>
                  <div style={{fontWeight:500,textDecoration:t.status==="done"?"line-through":"none"}}>{t.notes}</div>
                  <div style={{fontSize:10,color:C.txtM}}>{fmtFull(t.date)}</div>
                </div>
                {t.image && <img src={t.image} onClick={()=>setZoomImg(t.image)} style={{width:36,height:36,objectFit:"cover",borderRadius:5,cursor:"pointer"}} alt=""/>}
              </div>
              {t.status==="done" && !t.billable && <button onClick={()=>{setForm({taskDay:t.date,taskId:t.id,extras:""});setModal("billingForm");}} style={{marginTop:6,width:"100%",padding:"6px",borderRadius:6,border:"1px solid "+C.org,background:"#fff3cd",color:C.org,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"💰 שלח לחיוב"}</button>}
              {t.billable==="ready" && <div style={{marginTop:6,fontSize:11,color:C.org,fontWeight:700}}>{"💰 מוכן לחיוב"+(t.billingExtras?" · "+t.billingExtras:"")}</div>}
              {t.billable==="invoiced" && <div style={{marginTop:6,fontSize:11,color:C.grn,fontWeight:700}}>{"✓ חויב"}</div>}
            </div>)}
          </div>}

          {/* PHOTOS */}
          {siteDetailTab==="photos" && <div>
            <button onClick={()=>{setExpImg(null);setExpStep(0);setForm({siteId:site.id,photoType:""});setModal("quickPhoto");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.hdr,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"📷 הוסף תמונה"}</button>
            {sitePhotos.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין תמונות"}</div>}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:6}}>
              {sitePhotos.map(p=><div key={p.id} onClick={()=>setZoomImg(p)} style={{position:"relative",cursor:"pointer"}}>
                <img src={p.image} style={{width:"100%",aspectRatio:"1",objectFit:"cover",borderRadius:8}} alt=""/>
                {p.photoType && <span style={{position:"absolute",top:4,right:4,padding:"1px 5px",borderRadius:5,fontSize:8,fontWeight:700,background:p.photoType==="before"?"#fff3cd":"#d8f3dc",color:p.photoType==="before"?C.org:C.grn}}>{p.photoType==="before"?"לפני":"אחרי"}</span>}
              </div>)}
            </div>
          </div>}

          {/* ORDERS */}
          {siteDetailTab==="orders" && isDev && <div>
            <button onClick={()=>{setForm({orderProjectId:site.id,orderDesc:"",orderSupplier:"",orderAmount:"",orderStatus:"ordered",orderNote:""});setModal("addOrder");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.org,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ הזמנה חדשה"}</button>
            {siteOrders.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין הזמנות"}</div>}
            <div style={{fontSize:12,color:C.txtM,marginBottom:8,textAlign:"center"}}>{"סה\"כ הוצאות: ₪"+siteOrders.reduce((s,o)=>s+(+o.amount||0),0).toLocaleString()}</div>
            {siteOrders.map(o=>{
              const statusInfo=o.status==="received"?{ic:"✅",label:"התקבל",col:C.grn,bg:C.grnP}:o.status==="onway"?{ic:"🚛",label:"בדרך",col:C.org,bg:C.orgB}:{ic:"📞",label:"הוזמן",col:C.txtM,bg:C.cardA};
              return <div key={o.id} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.bdr}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                  <span style={{padding:"2px 8px",borderRadius:8,fontSize:10,fontWeight:700,background:statusInfo.bg,color:statusInfo.col}}>{statusInfo.ic+" "+statusInfo.label}</span>
                  <span style={{fontWeight:700,fontSize:14,textAlign:"right",flex:1,marginRight:8}}>{o.desc}</span>
                </div>
                <div style={{fontSize:11,color:C.txtM,marginBottom:6}}>{(o.supplier?"👤 "+o.supplier+" · ":"")+"₪"+(+o.amount||0).toLocaleString()+" · "+fmtFull(o.date)}</div>
                {o.note && <div style={{fontSize:11,color:C.txtM,padding:"4px 8px",background:C.cardA,borderRadius:5,marginBottom:6}}>{o.note}</div>}
                <div style={{display:"flex",gap:4}}>
                  {o.status!=="ordered" && <button onClick={()=>upOrderStatus(site.id,o.id,"ordered")} style={{flex:1,padding:5,borderRadius:6,border:"1px solid "+C.bdr,background:"#fff",fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"📞 הוזמן"}</button>}
                  {o.status!=="onway" && <button onClick={()=>upOrderStatus(site.id,o.id,"onway")} style={{flex:1,padding:5,borderRadius:6,border:"1px solid "+C.bdr,background:"#fff",fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"🚛 בדרך"}</button>}
                  {o.status!=="received" && <button onClick={()=>upOrderStatus(site.id,o.id,"received")} style={{flex:1,padding:5,borderRadius:6,border:"1px solid "+C.grn,background:C.grnP,color:C.grn,fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>{"✅ התקבל"}</button>}
                  <button onClick={()=>delOrder(site.id,o.id)} style={{padding:"5px 8px",borderRadius:6,border:"1px solid "+C.red,background:"#fff",color:C.red,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"🗑"}</button>
                </div>
              </div>;
            })}
          </div>}

          {/* BILLING */}
          {siteDetailTab==="billing" && <div>
            <button onClick={()=>{setForm({extraSiteId:site.id,extraAmount:"",extraDesc:"",extraDate:todayISO});setModal("addBillingExtra");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.org,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ תוספת לחיוב"}</button>

            {/* Pending bills (tasks) */}
            {siteTasks.filter(t=>t.billable==="ready").length>0 && <div style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.org}}>{"💰 משימות מוכנות לחיוב"}</div>
              {siteTasks.filter(t=>t.billable==="ready").map(t=><div key={t.id} style={{padding:"10px 12px",borderRadius:8,background:"#fff3cd",marginBottom:6,border:"1px solid "+C.org}}>
                <div style={{fontWeight:700,fontSize:13}}>{t.notes}</div>
                <div style={{fontSize:10,color:C.txtM,marginTop:2}}>{fmtFull(t.date)+(t.billingExtras?" · "+t.billingExtras:"")}</div>
                <button onClick={()=>markInvoiced(t.date,t.id)} style={{marginTop:6,padding:"4px 10px",borderRadius:6,border:"none",background:C.org,color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"✓ סמן כחויב"}</button>
              </div>)}
            </div>}

            {/* Extras */}
            {siteExtras.length>0 && <div style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.org}}>{"📌 תוספות לחיוב"}</div>
              <div style={{fontSize:11,color:C.txtM,marginBottom:6}}>{"לא חויב: ₪"+siteExtras.filter(e=>!e.invoiced).reduce((s,e)=>s+(+e.amount||0),0).toLocaleString()+" · חויב: ₪"+siteExtras.filter(e=>e.invoiced).reduce((s,e)=>s+(+e.amount||0),0).toLocaleString()}</div>
              {siteExtras.map(e=><div key={e.id} style={{padding:"10px 12px",borderRadius:8,background:e.invoiced?C.grnP:"#fff3cd",marginBottom:6,border:"1px solid "+(e.invoiced?C.grnL:C.org)}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontWeight:700,color:e.invoiced?C.grn:C.org}}>{"₪"+(+e.amount).toLocaleString()}</span>
                  <span style={{fontSize:13}}>{e.desc||"תוספת"}</span>
                </div>
                <div style={{fontSize:10,color:C.txtM,marginTop:2}}>{fmtFull(e.date)}</div>
                <div style={{display:"flex",gap:4,marginTop:6}}>
                  <button onClick={()=>togExtraInvoiced(e.id)} style={{flex:1,padding:5,borderRadius:6,border:"none",background:e.invoiced?C.cardA:C.org,color:e.invoiced?C.txt:"#fff",fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>{e.invoiced?"בטל חיוב":"סמן חויב ✓"}</button>
                  <button onClick={()=>delExtra(e.id)} style={{padding:"5px 8px",borderRadius:6,border:"1px solid "+C.red,background:"#fff",color:C.red,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"🗑"}</button>
                </div>
              </div>)}
            </div>}

            {/* Invoiced history */}
            {siteTasks.filter(t=>t.billable==="invoiced").length>0 && <div>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.grn}}>{"✓ חויבו ("+siteTasks.filter(t=>t.billable==="invoiced").length+")"}</div>
              {siteTasks.filter(t=>t.billable==="invoiced").map(t=><div key={t.id} style={{padding:"6px 10px",borderRadius:6,background:C.grnP,marginBottom:4,fontSize:11}}>
                <div style={{fontWeight:600}}>{t.notes}</div>
                <div style={{fontSize:9,color:C.txtM}}>{fmtFull(t.date)}</div>
              </div>)}
            </div>}
          </div>}

          {/* MEETINGS */}
          {siteDetailTab==="meetings" && <div>
            <button onClick={()=>{setForm({meetingSiteId:site.id,meetingDate:todayISO,meetingTime:"",meetingNotes:""});setModal("addMeeting");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.purp,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ פגישה חדשה"}</button>
            {siteMeetings.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין פגישות"}</div>}
            {siteMeetings.map(m=><div key={m.id} style={{padding:"10px 12px",borderRadius:8,background:m.done?C.grnP:C.purpB,marginBottom:6,border:"1px solid "+(m.done?C.grnL:C.purp)}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span onClick={()=>togMeeting(m.id)} style={{fontSize:20,cursor:"pointer"}}>{m.done?"✅":"⬜"}</span>
                <span style={{fontWeight:700,fontSize:13}}>{fmtFull(m.date)+(m.time?" · "+m.time:"")}</span>
              </div>
              {m.notes && <div style={{fontSize:12,color:C.txtM,padding:"4px 8px",background:"#fff",borderRadius:5}}>{m.notes}</div>}
            </div>)}
          </div>}
        </div>
      </div></div>;
    }

    // ─── BILLING LIST (all sites) ───
    if(modal==="billingList"){
      const items=[];
      Object.keys(data.dailyTasks||{}).forEach(d=>{(data.dailyTasks[d]||[]).forEach(t=>{if(t.billable==="ready")items.push({...t,date:d});});});
      const extras=(data.billingExtras||[]).filter(e=>!e.invoiced);
      // Group by site
      const grouped={};
      items.forEach(t=>{const k=t.siteId||"_none";if(!grouped[k])grouped[k]={tasks:[],extras:[]};grouped[k].tasks.push(t);});
      extras.forEach(e=>{const k=e.siteId||"_none";if(!grouped[k])grouped[k]={tasks:[],extras:[]};grouped[k].extras.push(e);});

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:520}}>
        <h3 style={{fontSize:18,color:C.org,marginBottom:14,textAlign:"center"}}>{"💰 מוכנות לחיוב"}</h3>
        {Object.keys(grouped).length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין משימות מוכנות"}</div>}
        {Object.entries(grouped).map(([sid,{tasks,extras}])=>{
          const siteName=sid==="_none"?"ללא לקוח":sn(sid);
          const total=tasks.length+extras.length;
          if(total===0)return null;
          return <div key={sid} style={{background:"#fff",borderRadius:10,padding:12,marginBottom:10,border:"2px solid "+C.org}}>
            <div style={{fontWeight:700,fontSize:15,marginBottom:8,color:C.org}}>{siteName+" ("+total+")"}</div>
            {tasks.map(t=><div key={t.id} style={{padding:"8px 10px",borderRadius:6,marginBottom:4,background:"#fff3cd",fontSize:12}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <span style={{fontSize:10,color:C.txtL}}>{fmtFull(t.date)}</span>
                <span style={{fontWeight:600}}>{t.notes}</span>
              </div>
              {t.billingExtras && <div style={{fontSize:10,color:C.txtM,marginTop:2}}>{"📌 "+t.billingExtras}</div>}
              <button onClick={()=>markInvoiced(t.date,t.id)} style={{marginTop:4,padding:"3px 8px",borderRadius:4,border:"none",background:C.org,color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"✓ חויב"}</button>
            </div>)}
            {extras.map(e=><div key={e.id} style={{padding:"8px 10px",borderRadius:6,marginBottom:4,background:"#fff3cd",fontSize:12}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <span style={{fontWeight:700,color:C.org}}>{"₪"+(+e.amount).toLocaleString()}</span>
                <span>{e.desc||"תוספת"}</span>
              </div>
              <button onClick={()=>togExtraInvoiced(e.id)} style={{marginTop:4,padding:"3px 8px",borderRadius:4,border:"none",background:C.org,color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"✓ חויב"}</button>
            </div>)}
          </div>;
        })}
      </div></div>;
    }

    // ─── MEETINGS LIST ───
    if(modal==="meetingsList"){
      const upcoming=(data.meetings||[]).filter(m=>!m.done).sort((a,b)=>a.date.localeCompare(b.date));
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:500}}>
        <h3 style={{fontSize:18,color:C.purp,marginBottom:14,textAlign:"center"}}>{"📅 פגישות קרובות"}</h3>
        {upcoming.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין פגישות"}</div>}
        {upcoming.map(m=><div key={m.id} style={{padding:"12px 14px",borderRadius:10,marginBottom:8,background:C.purpB,border:"1px solid "+C.purp}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span onClick={()=>togMeeting(m.id)} style={{fontSize:20,cursor:"pointer"}}>{"⬜"}</span>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:700,fontSize:14}}>{fmtFull(m.date)+(m.time?" · "+m.time:"")}</div>
              <div style={{fontSize:12,color:C.purp}}>{m.siteId?sn(m.siteId):"פגישה"}</div>
            </div>
          </div>
          {m.notes && <div style={{fontSize:12,color:C.txtM,padding:"6px 8px",background:"#fff",borderRadius:5,marginTop:4}}>{m.notes}</div>}
        </div>)}
      </div></div>;
    }

    // ─── ADD TASK ───
    if(modal==="addTask")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.grn,marginBottom:14}}>{"משימה חדשה"}</h3>
      <div style={{marginBottom:12}}><label style={lb}>{"תיאור"}</label><input value={form.notes||""} onChange={e=>setForm({...form,notes:e.target.value})} onKeyDown={e=>e.key==="Enter"&&saveTask()} placeholder={"מה צריך?"} style={inp} autoFocus/></div>
      <div style={{marginBottom:12}}><label style={lb}>{"תאריך"}</label><input type="date" value={form.taskDate||selISO} onChange={e=>setForm({...form,taskDate:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:12}}><label style={lb}>{"לקוח / אתר (אופציונלי)"}</label>
        <select value={form.siteId||""} onChange={e=>setForm({...form,siteId:e.target.value,type:allSites.find(s=>s.id===e.target.value)?.type||""})} style={inp}>
          <option value="">{"ללא"}</option>{allSites.map(s=><option key={s.id} value={s.id}>{(s.type==="m"?"🔧 ":"🌱 ")+s.name}</option>)}
        </select>
      </div>
      <div style={{marginBottom:14}}>
        <label style={lb}>{"תמונה (אופציונלי)"}</label>
        {form.image ? <div style={{position:"relative"}}>
          <img src={form.image} style={{width:"100%",borderRadius:10,maxHeight:200,objectFit:"cover"}} alt=""/>
          <button onClick={()=>setForm(p=>({...p,image:""}))} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.6)",color:"#fff",border:"none",borderRadius:"50%",width:26,height:26,cursor:"pointer",fontSize:14}}>×</button>
        </div> : <div style={{display:"flex",gap:6}}>
          <label style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px",borderRadius:10,border:"2px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:13,cursor:"pointer",fontWeight:600}}>
            <span style={{fontSize:18}}>📷</span>{"מצלמה"}
            <input type="file" accept="image/*" capture="environment" onChange={handleAnyImg(img=>setForm(p=>({...p,image:img})))} style={{display:"none"}}/>
          </label>
          <label style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px",borderRadius:10,border:"2px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:13,cursor:"pointer",fontWeight:600}}>
            <span style={{fontSize:18}}>🖼️</span>{"גלריה"}
            <input type="file" accept="image/*" onChange={handleAnyImg(img=>setForm(p=>({...p,image:img})))} style={{display:"none"}}/>
          </label>
        </div>}
      </div>
      <button onClick={saveTask} style={sb}>{"שמור"}</button>
    </div></div>;

    // ─── ADD REMINDER ───
    if(modal==="addReminder")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.grn,marginBottom:6,textAlign:"center"}}>{"📌 תזכורת"}</h3>
      <div style={{marginBottom:12}}><label style={lb}>{"מה?"}</label><input value={form.notes||""} onChange={e=>setForm({...form,notes:e.target.value})} placeholder={"לקנות סכין חדש..."} style={inp} autoFocus/></div>
      <div style={{marginBottom:14}}><label style={lb}>{"תאריך"}</label><input type="date" value={form.taskDate||todayISO} onChange={e=>setForm({...form,taskDate:e.target.value})} style={inp}/></div>
      <button onClick={saveTask} style={sb}>{"שמור"}</button>
    </div></div>;

    // ─── BILLING FORM ───
    if(modal==="billingForm")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:18,color:C.org,marginBottom:14,textAlign:"center"}}>{"💰 שלח לחיוב"}</h3>
      <div style={{marginBottom:14}}>
        <label style={lb}>{"תוספות / שינויים"}</label>
        <textarea value={form.extras||""} onChange={e=>setForm({...form,extras:e.target.value})} placeholder={"לדוגמה: הוספנו שתילים..."} style={{...inp,minHeight:100}}/>
      </div>
      <button onClick={()=>{markBillable(form.taskDay,form.taskId,form.extras||"");setModal(null);setForm({});}} style={{...sb,background:C.org}}>{"שלח לחיוב"}</button>
    </div></div>;

    // ─── QUICK PHOTO ───
    if(modal==="quickPhoto")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      {expStep===0 && <div>
        <div style={{fontSize:18,fontWeight:700,textAlign:"center",marginBottom:16,color:C.hdr}}>{"📷 הוסף תמונה"}</div>

        {/* Type selector */}
        <div style={{display:"flex",gap:6,marginBottom:14}}>
          <button onClick={()=>setForm(p=>({...p,photoType:""}))} style={{flex:1,padding:"10px",borderRadius:8,border:"2px solid "+(!form.photoType?C.hdr:C.bdr),background:!form.photoType?C.grnP:"#fff",color:!form.photoType?C.hdr:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"רגילה"}</button>
          <button onClick={()=>setForm(p=>({...p,photoType:"before"}))} style={{flex:1,padding:"10px",borderRadius:8,border:"2px solid "+(form.photoType==="before"?C.org:C.bdr),background:form.photoType==="before"?"#fff3cd":"#fff",color:form.photoType==="before"?C.org:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"לפני"}</button>
          <button onClick={()=>setForm(p=>({...p,photoType:"after"}))} style={{flex:1,padding:"10px",borderRadius:8,border:"2px solid "+(form.photoType==="after"?C.grn:C.bdr),background:form.photoType==="after"?C.grnP:"#fff",color:form.photoType==="after"?C.grn:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"אחרי"}</button>
        </div>

        {/* Camera or Gallery */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:"20px",borderRadius:14,border:"3px dashed "+C.hdr,background:C.grnP,color:C.hdr,fontSize:16,cursor:"pointer",fontWeight:700}}>
            <span style={{fontSize:36}}>📷</span>{"צלם עכשיו"}
            <input type="file" accept="image/*" capture="environment" onChange={e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setExpImg(ev.target.result);setExpStep(1);};r.readAsDataURL(f);}} style={{display:"none"}}/>
          </label>
          <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:"20px",borderRadius:14,border:"3px dashed "+C.blu,background:C.bluB,color:C.blu,fontSize:16,cursor:"pointer",fontWeight:700}}>
            <span style={{fontSize:36}}>🖼️</span>{"בחר מהגלריה"}
            <input type="file" accept="image/*" onChange={e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setExpImg(ev.target.result);setExpStep(1);};r.readAsDataURL(f);}} style={{display:"none"}}/>
          </label>
        </div>
      </div>}

      {expStep===1 && <div>
        <div style={{fontSize:16,fontWeight:700,textAlign:"center",marginBottom:10,color:C.hdr}}>{"לאיזה אתר לשייך?"}</div>
        {expImg && <img src={expImg} style={{width:"100%",borderRadius:10,marginBottom:12,maxHeight:160,objectFit:"cover"}} alt=""/>}
        <input value={form.photoNote||""} onChange={e=>setForm({...form,photoNote:e.target.value})} placeholder={"הערה (לא חובה)"} style={{...inp,marginBottom:10}}/>
        <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:"40vh",overflowY:"auto"}}>
          {form.siteId ? <button onClick={()=>{savePhoto(form.siteId,form.photoType,form.photoNote,expImg);setExpImg(null);setExpStep(0);setForm({});setModal(null);}} style={{width:"100%",padding:"14px",borderRadius:10,border:"2px solid "+C.grn,background:C.grnP,color:C.grn,fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"✓ שמור עבור "+sn(form.siteId)}</button> : <React.Fragment>
            {allSites.map(s=><button key={s.id} onClick={()=>{savePhoto(s.id,form.photoType,form.photoNote,expImg);setExpImg(null);setExpStep(0);setForm({});setModal(null);}} style={{width:"100%",padding:"12px",borderRadius:10,border:"1px solid "+C.bdr,background:C.wht,color:C.txt,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",textAlign:"right"}}>
              {(s.type==="m"?"🔧 ":"🌱 ")+s.name}
            </button>)}
            <button onClick={()=>{savePhoto("",form.photoType,form.photoNote,expImg);setExpImg(null);setExpStep(0);setForm({});setModal(null);}} style={{width:"100%",padding:"12px",borderRadius:10,border:"2px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"📁 כללי (ללא שיוך)"}</button>
          </React.Fragment>}
        </div>
      </div>}
    </div></div>;

    // ─── QUICK SUB ───
    if(modal==="quickSub"){
      const dates=form.subDates||[todayISO];
      const addDate=()=>setForm(p=>({...p,subDates:[...(p.subDates||[]),todayISO]}));
      const updateDate=(i,val)=>setForm(p=>{const arr=[...(p.subDates||[])];arr[i]=val;return {...p,subDates:arr};});
      const removeDate=(i)=>setForm(p=>{const arr=[...(p.subDates||[])];arr.splice(i,1);return {...p,subDates:arr.length?arr:[todayISO]};});
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:500}}>
        <h3 style={{fontSize:18,color:C.blu,marginBottom:4,textAlign:"center"}}>{"🔨 קבלן משנה"}</h3>
        <div style={{marginBottom:12}}><label style={lb}>{"שם"}</label><input value={form.subName||""} onChange={e=>setForm({...form,subName:e.target.value})} style={inp} autoFocus/></div>
        <div style={{marginBottom:12}}><label style={lb}>{"אתר"}</label>
          <select value={form.subSiteId||""} onChange={e=>setForm({...form,subSiteId:e.target.value})} style={inp}>
            <option value="">{"בחר..."}</option>
            <optgroup label="פרויקטים">{(data.devSites||[]).map(s=><option key={s.id} value={s.id}>{"🌱 "+s.name}</option>)}</optgroup>
            <optgroup label="תחזוקות">{(data.maintenanceSites||[]).map(s=><option key={s.id} value={s.id}>{"🔧 "+s.name}</option>)}</optgroup>
            <option value="__new__">{"➕ פרויקט חדש"}</option>
          </select>
        </div>
        {form.subSiteId==="__new__" && <div style={{marginBottom:12}}><input value={form.subNewSite||""} onChange={e=>setForm({...form,subNewSite:e.target.value})} placeholder={"שם פרויקט"} style={inp}/></div>}
        <div style={{marginBottom:14}}><label style={lb}>{"ימי עבודה"}</label>
          {dates.map((d,i)=><div key={i} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
            <input type="date" value={d} onChange={e=>updateDate(i,e.target.value)} style={{...inp,flex:1}}/>
            {dates.length>1 && <button onClick={()=>removeDate(i)} style={{background:"none",border:"none",color:C.red,fontSize:18,cursor:"pointer",padding:4}}>{"✕"}</button>}
          </div>)}
          <button onClick={addDate} style={{padding:"6px 12px",borderRadius:8,border:"1px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"+ יום נוסף"}</button>
        </div>
        <button onClick={quickAddSub} style={{...sb,background:C.blu}}>{"שבץ"}</button>
      </div></div>;
    }

    // ─── COMPLETE SUB ───
    if(modal==="completeSub"){
      const sub=(data.subContracts||[]).find(s=>s.id===form.subId);
      if(!sub)return null;
      const adjustCount=(n)=>setForm(p=>({...p,subWorkerCount:Math.max(1,(p.subWorkerCount||1)+n)}));
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:500}}>
        <h3 style={{fontSize:18,color:C.blu,marginBottom:14,textAlign:"center"}}>{"✓ פרטי ביצוע"}</h3>
        <div style={{marginBottom:12}}>
          <label style={lb}>{"כמה עובדים"}</label>
          <div style={{display:"flex",alignItems:"center",gap:10,justifyContent:"center"}}>
            <button onClick={()=>adjustCount(-1)} style={{width:36,height:36,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:18,cursor:"pointer",fontWeight:700}}>−</button>
            <span style={{fontSize:22,fontWeight:700,minWidth:40,textAlign:"center"}}>{form.subWorkerCount||1}</span>
            <button onClick={()=>adjustCount(1)} style={{width:36,height:36,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:18,cursor:"pointer",fontWeight:700}}>+</button>
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={lb}>{"שעות"}</label>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input type="time" value={form.subFrom||"07:00"} onChange={e=>setForm({...form,subFrom:e.target.value})} style={{...inp,flex:1}}/>
            <span>{"עד"}</span>
            <input type="time" value={form.subTo||"16:00"} onChange={e=>setForm({...form,subTo:e.target.value})} style={{...inp,flex:1}}/>
          </div>
        </div>
        <div style={{marginBottom:14}}><label style={lb}>{"הערות"}</label><textarea value={form.subNotes||""} onChange={e=>setForm({...form,subNotes:e.target.value})} style={{...inp,minHeight:60}}/></div>
        <button onClick={completeSub} style={{...sb,background:C.grn}}>{"✓ שמור"}</button>
      </div></div>;
    }

    // ─── CONFIRM DELETE SUB ───
    if(modal==="confirmDelSub"){
      const sub=(data.subContracts||[]).find(s=>s.id===form.subId);
      if(!sub)return null;
      const dateKey=form.subDate||todayISO;
      const multipleDates=(sub.dates||[]).length>1;
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
        <h3 style={{fontSize:17,color:C.red,textAlign:"center",marginBottom:14}}>{"🗑 מחק "+sub.name+"?"}</h3>
        {multipleDates ? <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button onClick={()=>{removeSubFromDay(form.subId,dateKey);setModal(null);setForm({});}} style={{padding:"14px",borderRadius:10,border:"2px solid "+C.org,background:"#fff",color:C.org,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"רק היום הזה"}</button>
          <button onClick={()=>{delSub(form.subId);setModal(null);setForm({});}} style={{padding:"14px",borderRadius:10,border:"2px solid "+C.red,background:C.red,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"מחק הכל"}</button>
          <button onClick={close} style={{padding:"10px",borderRadius:10,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{"ביטול"}</button>
        </div> : <div style={{display:"flex",gap:8}}>
          <button onClick={close} style={{flex:1,padding:"12px",borderRadius:10,border:"1px solid "+C.bdr,background:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"ביטול"}</button>
          <button onClick={()=>{delSub(form.subId);setModal(null);setForm({});}} style={{flex:1,padding:"12px",borderRadius:10,border:"none",background:C.red,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"מחק"}</button>
        </div>}
      </div></div>;
    }

    // ─── ADD SITE QUICK ───
    if(modal==="addSiteQuick")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.grn,marginBottom:14}}>{"הוסף אתר / פרויקט"}</h3>
      <div style={{marginBottom:10}}><input value={form.newSiteName||""} onChange={e=>setForm({...form,newSiteName:e.target.value})} placeholder={"שם"} style={inp}/></div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>{if(!(form.newSiteName||"").trim())return;up(d=>{d.devSites=[...(d.devSites||[]),{id:uid(),name:form.newSiteName.trim(),deadline:"",status:"active"}];});setForm({});setModal(null);}} style={{flex:1,...sb,background:C.blu}}>{"🌱 פרויקט"}</button>
        <button onClick={()=>{if(!(form.newSiteName||"").trim())return;up(d=>{d.maintenanceSites=[...(d.maintenanceSites||[]),{id:uid(),name:form.newSiteName.trim(),frequency:"כל שבוע"}];});setForm({});setModal(null);}} style={{flex:1,...sb,background:C.org}}>{"🔧 תחזוקה"}</button>
      </div>
    </div></div>;

    // ─── RESET ───
    if(modal==="reset")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.red,textAlign:"center",marginBottom:10}}>{"⚠️ למחוק הכל?"}</h3>
      <div style={{display:"flex",gap:8}}>
        <button onClick={async()=>{await save({...INIT});setData({...INIT});setModal(null);}} style={{flex:1,padding:14,borderRadius:10,border:"none",background:C.red,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"כן"}</button>
        <button onClick={close} style={{flex:1,padding:14,borderRadius:10,border:"1px solid "+C.bdr,background:C.wht,fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"לא"}</button>
      </div>
    </div></div>;

    return null;
  };

  // ZOOM IMAGE OVERLAY
  const zoomOverlay = zoomImg && <div onClick={()=>setZoomImg(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2000,padding:20}}>
    <button onClick={()=>setZoomImg(null)} style={{position:"absolute",top:20,right:20,background:"rgba(255,255,255,0.2)",color:"#fff",border:"none",width:40,height:40,borderRadius:"50%",fontSize:20,cursor:"pointer",fontFamily:"inherit"}}>{"×"}</button>
    <img src={typeof zoomImg==="string"?zoomImg:zoomImg.image} style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain"}} alt=""/>
    {typeof zoomImg!=="string" && <div style={{position:"absolute",bottom:20,left:20,right:20,padding:"10px 14px",background:"rgba(0,0,0,0.7)",color:"#fff",borderRadius:10,fontSize:13}}>
      {zoomImg.siteId && <div style={{fontWeight:700,marginBottom:4}}>{sn(zoomImg.siteId)}</div>}
      {zoomImg.photoType && <span style={{padding:"2px 8px",borderRadius:6,fontSize:11,background:zoomImg.photoType==="before"?"#fff3cd":"#d8f3dc",color:zoomImg.photoType==="before"?C.org:C.grn,marginLeft:8}}>{zoomImg.photoType==="before"?"לפני":"אחרי"}</span>}
      {zoomImg.note && <div style={{fontSize:12,marginTop:4,opacity:0.9}}>{zoomImg.note}</div>}
      {zoomImg.date && <div style={{fontSize:11,opacity:0.7,marginTop:4}}>{fmtFull(zoomImg.date)}</div>}
    </div>}
  </div>;

  return(<div style={{minHeight:"100vh",background:C.bg,fontFamily:"'Rubik',sans-serif",direction:"rtl",color:C.txt,maxWidth:480,margin:"0 auto",boxShadow:"0 0 40px rgba(0,0,0,0.08)"}}>
    {header}
    <div style={{paddingBottom:20}}>
      {cv==="monthly"&&monthlyView}
      {cv==="weekly"&&weeklyView}
      {cv==="daily"&&dailyView}
      {cv==="gallery"&&galleryView}
      {cv==="projects"&&projectsView}
      {cv==="settings"&&settingsView}
    </div>
    {renderModal()}
    {zoomOverlay}
  </div>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>

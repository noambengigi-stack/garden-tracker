                  <input type="number" value={it.amount||""} onChange={e=>updateCartItem(i,"amount",e.target.value)} placeholder={"₪/יח'"} style={{...inp,fontSize:12,padding:"7px 10px",flex:1,textAlign:"center"}}/>
                </div>
                {(+it.amount>0 && +it.qty>1) && <div style={{fontSize:10,color:C.txtM,marginTop:4,textAlign:"left"}}>{"סה״כ: ₪"+((+it.amount)*(+it.qty)).toLocaleString()}</div>}
              </div>;
            })}

            {total>0 && <div style={{background:C.grnP,borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:15,fontWeight:700,color:C.grn,display:"flex",justifyContent:"space-between"}}>
              <span>{"₪"+total.toLocaleString()}</span>
              <span>{"💰 סה״כ ההזמנה:"}</span>
            </div>}

            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setStep(1)} style={{flex:1,padding:14,borderRadius:12,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"← חזור לפריטים"}</button>
              <button onClick={saveBulkOrderEnhanced} style={{flex:2,padding:14,borderRadius:12,border:"none",background:C.org,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"💾 שמור הזמנה"}</button>
            </div>
            {(()=>{const invalid=items.filter(it=>{const t=it.assignType||"project";if(t==="project"||t==="maintenance")return !it.projectId;if(t==="free")return !(it.freeText||"").trim();return false;}).length;return invalid>0?<div style={{fontSize:11,color:C.red,textAlign:"center",marginTop:6}}>{"⚠️ "+invalid+" פריטים חסרים שיוך"}</div>:null;})()}
          </div>}
        </div>
      </div></div>;
    }

    // ─── PICK FROM INVENTORY (legacy - now unused but kept for compatibility) ───
    if(modal==="pickInventory"){setModal("addBulkOrder");return null;}

    // ─── ALL ORDERS (centralized view) ───
    // ─── WAREHOUSE INVENTORY ───
    // ─── MORE ACTIONS MENU ───
    if(modal==="moreActions"){
      const pendingOrders=(()=>{const all=[];Object.values(data.projectOrders||{}).forEach(arr=>arr.forEach(o=>{if(o.status!=="received")all.push(o);}));return all.length;})();
      const lowStock=(data.inventory||[]).filter(it=>{
        if(!["connectors","pipes","sprinklers","headsys","spray","consumables"].includes(it.category))return false;
        const w=(data.warehouse||{})[it.id]||{};
        return (w.threshold||0)>0 && (w.qty||0)<=(w.threshold||0);
      }).length;

      const actions=[
        {icon:"📦",label:"הזמנות",sub:pendingOrders>0?pendingOrders+" פתוחות":"ניהול הזמנות",color:C.org,onClick:()=>{setOrdersFilter("all");setOrdersSearch("");setModal("allOrders");}},
        {icon:"📦",label:"מלאי מחסן",sub:lowStock>0?"⚠️ "+lowStock+" חסרים":"מעקב ציוד",color:C.hdr,onClick:()=>{setWhSearch("");setForm({});setModal("warehouse");}},
        {icon:"👷",label:"קבלן משנה",sub:"שיבוץ קבלן ליום",color:C.blu,onClick:()=>{setForm({subName:"",subSiteId:"",subNewSite:"",subWorkerCount:1,subFrom:dStart(),subTo:dEnd(),subDates:[todayISO],subNotes:""});setModal("quickSub");}},
        {icon:"🗺️",label:"מפת מקטעים",sub:"תצלומי אוויר וחלוקה למקטעים",color:C.grn,onClick:()=>{setModal(null);setMapSite(null);setView("map");}}
      ];

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:420,padding:18}}>
        <h3 style={{textAlign:"right",marginBottom:14,fontSize:17}}>{"⚙️ עוד פעולות"}</h3>
        {actions.map((a,i)=><button key={i} onClick={a.onClick} style={{width:"100%",padding:"14px 16px",marginBottom:8,borderRadius:12,border:"1.5px solid "+a.color,background:"#fff",cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:20}}>{"›"}</span>
          <div style={{textAlign:"right",flex:1,marginInlineStart:10}}>
            <div style={{fontSize:15,fontWeight:700,color:a.color}}>{a.icon+" "+a.label}</div>
            <div style={{fontSize:11,color:C.txtM,marginTop:2}}>{a.sub}</div>
          </div>
        </button>)}
        <button onClick={close} style={{...sb,background:C.cardA,color:C.txt,marginTop:6}}>{"סגור"}</button>
      </div></div>;
    }

    if(modal==="warehouse"){
      const whTab=form.whTab||"stock";
      // Only equipment categories (not plants)
      const equipItems=(data.inventory||[]).filter(it=>["connectors","pipes","sprinklers","headsys","spray","consumables"].includes(it.category));
      const catNames={connectors:"🔌 מחברים",pipes:"🚰 צינורות",sprinklers:"💦 ממטירים וטפטפות",headsys:"⚙️ ראשי מערכת",spray:"🧪 חומרי ריסוס",consumables:"🛠 חומרים וכלים"};
      const whCatOrder=["connectors","pipes","sprinklers","headsys","spray","consumables"];
      const wh=data.warehouse||{};
      const getQty=(id)=>(wh[id]||{}).qty||0;
      const getThr=(id)=>(wh[id]||{}).threshold||0;

      // ── TAKE EQUIPMENT VIEW ──
      if(whTab==="take"){
        const cart=form.whCart||{};
        const targetSite=form.whTargetSite||"";
        const allSites=[...(data.maintenanceSites||[]).map(s=>({...s,_m:true})),...(data.devSites||[]).filter(s=>s.status!=="done").map(s=>({...s,_m:false}))];

        let filtered=equipItems;
        if(whSearch.trim()){
          const q=whSearch.trim().toLowerCase();
          filtered=filtered.filter(it=>it.name.toLowerCase().includes(q)||(((wh[it.id]||{}).note||"").toLowerCase().includes(q)));
        }
        const cartCount=Object.values(cart).reduce((s,n)=>s+n,0);

        const doTake=()=>{
          const items=Object.entries(cart).filter(([_,n])=>n>0);
          if(items.length===0)return;
          up(d=>{
            if(!d.warehouse)d.warehouse={};
            if(!d.stockMovements)d.stockMovements=[];
            items.forEach(([itemId,qty])=>{
              const cur=(d.warehouse[itemId]||{}).qty||0;
              d.warehouse[itemId]={...(d.warehouse[itemId]||{}),qty:Math.max(0,cur-qty)};
            });
            const movId=uid();
            d.stockMovements.push({
              id:movId,
              type:"take",
              date:todayISO,
              siteId:targetSite||"",
              items:items.map(([itemId,qty])=>({itemId,qty,name:(equipItems.find(x=>x.id===itemId)||{}).name||""}))
            });
            // If assigned to a site - add billing entries (one per item)
            if(targetSite){
              if(!d.billingExtras)d.billingExtras=[];
              items.forEach(([itemId,qty])=>{
                const nm=(equipItems.find(x=>x.id===itemId)||{}).name||"";
                d.billingExtras.push({
                  id:uid(),
                  siteId:targetSite,
                  date:todayISO,
                  amount:0,
                  qty:qty,
                  desc:nm,
                  invoiced:false,
                  fromWarehouse:true,
                  movId:movId
                });
              });
            }
          });
          setTimeout(()=>forceSave(),100);
          setForm({whTab:"stock"});
        };

        return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"95vh"}}>
          <div style={{background:C.hdr,color:"#fff",padding:"12px 16px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <button onClick={()=>setForm({whTab:"stock"})} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:17,fontWeight:700}}>{"🛒 לקיחת ציוד"}</div>
                <div style={{fontSize:11,opacity:0.85}}>{cartCount>0?cartCount+" פריטים נבחרו":"בחר מה לקחת"}</div>
              </div>
            </div>
            {/* Site selector */}
            <select value={targetSite} onChange={e=>setForm({...form,whTargetSite:e.target.value})} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"none",fontSize:13,fontFamily:"inherit",direction:"rtl",marginBottom:8}}>
              <option value="">{"-- לאיזה אתר? (אופציונלי) --"}</option>
              {allSites.map(s=><option key={s.id} value={s.id}>{(s._m?"🔧 ":"🌱 ")+s.name}</option>)}
            </select>
            <input value={whSearch} onChange={e=>setWhSearch(e.target.value)} placeholder={"🔍 חפש פריט..."} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"none",fontSize:13,fontFamily:"inherit",direction:"rtl",outline:"none",boxSizing:"border-box"}}/>
          </div>

          <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(95vh - 200px)"}}>
            {whCatOrder.map(cat=>{
              const items=filtered.filter(it=>it.category===cat);
              if(items.length===0)return null;
              return <div key={cat} style={{marginBottom:14}}>
                <div style={{fontSize:13,fontWeight:700,color:C.hdr,marginBottom:6,textAlign:"right"}}>{catNames[cat]}</div>
                {items.map(it=>{
                  const inStock=getQty(it.id);
                  const taking=cart[it.id]||0;
                  return <div key={it.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 10px",background:taking>0?C.grnP:C.cardA,borderRadius:8,marginBottom:4,border:"1px solid "+(taking>0?C.grn:C.bdr)}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <button onClick={()=>{const n=Math.max(0,taking-1);setForm({...form,whCart:{...cart,[it.id]:n}});}} style={{width:28,height:28,borderRadius:"50%",border:"1px solid "+C.bdr,background:"#fff",color:C.txt,fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"−"}</button>
                      <input type="number" value={taking||""} onChange={e=>{const n=Math.max(0,+e.target.value||0);setForm({...form,whCart:{...cart,[it.id]:n}});}} placeholder="0" style={{width:48,padding:"5px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:15,fontWeight:700,textAlign:"center",fontFamily:"inherit",color:taking>0?C.grn:C.txtL}}/>
                      <button onClick={()=>{setForm({...form,whCart:{...cart,[it.id]:taking+1}});}} style={{width:28,height:28,borderRadius:"50%",border:"1px solid "+C.grn,background:C.grn,color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"+"}</button>
                    </div>
                    <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                      <div style={{fontSize:13,fontWeight:600}}>{it.name}</div>
                      {(wh[it.id]||{}).note && <div style={{fontSize:10,color:C.org,fontWeight:600}}>{"📝 "+(wh[it.id]||{}).note}</div>}
                      <div style={{fontSize:10,color:inStock>0?C.txtM:C.red}}>{"במלאי: "+inStock}</div>
                    </div>
                  </div>;
                })}
              </div>;
            })}
          </div>

          <div style={{padding:"10px 16px",borderTop:"1px solid "+C.bdr,background:"#fff",position:"sticky",bottom:0}}>
            <button onClick={doTake} disabled={cartCount===0} style={{width:"100%",padding:13,borderRadius:10,border:"none",background:cartCount>0?C.grn:C.bdr,color:"#fff",fontSize:14,fontWeight:700,cursor:cartCount>0?"pointer":"not-allowed",fontFamily:"inherit",opacity:cartCount>0?1:0.5}}>{cartCount>0?"✓ אשר לקיחה ("+cartCount+" פריטים)":"בחר פריטים"}</button>
          </div>
        </div></div>;
      }

      // ── RECEIVE STOCK VIEW ──
      if(whTab==="receive"){
        const cart=form.whCart||{};
        let filtered=equipItems;
        if(whSearch.trim()){
          const q=whSearch.trim().toLowerCase();
          filtered=filtered.filter(it=>it.name.toLowerCase().includes(q)||(((wh[it.id]||{}).note||"").toLowerCase().includes(q)));
        }
        const cartCount=Object.values(cart).reduce((s,n)=>s+n,0);

        const doReceive=()=>{
          const items=Object.entries(cart).filter(([_,n])=>n>0);
          if(items.length===0)return;
          up(d=>{
            if(!d.warehouse)d.warehouse={};
            if(!d.stockMovements)d.stockMovements=[];
            items.forEach(([itemId,qty])=>{
              const cur=(d.warehouse[itemId]||{}).qty||0;
              d.warehouse[itemId]={...(d.warehouse[itemId]||{}),qty:cur+qty};
            });
            d.stockMovements.push({
              id:uid(),
              type:"receive",
              date:todayISO,
              items:items.map(([itemId,qty])=>({itemId,qty,name:(equipItems.find(x=>x.id===itemId)||{}).name||""}))
            });
          });
          setTimeout(()=>forceSave(),100);
          setForm({whTab:"stock"});
        };

        return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"95vh"}}>
          <div style={{background:C.grn,color:"#fff",padding:"12px 16px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <button onClick={()=>setForm({whTab:"stock"})} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:17,fontWeight:700}}>{"📥 קבלת סחורה"}</div>
                <div style={{fontSize:11,opacity:0.85}}>{cartCount>0?cartCount+" פריטים":"כמה הגיע למחסן?"}</div>
              </div>
            </div>
            <input value={whSearch} onChange={e=>setWhSearch(e.target.value)} placeholder={"🔍 חפש פריט..."} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"none",fontSize:13,fontFamily:"inherit",direction:"rtl",outline:"none",boxSizing:"border-box"}}/>
          </div>

          <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(95vh - 170px)"}}>
            {whCatOrder.map(cat=>{
              const items=filtered.filter(it=>it.category===cat);
              if(items.length===0)return null;
              return <div key={cat} style={{marginBottom:14}}>
                <div style={{fontSize:13,fontWeight:700,color:C.grn,marginBottom:6,textAlign:"right"}}>{catNames[cat]}</div>
                {items.map(it=>{
                  const inStock=getQty(it.id);
                  const adding=cart[it.id]||0;
                  return <div key={it.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 10px",background:adding>0?C.grnP:C.cardA,borderRadius:8,marginBottom:4,border:"1px solid "+(adding>0?C.grn:C.bdr)}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <button onClick={()=>{const n=Math.max(0,adding-1);setForm({...form,whCart:{...cart,[it.id]:n}});}} style={{width:28,height:28,borderRadius:"50%",border:"1px solid "+C.bdr,background:"#fff",color:C.txt,fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"−"}</button>
                      <input type="number" value={adding||""} onChange={e=>{const n=Math.max(0,+e.target.value||0);setForm({...form,whCart:{...cart,[it.id]:n}});}} placeholder="0" style={{width:48,padding:"5px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:15,fontWeight:700,textAlign:"center",fontFamily:"inherit",color:adding>0?C.grn:C.txtL}}/>
                      <button onClick={()=>{setForm({...form,whCart:{...cart,[it.id]:adding+1}});}} style={{width:28,height:28,borderRadius:"50%",border:"1px solid "+C.grn,background:C.grn,color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"+"}</button>
                    </div>
                    <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                      <div style={{fontSize:13,fontWeight:600}}>{it.name}</div>
                      {(wh[it.id]||{}).note && <div style={{fontSize:10,color:C.org,fontWeight:600}}>{"📝 "+(wh[it.id]||{}).note}</div>}
                      <div style={{fontSize:10,color:C.txtM}}>{"במלאי: "+inStock+(adding>0?" → "+(inStock+adding):"")}</div>
                    </div>
                  </div>;
                })}
              </div>;
            })}
          </div>

          <div style={{padding:"10px 16px",borderTop:"1px solid "+C.bdr,background:"#fff",position:"sticky",bottom:0}}>
            <button onClick={doReceive} disabled={cartCount===0} style={{width:"100%",padding:13,borderRadius:10,border:"none",background:cartCount>0?C.grn:C.bdr,color:"#fff",fontSize:14,fontWeight:700,cursor:cartCount>0?"pointer":"not-allowed",fontFamily:"inherit",opacity:cartCount>0?1:0.5}}>{cartCount>0?"✓ הוסף למלאי":"בחר פריטים"}</button>
          </div>
        </div></div>;
      }

      // ── RESTOCK LIST VIEW ──
      if(whTab==="restock"){
        // Items below 2x threshold - need restock
        const needRestock=equipItems.filter(it=>{const t=getThr(it.id);return t>0 && getQty(it.id)<t*2;});
        // Group by category, then subgroup
        const byCat={};
        needRestock.forEach(it=>{
          const c=it.category;
          const sg=it.subgroup||"כללי";
          if(!byCat[c])byCat[c]={};
          if(!byCat[c][sg])byCat[c][sg]=[];
          const qty=getQty(it.id);
          const thr=getThr(it.id);
          const orderQty=Math.max(1,(thr*2)-qty);
          byCat[c][sg].push({...it,qty,thr,orderQty});
        });

        // Build plain text for copy/share
        const buildText=()=>{
          let txt="רשימת הזמנה - "+new Date().toLocaleDateString("he-IL")+"\n\n";
          whCatOrder.forEach(c=>{
            if(!byCat[c])return;
            txt+="── "+(catNames[c]||c)+" ──\n";
            Object.keys(byCat[c]).forEach(sg=>{
              byCat[c][sg].forEach(it=>{
                txt+="• "+it.name+" — "+it.orderQty+" יח׳ (יש: "+it.qty+", רף: "+it.thr+")\n";
              });
            });
            txt+="\n";
          });
          const totalItems=needRestock.length;
          const totalUnits=needRestock.reduce((s,it)=>{const q=getQty(it.id);const t=getThr(it.id);return s+Math.max(1,(t*2)-q);},0);
          txt+="סה״כ: "+totalItems+" פריטים שונים, "+totalUnits+" יחידות";
          return txt;
        };

        const copyText=()=>{
          const txt=buildText();
          try{
            navigator.clipboard.writeText(txt);
            alert("✓ הרשימה הועתקה - אפשר להדביק לוואטסאפ / אימייל");
          }catch(e){
            alert("לא הצלחתי להעתיק - תוכל לצלם את המסך");
          }
        };

        const totalUnits=needRestock.reduce((s,it)=>{const q=getQty(it.id);const t=getThr(it.id);return s+Math.max(1,(t*2)-q);},0);

        return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} className="print-area" style={{...bx,maxWidth:680,width:"100%",padding:0,maxHeight:"95vh",overflow:"auto"}}>
          <div className="no-print" style={{background:C.red,color:"#fff",padding:"12px 16px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <button onClick={()=>setForm({whTab:"stock"})} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:17,fontWeight:700}}>{"📋 רשימת הזמנה"}</div>
                <div style={{fontSize:11,opacity:0.85}}>{needRestock.length+" פריטים · "+totalUnits+" יח׳ בסה״כ"}</div>
              </div>
              <div style={{width:28}}></div>
            </div>
            <div style={{display:"flex",gap:6,marginTop:8}}>
              <button onClick={copyText} style={{flex:1,padding:"8px",borderRadius:8,border:"none",background:"#fff",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"📋 העתק רשימה"}</button>
              <button onClick={()=>window.print()} style={{flex:1,padding:"8px",borderRadius:8,border:"none",background:"#fff",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"🖨️ הדפס"}</button>
            </div>
          </div>

          <div style={{padding:"16px 20px"}}>
            <div className="print-only" style={{textAlign:"center",marginBottom:14,borderBottom:"2px solid #000",paddingBottom:8}}>
              <div style={{fontSize:20,fontWeight:700}}>{"📋 רשימת הזמנה"}</div>
              <div style={{fontSize:13,marginTop:3}}>{new Date().toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"})+" · "+needRestock.length+" פריטים, "+totalUnits+" יחידות"}</div>
            </div>

            {needRestock.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:40}}>
              <div style={{fontSize:40,marginBottom:8}}>{"✓"}</div>
              <div style={{fontSize:14}}>{"כל הפריטים במלאי תקין"}</div>
              <div style={{fontSize:11,color:C.txtL,marginTop:4}}>{"אין צורך בהזמנה כרגע"}</div>
            </div>}

            {whCatOrder.map(cat=>{
              if(!byCat[cat])return null;
              const catItems=Object.values(byCat[cat]).flat();
              const catTotal=catItems.reduce((s,it)=>s+it.orderQty,0);
              return <div key={cat} style={{marginBottom:16,pageBreakInside:"avoid"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:C.hdr,color:"#fff",borderRadius:"8px 8px 0 0"}}>
                  <span style={{fontSize:12,fontWeight:700}}>{catItems.length+" פריטים · "+catTotal+" יח׳"}</span>
                  <span style={{fontSize:14,fontWeight:700}}>{catNames[cat]}</span>
                </div>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,border:"1px solid "+C.bdr}}>
                  <thead>
                    <tr style={{background:C.cardA}}>
                      <th style={{padding:"6px",textAlign:"center",fontWeight:700,width:30,border:"1px solid "+C.bdr}}>{"✓"}</th>
                      <th style={{padding:"6px",textAlign:"right",fontWeight:700,border:"1px solid "+C.bdr}}>{"פריט"}</th>
                      <th style={{padding:"6px",textAlign:"center",fontWeight:700,width:60,border:"1px solid "+C.bdr}}>{"במלאי"}</th>
                      <th style={{padding:"6px",textAlign:"center",fontWeight:700,width:50,border:"1px solid "+C.bdr}}>{"רף"}</th>
                      <th style={{padding:"6px",textAlign:"center",fontWeight:700,width:80,border:"1px solid "+C.bdr,background:"#fee"}}>{"להזמין"}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {Object.keys(byCat[cat]).map(sg=><React.Fragment key={sg}>
                      {Object.keys(byCat[cat]).length>1 && <tr><td colSpan={5} style={{padding:"4px 8px",background:"#f5f0e6",fontWeight:700,fontSize:11,textAlign:"right",border:"1px solid "+C.bdr,color:C.txtM}}>{sg}</td></tr>}
                      {byCat[cat][sg].map(it=><tr key={it.id}>
                        <td style={{padding:"5px",textAlign:"center",border:"1px solid "+C.bdr}}>{"☐"}</td>
                        <td style={{padding:"5px",textAlign:"right",border:"1px solid "+C.bdr,fontWeight:600}}>{it.name}{(wh[it.id]||{}).note?" ("+wh[it.id].note+")":""}</td>
                        <td style={{padding:"5px",textAlign:"center",border:"1px solid "+C.bdr,color:it.qty===0?C.red:C.org,fontWeight:700}}>{it.qty}</td>
                        <td style={{padding:"5px",textAlign:"center",border:"1px solid "+C.bdr,color:C.txtM}}>{it.thr}</td>
                        <td style={{padding:"5px",textAlign:"center",border:"1px solid "+C.bdr,background:"#fff7ed",color:C.red,fontWeight:700,fontSize:14}}>{it.orderQty}</td>
                      </tr>)}
                    </React.Fragment>)}
                  </tbody>
                </table>
              </div>;
            })}

            {needRestock.length>0 && <div style={{background:C.cardA,borderRadius:10,padding:12,marginTop:14,fontSize:11,color:C.txtM,textAlign:"right",lineHeight:1.6}}>
              <div style={{fontWeight:700,marginBottom:4,color:C.txt}}>{"💡 איך זה חושב?"}</div>
              {"כל פריט שהמלאי שלו נמוך מ-2× הרף - מופיע ברשימה. הכמות להזמנה היא ההפרש כדי להגיע ל-2× הרף, כלומר אחרי ההזמנה יהיה לך רף + רזרבה."}
            </div>}
          </div>
        </div></div>;
      }

      // ── HISTORY VIEW ──
      if(whTab==="history"){
        const movements=[...(data.stockMovements||[])].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
        return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"95vh"}}>
          <div style={{background:C.hdr,color:"#fff",padding:"12px 16px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <button onClick={()=>setForm({whTab:"stock"})} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:17,fontWeight:700}}>{"📜 היסטוריית תנועות"}</div>
                <div style={{fontSize:11,opacity:0.85}}>{movements.length+" תנועות"}</div>
              </div>
            </div>
          </div>
          <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(95vh - 70px)"}}>
            {movements.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:30,fontSize:13}}>{"אין תנועות עדיין"}</div>}
            {movements.map(m=>{
              const isTake=m.type==="take";
              return <div key={m.id} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+(isTake?C.org:C.grn)}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{fontSize:10,color:C.txtL}}>{fmtFull(new Date(m.date))}</span>
                  <span style={{fontSize:12,fontWeight:700,color:isTake?C.org:C.grn}}>{isTake?"🛒 לקיחה":"📥 קבלה"}{m.siteId?" · "+sn(m.siteId):""}</span>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {(m.items||[]).map((it,i)=><span key={i} style={{fontSize:11,padding:"3px 8px",background:C.cardA,borderRadius:8,color:C.txt}}>{it.name+" ×"+it.qty}</span>)}
                </div>
              </div>;
            })}
          </div>
        </div></div>;
      }

      // ── ADD NEW ITEM VIEW ──
      if(whTab==="addItem"){
        const newName=form.newItemName||"";
        const newCat=form.newItemCat||"consumables";
        const addableCats=[
          {id:"connectors",label:"🔌 מחברים"},
          {id:"pipes",label:"🚰 צינורות"},
          {id:"sprinklers",label:"💦 ממטירים וטפטפות"},
          {id:"spray",label:"🧪 חומרי ריסוס"},
          {id:"consumables",label:"🛠 חומרים וכלים"}
        ];
        const doAddItem=()=>{
          if(!newName.trim())return;
          const nm=newName.trim();
          const sg=guessSubgroup(nm,newCat);
          up(d=>{
            if(!d.inventory)d.inventory=[];
            d.inventory.push({id:uid(),name:nm,category:newCat,subgroup:sg,userAdded:true});
          });
          setForm({whTab:"stock"});
        };
        return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:440,width:"100%",padding:0,maxHeight:"92vh"}}>
          <div style={{background:C.grn,color:"#fff",padding:"12px 16px",borderRadius:"16px 16px 0 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <button onClick={()=>setForm({whTab:"stock"})} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
              <div style={{fontSize:17,fontWeight:700}}>{"➕ הוסף פריט חדש"}</div>
            </div>
          </div>
          <div style={{padding:"16px"}}>
            <label style={{fontSize:12,color:C.txtM,display:"block",marginBottom:6,textAlign:"right"}}>{"שם הפריט:"}</label>
            <input value={newName} onChange={e=>setForm({...form,newItemName:e.target.value})} placeholder={"לדוגמה: ברז כדורי 1 צול"} autoFocus style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid "+C.bdr,fontSize:14,fontFamily:"inherit",direction:"rtl",boxSizing:"border-box",marginBottom:14}}/>

            <label style={{fontSize:12,color:C.txtM,display:"block",marginBottom:6,textAlign:"right"}}>{"קטגוריה:"}</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:18}}>
              {addableCats.map(c=>{const sel=newCat===c.id;return <button key={c.id} onClick={()=>setForm({...form,newItemCat:c.id})} style={{padding:"8px 12px",borderRadius:14,border:"1.5px solid "+(sel?C.grn:C.bdr),background:sel?C.grn:"#fff",color:sel?"#fff":C.txt,fontSize:12,fontWeight:sel?700:500,cursor:"pointer",fontFamily:"inherit"}}>{c.label}</button>;})}
            </div>

            <button onClick={doAddItem} disabled={!newName.trim()} style={{width:"100%",padding:13,borderRadius:10,border:"none",background:newName.trim()?C.grn:C.bdr,color:"#fff",fontSize:14,fontWeight:700,cursor:newName.trim()?"pointer":"not-allowed",fontFamily:"inherit",opacity:newName.trim()?1:0.5}}>{"✓ הוסף למלאי"}</button>
            <button onClick={()=>setForm({whTab:"stock"})} style={{width:"100%",padding:11,borderRadius:10,border:"none",background:C.cardA,color:C.txt,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginTop:8}}>{"ביטול"}</button>
          </div>
        </div></div>;
      }

      // ── MAIN STOCK VIEW ──
      let filtered=equipItems;
      if(whSearch.trim()){
        const q=whSearch.trim().toLowerCase();
        filtered=filtered.filter(it=>it.name.toLowerCase().includes(q)||(((wh[it.id]||{}).note||"").toLowerCase().includes(q)));
      }
      const lowCount=equipItems.filter(it=>{const t=getThr(it.id);return t>0 && getQty(it.id)<=t;}).length;
      const totalItems=equipItems.length;
      const editMode=form.whEdit||false;

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"95vh"}}>
        <div style={{background:C.hdr,color:"#fff",padding:"12px 16px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:17,fontWeight:700}}>{"📦 מלאי מחסן"}</div>
              <div style={{fontSize:11,opacity:0.85}}>{totalItems+" פריטים"+(lowCount>0?" · ⚠️ "+lowCount+" חסרים":"")}</div>
            </div>
          </div>
          <input value={whSearch} onChange={e=>setWhSearch(e.target.value)} placeholder={"🔍 חפש פריט..."} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"none",fontSize:13,fontFamily:"inherit",direction:"rtl",outline:"none",boxSizing:"border-box"}}/>
        </div>

        <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(95vh - 130px)"}}>
          {/* Action buttons */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(2, 1fr)",gap:8,marginBottom:10}}>
            <button onClick={()=>{setWhSearch("");setForm({whTab:"take",whCart:{},whTargetSite:""});}} style={{padding:"14px",borderRadius:10,border:"none",background:C.org,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"🛒 לקחתי ציוד"}</button>
            <button onClick={()=>{setWhSearch("");setForm({whTab:"receive",whCart:{}});}} style={{padding:"14px",borderRadius:10,border:"none",background:C.grn,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"📥 קיבלתי סחורה"}</button>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <button onClick={()=>setForm({...form,whTab:"history"})} style={{flex:1,padding:"9px",borderRadius:8,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"📜 היסטוריה"}</button>
            <button onClick={()=>setForm({...form,whEdit:!editMode})} style={{flex:1,padding:"9px",borderRadius:8,border:"1px solid "+(editMode?C.blu:C.bdr),background:editMode?C.bluB:"#fff",color:editMode?C.blu:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{editMode?"✓ סיום עריכה":"✏️ עריכת מלאי"}</button>
            <button onClick={()=>setForm({...form,whTab:"addItem",newItemName:"",newItemCat:"consumables"})} style={{flex:1,padding:"9px",borderRadius:8,border:"1px dashed "+C.grn,background:"#fff",color:C.grn,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"➕ פריט חדש"}</button>
          </div>

          {editMode && <div style={{display:"flex",gap:8,marginBottom:10}}>
            <div style={{flex:1,background:C.bluB,borderRadius:8,padding:"8px 12px",fontSize:11,color:C.blu,textAlign:"right"}}>{"💡 במצב עריכה: שנה כמות, קבע רף התראה, או העבר פריט לקטגוריה אחרת"}</div>
            <button onClick={async()=>{const ok=await forceSave();if(ok){alert("✓ נשמר בהצלחה");}else{alert("⚠️ שגיאה - נסה שוב");}}} style={{padding:"8px 14px",borderRadius:8,border:"none",background:C.grn,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{"💾 שמור"}</button>
          </div>}

          {(()=>{
            // If searching - show flat results across all categories
            if(whSearch.trim()){
              return <div>
                <div style={{fontSize:12,color:C.txtM,marginBottom:8,textAlign:"right"}}>{filtered.length+" תוצאות עבור \""+whSearch+"\""}</div>
                {filtered.map(it=>{
                  const qty=getQty(it.id),thr=getThr(it.id);
                  const isLow=thr>0&&qty<=thr,isZero=qty===0;
                  return <div key={it.id} style={{background:isZero?"#fee":isLow?"#fff7ed":"#fff",borderRadius:8,padding:"9px 11px",marginBottom:4,border:"1px solid "+(isZero?C.red:isLow?C.org:C.bdr)}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:20,fontWeight:700,color:isZero?C.red:isLow?C.org:C.grn,minWidth:36,textAlign:"center"}}>{qty}</span>
                      <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                        <span style={{fontSize:14,fontWeight:600}}>{it.name}</span>
                        <div style={{fontSize:10,color:C.txtL}}>{catNames[it.category]||""}</div>
                      </div>
                    </div>
                  </div>;
                })}
                {filtered.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:30,fontSize:13}}>{"לא נמצאו תוצאות"}</div>}
              </div>;
            }

            // Category tabs
            const activeCat=form.whActiveCat||whCatOrder.find(c=>equipItems.some(it=>it.category===c))||"connectors";
            const activeSub=form.whActiveSub||"__all__";
            const catItems=equipItems.filter(it=>it.category===activeCat);
            // Subgroups of active category
            const subsMap={};
            catItems.forEach(it=>{const sg=it.subgroup||"כללי";if(!subsMap[sg])subsMap[sg]=[];subsMap[sg].push(it);});
            const subList=Object.keys(subsMap);
            // Items to show
            const shownItems=activeSub==="__all__"?catItems:catItems.filter(it=>(it.subgroup||"כללי")===activeSub);

            return <div>
              {/* Category tabs */}
              <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:4,marginBottom:8}}>
                {whCatOrder.map(cat=>{
                  const cnt=equipItems.filter(it=>it.category===cat).length;
                  if(cnt===0)return null;
                  const low=equipItems.filter(it=>{if(it.category!==cat)return false;const t=getThr(it.id);return t>0&&getQty(it.id)<=t;}).length;
                  const sel=activeCat===cat;
                  return <button key={cat} onClick={()=>setForm({...form,whActiveCat:cat,whActiveSub:"__all__"})} style={{flex:"0 0 auto",padding:"8px 12px",borderRadius:10,border:"none",background:sel?C.hdr:C.cardA,color:sel?"#fff":C.txt,fontSize:12,fontWeight:sel?700:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{catNames[cat]+(low>0?" ⚠️"+low:"")}</button>;
                })}
              </div>

              {/* Subgroup chips */}
              {subList.length>1 && <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10,paddingBottom:8,borderBottom:"1px solid "+C.bdr}}>
                <button onClick={()=>setForm({...form,whActiveSub:"__all__"})} style={{padding:"5px 11px",borderRadius:14,border:"1.5px solid "+(activeSub==="__all__"?C.hdr:C.bdr),background:activeSub==="__all__"?C.hdr:"#fff",color:activeSub==="__all__"?"#fff":C.txt,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"הכל ("+catItems.length+")"}</button>
                {subList.map(sg=>{
                  const sel=activeSub===sg;
                  const low=subsMap[sg].filter(it=>{const t=getThr(it.id);return t>0&&getQty(it.id)<=t;}).length;
                  return <button key={sg} onClick={()=>setForm({...form,whActiveSub:sg})} style={{padding:"5px 11px",borderRadius:14,border:"1.5px solid "+(sel?C.hdr:C.bdr),background:sel?C.hdr:"#fff",color:sel?"#fff":C.txt,fontSize:11,fontWeight:sel?700:500,cursor:"pointer",fontFamily:"inherit"}}>{sg+" ("+subsMap[sg].length+")"+(low>0?" ⚠️":"")}</button>;
                })}
              </div>}

              {/* Items list */}
              {shownItems.map(it=>{
                const qty=getQty(it.id);
                const thr=getThr(it.id);
                const isLow=thr>0 && qty<=thr;
                const isZero=qty===0;
                return <div key={it.id} style={{background:isZero?"#fee":isLow?"#fff7ed":"#fff",borderRadius:8,padding:"10px 12px",marginBottom:5,border:"1px solid "+(isZero?C.red:isLow?C.org:C.bdr)}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    {editMode ? <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <button onClick={()=>up(d=>{if(!d.warehouse)d.warehouse={};const c=(d.warehouse[it.id]||{}).qty||0;d.warehouse[it.id]={...(d.warehouse[it.id]||{}),qty:Math.max(0,c-1)};})} style={{width:26,height:26,borderRadius:"50%",border:"1px solid "+C.bdr,background:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"−"}</button>
                      <input type="number" value={qty} onChange={e=>up(d=>{if(!d.warehouse)d.warehouse={};d.warehouse[it.id]={...(d.warehouse[it.id]||{}),qty:Math.max(0,+e.target.value||0)};})} style={{width:48,padding:"4px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:14,fontWeight:700,textAlign:"center",fontFamily:"inherit"}}/>
                      <button onClick={()=>up(d=>{if(!d.warehouse)d.warehouse={};const c=(d.warehouse[it.id]||{}).qty||0;d.warehouse[it.id]={...(d.warehouse[it.id]||{}),qty:c+1};})} style={{width:26,height:26,borderRadius:"50%",border:"1px solid "+C.grn,background:C.grn,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"+"}</button>
                    </div> : <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:20,fontWeight:700,color:isZero?C.red:isLow?C.org:C.grn,minWidth:36,textAlign:"center"}}>{qty}</span>
                      {isZero && <span style={{fontSize:14}}>🔴</span>}
                      {!isZero && isLow && <span style={{fontSize:14}}>⚠️</span>}
                    </div>}
                    <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                      <span style={{fontSize:14,fontWeight:600}}>{it.name}</span>
                      {(wh[it.id]||{}).note && <div style={{fontSize:11,color:C.org,fontWeight:600,marginTop:2}}>{"📝 "+(wh[it.id]||{}).note}</div>}
                    </div>
                  </div>
                  {editMode && <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid "+C.bdr}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                      <input value={(wh[it.id]||{}).note||""} onChange={e=>up(d=>{if(!d.warehouse)d.warehouse={};d.warehouse[it.id]={...(d.warehouse[it.id]||{}),note:e.target.value};})} placeholder="כינוי / שם בשטח..." style={{flex:1,padding:"5px 8px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:12,fontFamily:"inherit",direction:"rtl"}}/>
                      <span style={{fontSize:11,color:C.txtM,whiteSpace:"nowrap"}}>{"📝 הערה:"}</span>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                      <input type="number" value={thr||""} onChange={e=>up(d=>{if(!d.warehouse)d.warehouse={};d.warehouse[it.id]={...(d.warehouse[it.id]||{}),threshold:Math.max(0,+e.target.value||0)};})} placeholder="0" style={{width:48,padding:"4px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:12,textAlign:"center",fontFamily:"inherit"}}/>
                      <span style={{fontSize:11,color:C.txtM,whiteSpace:"nowrap"}}>{"🔔 התראה כשמתחת ל:"}</span>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                      <select value={it.category} onChange={e=>{const nc=e.target.value;up(d=>{const item=(d.inventory||[]).find(x=>x.id===it.id);if(item)item.category=nc;});}} style={{flex:1,padding:"5px 8px",borderRadius:6,border:"1px solid "+C.blu,fontSize:12,fontFamily:"inherit",direction:"rtl",color:C.blu,fontWeight:600}}>
                        {whCatOrder.map(c2=><option key={c2} value={c2}>{catNames[c2]}</option>)}
                      </select>
                      <span style={{fontSize:11,color:C.blu,whiteSpace:"nowrap"}}>{"📂 קטגוריה:"}</span>
                    </div>
                    {(()=>{
                      // Subgroups available in this item's category
                      const catSubs=[...new Set(equipItems.filter(x=>x.category===it.category).map(x=>x.subgroup||"כללי"))];
                      const cur=it.subgroup||"כללי";
                      if(!catSubs.includes(cur))catSubs.push(cur);
                      return <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                        <select value={cur} onChange={e=>{const ns=e.target.value;up(d=>{const item=(d.inventory||[]).find(x=>x.id===it.id);if(item)item.subgroup=ns;});}} style={{flex:1,padding:"5px 8px",borderRadius:6,border:"1px solid "+C.purp,fontSize:12,fontFamily:"inherit",direction:"rtl",color:C.purp,fontWeight:600}}>
                          {catSubs.map(s2=><option key={s2} value={s2}>{s2}</option>)}
                        </select>
                        <span style={{fontSize:11,color:C.purp,whiteSpace:"nowrap"}}>{"🗂 תת-קבוצה:"}</span>
                      </div>;
                    })()}
                    {it.userAdded && <button onClick={()=>confirmDel(it.name,()=>up(d=>{d.inventory=(d.inventory||[]).filter(x=>x.id!==it.id);if(d.warehouse)delete d.warehouse[it.id];}))} style={{width:"100%",padding:"6px",borderRadius:6,border:"1px solid "+C.red,background:"#fff",color:C.red,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"🗑 מחק פריט"}</button>}
                  </div>}
                </div>;
              })}
              {shownItems.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:30,fontSize:13}}>{"אין פריטים"}</div>}
            </div>;
          })()}
        </div>
      </div></div>;
    }

    if(modal==="allOrders"){
      const getDestInfo=(pid,o)=>{
        if(pid==="__test__")return {label:"🧪 טסט / ניסיון",color:C.purp,icon:"🧪"};
        if(pid==="__free__")return {label:"✏️ "+(o&&o.note||"חופשי"),color:C.org,icon:"✏️"};
        const mSite=(data.maintenanceSites||[]).find(s=>s.id===pid);
        if(mSite)return {label:"🌳 "+mSite.name,color:C.blu,icon:"🌳",name:mSite.name};
        const dSite=(data.devSites||[]).find(s=>s.id===pid);
        if(dSite)return {label:"🌱 "+dSite.name,color:C.grn,icon:"🌱",name:dSite.name};
        return {label:"❓ "+sn(pid),color:C.txtM,icon:"❓"};
      };

      // Selected location to drill into
      const selectedPid=form.ordersSelectedPid||null;

      // ───── DETAIL VIEW (selected location) ─────
      if(selectedPid){
        const orders=(data.projectOrders||{})[selectedPid]||[];
        const sortedOrders=[...orders].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
        const di=getDestInfo(selectedPid,orders[0]);
        // Build summary by item desc
        const itemSummary={};
        orders.forEach(o=>{
          const key=(o.desc||"").trim();
          if(!key)return;
          if(!itemSummary[key])itemSummary[key]={count:0,totalAmount:0};
          itemSummary[key].count++;
          itemSummary[key].totalAmount+=(+o.amount||0);
        });
        const summaryItems=Object.entries(itemSummary).sort((a,b)=>b[1].count-a[1].count);
        const totalAmount=orders.reduce((s,o)=>s+(+o.amount||0),0);

        return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} className="print-area" style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"92vh"}}>
          <div className="no-print" style={{background:di.color,color:"#fff",padding:"14px 18px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
                <button onClick={()=>window.print()} style={{background:"#fff",border:"none",color:di.color,padding:"6px 12px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>{"🖨️ הדפס"}</button>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:18,fontWeight:700}}>{di.label}</div>
                <div style={{fontSize:11,opacity:0.85}}>{orders.length+" הזמנות · ₪"+totalAmount.toLocaleString()}</div>
              </div>
            </div>
          </div>
          <div className="print-only" style={{display:"none",textAlign:"center",marginBottom:14,borderBottom:"2px solid #000",paddingBottom:8,padding:"14px 20px 8px"}}>
            <div style={{fontSize:20,fontWeight:700}}>{"📦 הזמנה — "+di.label}</div>
            <div style={{fontSize:13,marginTop:3}}>{new Date().toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"})+" · "+orders.length+" הזמנות · ₪"+totalAmount.toLocaleString()}</div>
          </div>

          <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(92vh - 70px)"}}>
            <button className="no-print" onClick={()=>setForm({...form,ordersSelectedPid:null})} style={{padding:"7px 12px",borderRadius:8,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"← חזור לרשימת מקומות"}</button>

            {/* Summary - all items totaled */}
            {summaryItems.length>0 && <div style={{background:C.cardA,borderRadius:12,padding:12,marginBottom:14,border:"1px solid "+C.bdr}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,textAlign:"right",color:di.color}}>{"📊 סיכום כולל"}</div>
              {summaryItems.map(([name,info],i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 8px",background:"#fff",borderRadius:6,marginBottom:4,border:"1px solid "+C.bdr}}>
                <div style={{fontSize:11,color:C.txtM}}>
                  <span style={{padding:"2px 6px",borderRadius:6,background:di.color+"22",color:di.color,fontWeight:700,marginInlineStart:4}}>{"×"+info.count}</span>
                  {info.totalAmount>0 && <span style={{fontWeight:700,color:C.txt}}>{"₪"+info.totalAmount.toLocaleString()}</span>}
                </div>
                <div style={{flex:1,textAlign:"right",fontSize:13,fontWeight:600}}>{name}</div>
              </div>)}
            </div>}

            {/* Orders timeline (screen only) */}
            <div className="no-print">
            <div style={{fontSize:13,fontWeight:700,marginBottom:8,textAlign:"right",color:di.color}}>{"📅 היסטוריית הזמנות"}</div>
            {sortedOrders.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20,fontSize:12}}>{"אין הזמנות"}</div>}
            {sortedOrders.map(o=>{
              const statusColors={ordered:{bg:"#fff3cd",bdr:C.org,clr:C.org,label:"📞 הוזמן"},onway:{bg:C.bluB,bdr:C.blu,clr:C.blu,label:"🚛 בדרך"},received:{bg:C.grnP,bdr:C.grn,clr:C.grn,label:"✅ התקבל"}};
              const sc=statusColors[o.status]||statusColors.ordered;
              return <div key={o.id} style={{background:"#fff",borderRadius:10,border:"1px solid "+C.bdr,padding:10,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                  <span style={{padding:"3px 8px",borderRadius:10,fontSize:10,fontWeight:700,background:sc.bg,color:sc.clr,border:"1px solid "+sc.bdr}}>{sc.label}</span>
                  <div style={{textAlign:"right",flex:1,marginInlineStart:8}}>
                    <div style={{fontSize:13,fontWeight:700}}>{o.desc}</div>
                    {o.date && <div style={{fontSize:11,color:C.txtM}}>{fmtFull(o.date)}</div>}
                  </div>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11,color:C.txtM,paddingTop:4}}>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {o.supplier && <span>{"🏪 "+o.supplier}</span>}
                    {o.amount>0 && <span style={{fontWeight:700,color:C.txt}}>{"₪"+(+o.amount).toLocaleString()}</span>}
                  </div>
                </div>
                {o.note && <div style={{fontSize:11,color:C.txtM,padding:"4px 8px",background:C.cardA,borderRadius:6,marginTop:4}}>{"📝 "+o.note}</div>}
                {/* Quick status update */}
                <div className="no-print" style={{display:"flex",gap:4,marginTop:6}}>
                  {["ordered","onway","received"].map(st=>{const _sc=statusColors[st];return <button key={st} onClick={()=>upOrderStatus(selectedPid,o.id,st)} style={{flex:1,padding:"5px 4px",borderRadius:6,border:"1px solid "+(o.status===st?_sc.bdr:C.bdr),background:o.status===st?_sc.bg:"#fff",color:o.status===st?_sc.clr:C.txtM,fontSize:10,fontWeight:o.status===st?700:500,cursor:"pointer",fontFamily:"inherit"}}>{_sc.label}</button>;})}
                </div>
                <div className="no-print" style={{display:"flex",gap:4,marginTop:5}}>
                  <button onClick={()=>{setForm({editOrderPid:selectedPid,editOrderOid:o.id,orderDesc:o.desc,orderSupplier:o.supplier,orderAmount:o.amount,orderStatus:o.status,orderNote:o.note});setModal("editOrder");}} style={{flex:1,padding:"5px",borderRadius:6,border:"1px solid "+C.blu,background:"#fff",color:C.blu,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"✏️ ערוך"}</button>
                  <button onClick={()=>confirmDel(o.desc||"הזמנה זו",()=>delOrder(selectedPid,o.id))} style={{flex:1,padding:"5px",borderRadius:6,border:"1px solid "+C.red,background:"#fff",color:C.red,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"🗑 מחק"}</button>
                </div>
              </div>;
            })}
            </div>
          </div>
        </div></div>;
      }

      // ───── LIST VIEW (locations) ─────
      // Group orders by location
      const locations={};
      Object.keys(data.projectOrders||{}).forEach(pid=>{
        const orders=data.projectOrders[pid]||[];
        if(orders.length===0)return;
        const di=getDestInfo(pid,orders[0]);
        const totalAmount=orders.reduce((s,o)=>s+(+o.amount||0),0);
        const counts={ordered:0,onway:0,received:0};
        orders.forEach(o=>{counts[o.status||"ordered"]=(counts[o.status||"ordered"]||0)+1;});
        let lastDate="";
        orders.forEach(o=>{if(o.date && o.date>lastDate)lastDate=o.date;});
        locations[pid]={...di,pid,orderCount:orders.length,totalAmount,counts,lastDate};
      });
      // Filter by search
      let locArr=Object.values(locations);
      if(ordersSearch.trim()){
        const q=ordersSearch.trim().toLowerCase();
        locArr=locArr.filter(loc=>(loc.name||loc.label).toLowerCase().includes(q));
      }
      // Sort by most recent
      locArr.sort((a,b)=>(b.lastDate||"").localeCompare(a.lastDate||""));
      const totalAllOrders=Object.values(data.projectOrders||{}).reduce((s,arr)=>s+arr.length,0);
      const totalAllAmount=Object.values(data.projectOrders||{}).reduce((s,arr)=>s+arr.reduce((s2,o)=>s2+(+o.amount||0),0),0);

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"92vh"}}>
        <div style={{background:C.org,color:"#fff",padding:"14px 18px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:18,fontWeight:700}}>{"📦 הזמנות לפי מקום"}</div>
              <div style={{fontSize:11,opacity:0.85}}>{locArr.length+" מקומות · "+totalAllOrders+" הזמנות · ₪"+totalAllAmount.toLocaleString()}</div>
            </div>
          </div>
          {/* Search */}
          <input value={ordersSearch} onChange={e=>setOrdersSearch(e.target.value)} placeholder={"🔍 חפש מקום..."} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"none",fontSize:13,fontFamily:"inherit",direction:"rtl",outline:"none",boxSizing:"border-box"}}/>
        </div>

        <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(92vh - 110px)"}}>
          <button onClick={()=>{setForm({bulkSupplier:"",bulkStatus:"ordered",bulkDate:todayISO,bulkNote:"",bulkItems:[],bulkStep:1});setModal("addBulkOrder");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.org,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"🛒 + הזמנה משולבת חדשה"}</button>

          {locArr.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:30,fontSize:13}}>{ordersSearch?"לא נמצאו תוצאות":"אין הזמנות עדיין"}</div>}

          {locArr.map(loc=>{
            const daysSince=loc.lastDate?Math.floor((new Date(todayISO)-new Date(loc.lastDate))/(1000*60*60*24)):null;
            return <div key={loc.pid} onClick={()=>setForm({...form,ordersSelectedPid:loc.pid})} style={{background:"#fff",borderRadius:12,border:"2px solid "+loc.color,padding:14,marginBottom:10,cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:18,color:loc.color}}>{"›"}</span>
                <div style={{textAlign:"right",flex:1}}>
                  <div style={{fontSize:15,fontWeight:700,color:loc.color}}>{loc.label}</div>
                  {loc.lastDate && <div style={{fontSize:10,color:C.txtL,marginTop:2}}>{daysSince===0?"הזמנה אחרונה: היום":daysSince===1?"הזמנה אחרונה: אתמול":"הזמנה אחרונה: לפני "+daysSince+" ימים"}</div>}
                </div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",fontSize:11}}>
                <span style={{padding:"3px 8px",borderRadius:10,background:loc.color+"22",color:loc.color,fontWeight:700}}>{loc.orderCount+" הזמנות"}</span>
                {loc.totalAmount>0 && <span style={{padding:"3px 8px",borderRadius:10,background:C.cardA,color:C.txt,fontWeight:700}}>{"₪"+loc.totalAmount.toLocaleString()}</span>}
                {loc.counts.ordered>0 && <span style={{padding:"3px 8px",borderRadius:10,background:"#fff3cd",color:C.org,fontWeight:600}}>{"📞 "+loc.counts.ordered}</span>}
                {loc.counts.onway>0 && <span style={{padding:"3px 8px",borderRadius:10,background:C.bluB,color:C.blu,fontWeight:600}}>{"🚛 "+loc.counts.onway}</span>}
                {loc.counts.received>0 && <span style={{padding:"3px 8px",borderRadius:10,background:C.grnP,color:C.grn,fontWeight:600}}>{"✅ "+loc.counts.received}</span>}
              </div>
            </div>;
          })}
        </div>
      </div></div>;
    }

    // ─── ADD BILLING EXTRA ───
    if(modal==="addBillingExtra")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:18,color:C.org,marginBottom:14,textAlign:"center"}}>{"💰 תוספת לחיוב"}</h3>
      <div style={{marginBottom:10}}><label style={lb}>{"לקוח / אתר"}</label>
        <select value={form.extraSiteId||""} onChange={e=>setForm({...form,extraSiteId:e.target.value})} style={inp}>
          <option value="">{"-- בחר --"}</option>{allSites.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </div>
      <div style={{marginBottom:10}}><label style={lb}>{"סכום (₪)"}</label><input type="number" value={form.extraAmount||""} onChange={e=>setForm({...form,extraAmount:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:10}}><label style={lb}>{"תיאור"}</label><input value={form.extraDesc||""} onChange={e=>setForm({...form,extraDesc:e.target.value})} placeholder={"דשן נוסף, שתילי בוקסוס..."} style={inp}/></div>
      <div style={{marginBottom:14}}><label style={lb}>{"תאריך"}</label><input type="date" value={form.extraDate||todayISO} onChange={e=>setForm({...form,extraDate:e.target.value})} style={inp}/></div>
      <button onClick={addBillingExtra} style={{...sb,background:C.org}}>{"הוסף תוספת"}</button>
    </div></div>;

    // ─── SITE DETAIL ───
    if(modal==="siteDetail"){
      const site=allSites.find(s=>s.id===form.siteId);
      if(!site)return null;
      const isDev=site.type==="d";
      const accent=isDev?C.blu:C.org;
      const accentBg=isDev?C.bluB:C.orgB;
      const siteTasks=[];
      Object.keys(data.dailyTasks||{}).forEach(d=>{(data.dailyTasks[d]||[]).forEach(t=>{if(t.siteId===site.id)siteTasks.push({...t,date:d});});});
      siteTasks.sort((a,b)=>b.date.localeCompare(a.date));
      const sitePhotos=(data.photos?.[site.id]||[]).slice().reverse();
      const siteOrders=(data.projectOrders?.[site.id]||[]);
      const siteExtras=(data.billingExtras||[]).filter(e=>e.siteId===site.id);
      const siteInvoices=(data.invoices||[]).filter(iv=>iv.siteId===site.id);
      const siteMeetings=(data.meetings||[]).filter(m=>m.siteId===site.id).sort((a,b)=>b.date.localeCompare(a.date));
      const nextNotes=(data.nextVisitNotes?.[site.id]||[]);
      const billPending=siteTasks.filter(t=>t.billable==="ready").length;
      const billInvoiced=siteTasks.filter(t=>t.billable==="invoiced").length;
      const updateSite=(patch)=>{up(d=>{const arr=isDev?"devSites":"maintenanceSites";const idx=d[arr].findIndex(x=>x.id===site.id);if(idx>=0)d[arr][idx]={...d[arr][idx],...patch};});};

      const detailTabs=[
        {key:"overview",label:"סקירה",icon:"📊"},
        {key:"photos",label:"גלריה",icon:"📷"},
        {key:"edit",label:"עריכה",icon:"⚙️"},
      ];

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"92vh"}}>
        {/* Sticky header */}
        <div style={{background:accent,color:"#fff",padding:"14px 18px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right",flex:1,marginInlineEnd:8}}>
              <div style={{fontSize:11,opacity:0.85}}>{isDev?"🌱 פרויקט":"🔧 תחזוקה"}</div>
              <div style={{fontSize:18,fontWeight:700}}>{site.name}</div>
            </div>
            <button onClick={()=>setSiteDetailTab("edit")} title="עריכה מהירה" style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:34,height:34,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"✏️"}</button>
          </div>
          {/* Sub tabs */}
          <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:2}}>
            {detailTabs.map(t=><button key={t.key} onClick={()=>setSiteDetailTab(t.key)} style={{flex:"0 0 auto",padding:"6px 10px",borderRadius:14,border:"none",background:siteDetailTab===t.key?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:11,fontWeight:siteDetailTab===t.key?700:400,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{t.icon+" "+t.label}</button>)}
          </div>
        </div>

        <div style={{padding:"16px 18px",overflowY:"auto",maxHeight:"calc(92vh - 110px)"}}>
          {/* OVERVIEW - all info in one scroll */}
          {siteDetailTab==="overview" && <div>
            {(()=>{
              const dailyLogs=data.dailyLogs||{};
              const openTasks=siteTasks.filter(t=>t.status!=="done");

              // Find oldest open task
              let oldestOpenDate=null;
              openTasks.forEach(t=>{
                const d=t.date||t.createdAt||"";
                if(d && (!oldestOpenDate||d<oldestOpenDate))oldestOpenDate=d;
              });
              const daysSinceOldest=oldestOpenDate?Math.floor((new Date(todayISO)-new Date(oldestOpenDate))/(1000*60*60*24)):0;

              // Last visit
              let lastVisitDate=null;
              Object.keys(dailyLogs).sort().reverse().forEach(dateKey=>{
                if(lastVisitDate)return;
                const dayLog=dailyLogs[dateKey]||{};
                if(dayLog[site.id])lastVisitDate=dateKey;
              });
              const daysSinceLastVisit=lastVisitDate?Math.floor((new Date(todayISO)-new Date(lastVisitDate))/(1000*60*60*24)):null;

              // Active reminders
              const activeReminders=[];
              Object.keys(dailyLogs).sort().reverse().forEach(dateKey=>{
                const dayLog=dailyLogs[dateKey]||{};
                const siteLog=dayLog[site.id];
                if(siteLog && Array.isArray(siteLog.reminders)){
                  siteLog.reminders.forEach(r=>{
                    if(r && r.text && !r.done)activeReminders.push({date:dateKey,text:r.text,key:dateKey+"_"+r.text});
                  });
                }
              });

              // Timeline
              const timeline=[];
              Object.keys(dailyLogs).sort().reverse().forEach(dateKey=>{
                const dayLog=dailyLogs[dateKey]||{};
                const siteLog=dayLog[site.id];
                if(siteLog && (siteLog.summary||(siteLog.extras||[]).length>0)){
                  timeline.push({date:dateKey,summary:siteLog.summary||"",extras:siteLog.extras||[]});
                }
              });

              const markReminderDone=(date,text)=>{
                up(d=>{
                  if(!d.dailyLogs||!d.dailyLogs[date]||!d.dailyLogs[date][site.id])return;
                  const rems=d.dailyLogs[date][site.id].reminders||[];
                  const idx=rems.findIndex(r=>r && r.text===text);
                  if(idx>=0)rems[idx]={...rems[idx],done:true};
                });
              };

              const unbilledExtras=siteExtras.filter(e=>!e.invoiced);

              return <div>
                {/* CONTACT BLOCK - prominent */}
                <div style={{background:accentBg,borderRadius:12,padding:14,marginBottom:14,border:"1px solid "+accent}}>
                  {site.client && <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>{"👤 "+site.client}</div>}
                  {site.phone && <div style={{marginBottom:6}}>
                    <a href={"tel:"+site.phone} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:"#fff",borderRadius:8,textDecoration:"none",border:"1px solid "+accent}}>
                      <span style={{fontSize:18}}>{"📞"}</span>
                      <span style={{flex:1,textAlign:"right",fontSize:15,fontWeight:700,color:accent,direction:"ltr"}}>{site.phone}</span>
                      <span style={{fontSize:11,color:C.txtM}}>{"לחץ להתקשרות"}</span>
                    </a>
                  </div>}
                  {site.address && <div style={{marginBottom:6}}>
                    <a href={"https://waze.com/ul?q="+encodeURIComponent(site.address)} target="_blank" rel="noopener noreferrer" style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:"#fff",borderRadius:8,textDecoration:"none",border:"1px solid "+accent}}>
                      <span style={{fontSize:18}}>{"📍"}</span>
                      <span style={{flex:1,textAlign:"right",fontSize:13,color:C.txt}}>{site.address}</span>
                      <span style={{fontSize:11,color:C.txtM}}>{"ניווט"}</span>
                    </a>
                  </div>}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12,marginTop:8,color:C.txtM}}>
                    {lastVisitDate?<span>{"🗓 ביקור אחרון: "+(daysSinceLastVisit===0?"היום":daysSinceLastVisit===1?"אתמול":"לפני "+daysSinceLastVisit+" ימים")}</span>:<span>{"🗓 אין ביקורים מתועדים"}</span>}

          {reportTab==="alerts" && <div>
            {/* Missed visits */}
            {missedSites.length>0 && <div style={{background:"#fff",borderRadius:12,padding:14,marginBottom:12,border:"2px solid "+C.red}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:10,color:C.red,textAlign:"right"}}>{"⚠️ לקוחות שלא טופלו בתדירות המוגדרת"}</div>
              {missedSites.map(m=><div key={m.site.id} style={{padding:"10px 12px",background:m.visits===0?"#fee":"#fff7ed",borderRadius:8,marginBottom:6,border:"1px solid "+(m.visits===0?C.red:C.org)}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:10,padding:"2px 7px",borderRadius:8,background:m.visits===0?C.red:C.org,color:"#fff",fontWeight:700}}>{"חסרים "+m.missing+" ביקורים"}</span>
                  <span style={{fontWeight:700,fontSize:13}}>{"🔧 "+m.site.name}</span>
                </div>
                <div style={{fontSize:11,color:C.txtM,textAlign:"right"}}>{"מצופה: "+m.expected+" · בוצעו: "+m.visits+" · תדירות: "+m.site.frequency}</div>
              </div>)}
            </div>}

            {/* Old pending tasks */}
            {(()=>{
              const oldTasks=[];
              Object.keys(data.dailyTasks||{}).forEach(d=>{
                (data.dailyTasks[d]||[]).forEach(t=>{
                  if(t.status!=="done"){
                    const daysOld=Math.floor((new Date(todayISO)-new Date(d))/(1000*60*60*24));
                    if(daysOld>=14)oldTasks.push({...t,date:d,daysOld});
                  }
                });
              });
              oldTasks.sort((a,b)=>b.daysOld-a.daysOld);
              if(oldTasks.length===0)return null;
              return <div style={{background:"#fff",borderRadius:12,padding:14,marginBottom:12,border:"2px solid "+C.org}}>
                <div style={{fontSize:13,fontWeight:700,marginBottom:10,color:C.org,textAlign:"right"}}>{"📋 משימות פתוחות מעל שבועיים ("+oldTasks.length+")"}</div>
                {oldTasks.slice(0,10).map(t=><div key={t.id} style={{padding:"8px 10px",background:C.cardA,borderRadius:6,marginBottom:4,fontSize:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:10,padding:"2px 7px",borderRadius:8,background:C.org,color:"#fff",fontWeight:700}}>{t.daysOld+" ימים"}</span>
                    <span style={{textAlign:"right",flex:1,marginInlineStart:6}}>{(t.siteId?"🔧 "+sn(t.siteId)+" · ":"")+t.notes}</span>
                  </div>
                </div>)}
                {oldTasks.length>10 && <div style={{textAlign:"center",fontSize:11,color:C.txtL,marginTop:6}}>{"ועוד "+(oldTasks.length-10)+" משימות..."}</div>}
              </div>;
            })()}

            {/* Old pending orders */}
            {(()=>{
              const stuckOrders=[];
              Object.keys(data.projectOrders||{}).forEach(pid=>{
                (data.projectOrders[pid]||[]).forEach(o=>{
                  if(o.status==="ordered" && o.date){
                    const daysOld=Math.floor((new Date(todayISO)-new Date(o.date))/(1000*60*60*24));
                    if(daysOld>=7)stuckOrders.push({...o,pid,daysOld});
                  }
                });
              });
              if(stuckOrders.length===0)return null;
              return <div style={{background:"#fff",borderRadius:12,padding:14,marginBottom:12,border:"2px solid "+C.blu}}>
                <div style={{fontSize:13,fontWeight:700,marginBottom:10,color:C.blu,textAlign:"right"}}>{"🚛 הזמנות בהמתנה מעל שבוע ("+stuckOrders.length+")"}</div>
                {stuckOrders.slice(0,10).map(o=><div key={o.id} style={{padding:"8px 10px",background:C.cardA,borderRadius:6,marginBottom:4,fontSize:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:10,padding:"2px 7px",borderRadius:8,background:C.blu,color:"#fff",fontWeight:700}}>{o.daysOld+" ימים"}</span>
                    <span style={{textAlign:"right",flex:1,marginInlineStart:6}}>{o.desc+" · "+(o.supplier||"")}</span>
                  </div>
                </div>)}
              </div>;
            })()}

            {/* If no alerts */}
            {missedSites.length===0 && (()=>{
              let openOld=0;
              Object.keys(data.dailyTasks||{}).forEach(d=>{
                (data.dailyTasks[d]||[]).forEach(t=>{
                  if(t.status!=="done"){
                    const daysOld=Math.floor((new Date(todayISO)-new Date(d))/(1000*60*60*24));
                    if(daysOld>=14)openOld++;
                  }
                });
              });
              let stuckOrd=0;
              Object.keys(data.projectOrders||{}).forEach(pid=>{
                (data.projectOrders[pid]||[]).forEach(o=>{
                  if(o.status==="ordered" && o.date){
                    const daysOld=Math.floor((new Date(todayISO)-new Date(o.date))/(1000*60*60*24));
                    if(daysOld>=7)stuckOrd++;
                  }
                });
              });
              return (openOld===0 && stuckOrd===0)?<div style={{textAlign:"center",padding:40,background:C.grnP,borderRadius:14,border:"2px solid "+C.grn}}>
                <div style={{fontSize:50,marginBottom:8}}>{"✅"}</div>
                <div style={{fontSize:15,fontWeight:700,color:C.grn,marginBottom:4}}>{"מצוין!"}</div>
                <div style={{fontSize:12,color:C.txtM}}>{"אין התראות חודשיות"}</div>
              </div>:null;
            })()}
          </div>}

          <div style={{textAlign:"center",fontSize:10,color:C.txtL,padding:"10px 0",marginTop:8,borderTop:"1px solid "+C.bdr}}>
            {"דוח מ-"+fmtFull(monthStart)+" עד "+fmtFull(monthEnd)}
          </div>
        </div>
      </div></div>;
    }

    // ─── ATTENDANCE REPORT ───
    if(modal==="attendanceReport"){
      const m=form.rptMonth||new Date();
      const mStart=new Date(m.getFullYear(),m.getMonth(),1);
      const mEnd=new Date(m.getFullYear(),m.getMonth()+1,0);
      const inM=(d)=>{const x=new Date(d);return x>=mStart&&x<=mEnd;};
      const navMonth=(dir)=>{const nm=new Date(m);nm.setMonth(nm.getMonth()+dir);setForm({...form,rptMonth:nm});};
      const monthLabel=m.toLocaleDateString("he-IL",{month:"long",year:"numeric"});

      // Build stats per worker
      const stats={};
      (data.workers||[]).forEach(w=>{stats[w.id]={name:w.name,present:0,absent:0,totalMin:0,days:[],reasons:{},sites:{}};});
      Object.keys(data.attendance||{}).forEach(d=>{
        if(!inM(d))return;
        const day=data.attendance[d]||{};
        Object.keys(day).forEach(wid=>{
          if(!stats[wid])return;
          const a=day[wid];
          if(a.present){
            const s=timeToMin(a.startTime||"07:00"),e=timeToMin(a.endTime||"16:00");
            const mins=Math.max(0,e-s);
            stats[wid].present++;
            stats[wid].totalMin+=mins;
            const sites=Array.isArray(a.siteIds)?a.siteIds:(a.siteId?[a.siteId]:[]);
            stats[wid].days.push({date:d,start:a.startTime||"07:00",end:a.endTime||"16:00",mins,sites});
            sites.forEach(sid=>{stats[wid].sites[sid]=(stats[wid].sites[sid]||0)+1;});
          } else if(a.absenceReason&&a.absenceReason.trim()){
            stats[wid].absent++;
            stats[wid].reasons[a.absenceReason]=(stats[wid].reasons[a.absenceReason]||0)+1;
            stats[wid].days.push({date:d,absent:true,reason:a.absenceReason});
          }
        });
      });
      const active=Object.entries(stats).filter(([_,s])=>s.present>0||s.absent>0);
      const totalHours=active.reduce((s,[_,x])=>s+x.totalMin,0);

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} className="print-area" style={{...bx,maxWidth:780,width:"100%",padding:0,maxHeight:"95vh",overflow:"auto"}}>
        <div className="no-print" style={{background:C.blu,color:"#fff",padding:"12px 16px",position:"sticky",top:0,zIndex:10,borderRadius:"16px 16px 0 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{fontSize:17,fontWeight:700}}>{"👷 דוח נוכחות עובדים"}</div>
            <button onClick={()=>window.print()} style={{background:"#fff",border:"none",color:C.blu,padding:"6px 14px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>{"🖨️ הדפס"}</button>
          </div>
          <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <button onClick={()=>navMonth(-1)} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:30,height:30,borderRadius:8,cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>{"◀"}</button>
            <div style={{fontSize:14,fontWeight:700}}>{monthLabel}</div>
            <button onClick={()=>navMonth(1)} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:30,height:30,borderRadius:8,cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>{"▶"}</button>
            <input type="month" value={iso(m).slice(0,7)} onChange={e=>{const v=e.target.value;if(v){const p=v.split("-");setForm({...form,rptMonth:new Date(+p[0],+p[1]-1,1)});}}} className="no-print" style={{border:"none",borderRadius:6,padding:"4px 8px",fontSize:12,fontFamily:"inherit",cursor:"pointer"}}/>
          </div>
        </div>

        <div style={{padding:"16px 20px"}}>
          {/* Print-only header */}
          <div style={{display:"none"}} className="print-only">
            <h1 style={{fontSize:22,textAlign:"center",marginBottom:6}}>{"דוח נוכחות עובדים · "+monthLabel}</h1>
          </div>

          {/* Summary */}
          <div style={{background:C.bluB,border:"1px solid "+C.blu,borderRadius:10,padding:12,marginBottom:14,display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:700,color:C.blu}}>{active.length}</div>
              <div style={{fontSize:11,color:C.txtM}}>{"עובדים פעילים"}</div>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:700,color:C.blu}}>{fmtMin(totalHours)}</div>
              <div style={{fontSize:11,color:C.txtM}}>{"סך שעות עבודה"}</div>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:700,color:C.blu}}>{active.reduce((s,[_,x])=>s+x.present,0)}</div>
              <div style={{fontSize:11,color:C.txtM}}>{"סה״כ ימי נוכחות"}</div>
            </div>
          </div>

          {active.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:40}}>{"אין נתוני נוכחות לחודש זה"}</div>}

          {/* PRINT-ONLY: Compact summary table */}
          {active.length>0 && <table className="print-only" style={{width:"100%",borderCollapse:"collapse",fontSize:11,marginBottom:10}}>
            <thead>
              <tr>
                <th style={{padding:"5px",textAlign:"right",border:"1px solid #555"}}>{"עובד"}</th>
                <th style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{"נוכחות"}</th>
                <th style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{"היעדרות"}</th>
                <th style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{"סך שעות"}</th>
                <th style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{"ממוצע יומי"}</th>
                <th style={{padding:"5px",textAlign:"right",border:"1px solid #555"}}>{"סיבות / אתרים"}</th>
              </tr>
            </thead>
            <tbody>
              {active.map(([wid,s])=>{
                const avg=s.present>0?fmtMin(Math.round(s.totalMin/s.present)):"-";
                const reasons=Object.entries(s.reasons).map(([r,c])=>r+(c>1?" ×"+c:"")).join(", ");
                const sites=Object.entries(s.sites).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([sid,c])=>sn(sid)+" ("+c+")").join(", ");
                return <tr key={wid}>
                  <td style={{padding:"5px",textAlign:"right",border:"1px solid #555",fontWeight:700}}>{s.name}</td>
                  <td style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{s.present}</td>
                  <td style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{s.absent||"-"}</td>
                  <td style={{padding:"5px",textAlign:"center",border:"1px solid #555",fontWeight:700}}>{fmtMin(s.totalMin)}</td>
                  <td style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{avg}</td>
                  <td style={{padding:"5px",textAlign:"right",border:"1px solid #555",fontSize:9}}>{[reasons,sites].filter(Boolean).join(" · ")}</td>
                </tr>;
              })}
              <tr style={{background:"#e0e0e0",fontWeight:700}}>
                <td style={{padding:"5px",textAlign:"right",border:"1px solid #555"}}>{"סה״כ"}</td>
                <td style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{active.reduce((s,[_,x])=>s+x.present,0)}</td>
                <td style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{active.reduce((s,[_,x])=>s+x.absent,0)}</td>
                <td style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>{fmtMin(totalHours)}</td>
                <td style={{padding:"5px",textAlign:"center",border:"1px solid #555"}}>-</td>
                <td style={{padding:"5px",border:"1px solid #555"}}></td>
              </tr>
            </tbody>
          </table>}

          {/* SCREEN-ONLY: detailed cards (hidden in print via daily-detail and no-print) */}
          <div className="no-print">

          {active.map(([wid,s])=><div key={wid} style={{background:"#fff",border:"1px solid "+C.bdr,borderRadius:10,padding:14,marginBottom:12,pageBreakInside:"avoid"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,paddingBottom:8,borderBottom:"2px solid "+C.bdr}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <span style={{padding:"3px 9px",borderRadius:8,background:C.grnP,color:C.grn,fontSize:11,fontWeight:700}}>{"✓ "+s.present+" ימים"}</span>
                {s.absent>0 && <span style={{padding:"3px 9px",borderRadius:8,background:"#fee",color:C.red,fontSize:11,fontWeight:700}}>{"✗ "+s.absent+" היעדרויות"}</span>}
                <span style={{padding:"3px 9px",borderRadius:8,background:C.bluB,color:C.blu,fontSize:11,fontWeight:700}}>{fmtMin(s.totalMin)}</span>
              </div>
              <div style={{fontSize:16,fontWeight:700}}>{"👷 "+s.name}</div>
            </div>

            {/* Reasons */}
            {Object.keys(s.reasons).length>0 && <div style={{marginBottom:8,textAlign:"right"}}>
              <span style={{fontSize:11,color:C.txtM}}>{"היעדרויות: "}</span>
              {Object.entries(s.reasons).map(([r,c])=><span key={r} style={{fontSize:11,padding:"2px 7px",margin:"0 3px",background:C.cardA,borderRadius:6}}>{r+" ×"+c}</span>)}
            </div>}

            {/* Sites */}
            {Object.keys(s.sites).length>0 && <div style={{marginBottom:8,textAlign:"right"}}>
              <span style={{fontSize:11,color:C.txtM}}>{"עבד באתרים: "}</span>
              {Object.entries(s.sites).sort((a,b)=>b[1]-a[1]).map(([sid,c])=><span key={sid} style={{fontSize:11,padding:"2px 7px",margin:"0 3px",background:C.grnP,color:C.grn,borderRadius:6}}>{sn(sid)+" ("+c+")"}</span>)}
            </div>}

            {/* Daily detail - hidden in print */}
            <div className="daily-detail" style={{fontSize:11,color:C.txtM,textAlign:"right",marginTop:6}}>
              <div style={{fontWeight:700,marginBottom:4}}>{"פירוט יומי:"}</div>
              <div style={{lineHeight:1.6}}>
                {s.days.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map((d,i)=><span key={i} style={{display:"inline-block",margin:"0 4px 4px 0",padding:"3px 8px",background:d.absent?"#fee":C.cardA,borderRadius:6,color:d.absent?C.red:C.txt,fontSize:10}}>
                  {new Date(d.date).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})+" "+(d.absent?"⬜ "+d.reason:d.start+"-"+d.end+" ("+fmtMin(d.mins)+")")}
                </span>)}
              </div>
            </div>
          </div>)}
          </div>
        </div>
      </div></div>;
    }

    // ─── SITE REPORT ───
    if(modal==="siteReport"){
      const m=form.rptMonth||new Date();
      const mStart=new Date(m.getFullYear(),m.getMonth(),1);
      const mEnd=new Date(m.getFullYear(),m.getMonth()+1,0);
      const inM=(d)=>{const x=new Date(d);return x>=mStart&&x<=mEnd;};
      const navMonth=(dir)=>{const nm=new Date(m);nm.setMonth(nm.getMonth()+dir);setForm({...form,rptMonth:nm});};
      const monthLabel=m.toLocaleDateString("he-IL",{month:"long",year:"numeric"});
      const allSites=[...(data.maintenanceSites||[]),...(data.devSites||[])];
      const selSiteId=form.rptSiteId||"";

      // If no site selected - show picker
      if(!selSiteId){
        // Sites active this month
        const activeSet=new Set();
        Object.keys(data.weekAssign||{}).forEach(d=>{if(inM(d))(data.weekAssign[d]||[]).forEach(a=>activeSet.add(a.siteId));});
        Object.keys(data.dailyLogs||{}).forEach(d=>{if(inM(d))Object.keys(data.dailyLogs[d]||{}).forEach(sid=>activeSet.add(sid));});
        Object.keys(data.dailyTasks||{}).forEach(d=>{if(inM(d))(data.dailyTasks[d]||[]).forEach(t=>{if(t.siteId)activeSet.add(t.siteId);});});
        (data.billingExtras||[]).forEach(e=>{if(e.siteId&&inM(e.date))activeSet.add(e.siteId);});
        (data.invoices||[]).forEach(iv=>{if(iv.siteId&&inM(iv.date))activeSet.add(iv.siteId);});
        return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,padding:18}}>
          <h3 style={{fontSize:17,marginBottom:14,textAlign:"center",color:C.grn}}>{"🏠 בחר לקוח לדוח"}</h3>
          <button onClick={()=>setForm({...form,rptSiteId:"__ALL__"})} style={{width:"100%",padding:"14px",marginBottom:10,borderRadius:10,border:"none",background:C.grn,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}>{"📚 דוח כולל - כל האתרים החודש ("+activeSet.size+")"}</button>
          <div style={{fontSize:10,color:C.txtM,textAlign:"center",marginBottom:8}}>{"או בחר לקוח יחיד:"}</div>
          <div style={{maxHeight:"55vh",overflowY:"auto"}}>
            {allSites.map(s=>{
              const isM=(data.maintenanceSites||[]).some(x=>x.id===s.id);
              const active=activeSet.has(s.id);
              return <button key={s.id} onClick={()=>setForm({...form,rptSiteId:s.id})} style={{width:"100%",padding:"12px 14px",marginBottom:6,borderRadius:10,border:"1px solid "+C.bdr,background:active?"#fff":C.cardA,color:active?C.txt:C.txtL,fontSize:14,fontWeight:active?600:500,cursor:"pointer",fontFamily:"inherit",textAlign:"right",display:"flex",justifyContent:"space-between"}}>
                <span>{"›"}</span>
                <span>{(isM?"🔧 ":"🌱 ")+s.name+(!active?" (אין נתונים)":"")}</span>
              </button>;
            })}
          </div>
          <button onClick={close} style={{...sb,background:C.cardA,color:C.txt,marginTop:8}}>{"ביטול"}</button>
        </div></div>;
      }

      // ── ALL SITES MODE ──
      if(selSiteId==="__ALL__"){
        // Find sites active this month
        const activeSet=new Set();
        Object.keys(data.weekAssign||{}).forEach(d=>{if(inM(d))(data.weekAssign[d]||[]).forEach(a=>activeSet.add(a.siteId));});
        Object.keys(data.dailyLogs||{}).forEach(d=>{if(inM(d))Object.keys(data.dailyLogs[d]||{}).forEach(sid=>activeSet.add(sid));});
        Object.keys(data.dailyTasks||{}).forEach(d=>{if(inM(d))(data.dailyTasks[d]||[]).forEach(t=>{if(t.siteId)activeSet.add(t.siteId);});});
        (data.billingExtras||[]).forEach(e=>{if(e.siteId&&inM(e.date))activeSet.add(e.siteId);});
        (data.invoices||[]).forEach(iv=>{if(iv.siteId&&inM(iv.date))activeSet.add(iv.siteId);});
        const activeSites=allSites.filter(s=>activeSet.has(s.id)).sort((a,b)=>(a.name||"").localeCompare(b.name||""));

        // Build data for one site
        const buildSiteData=(sid)=>{
          const visits=[];
          Object.keys(data.weekAssign||{}).forEach(d=>{
            if(!inM(d))return;
            if((data.weekAssign[d]||[]).some(a=>a.siteId===sid))visits.push(d);
          });
          visits.sort();
          const reports=[];
          Object.keys(data.dailyLogs||{}).forEach(d=>{
            if(!inM(d))return;
            const log=(data.dailyLogs[d]||{})[sid];
            if(log&&(log.summary||(log.extras||[]).length>0))reports.push({date:d,...log});
          });
          reports.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
          const tasks=[];
          Object.keys(data.dailyTasks||{}).forEach(d=>{
            if(!inM(d))return;
            (data.dailyTasks[d]||[]).forEach(t=>{if(t.siteId===sid)tasks.push({...t,date:d});});
          });
          const extras=(data.billingExtras||[]).filter(e=>e.siteId===sid&&inM(e.date));
          const invoices=(data.invoices||[]).filter(iv=>iv.siteId===sid&&inM(iv.date));
          const orders=((data.projectOrders||{})[sid]||[]).filter(o=>o.date&&inM(o.date));
          return {visits,reports,tasks,extras,invoices,orders};
        };

        return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} className="print-area" style={{...bx,maxWidth:780,width:"100%",padding:0,maxHeight:"95vh",overflow:"auto"}}>

                </thead>
                <tbody>
                  {items.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map((e,i)=><tr key={i} style={{borderBottom:"1px solid "+C.bdr,opacity:e.invoiced?0.6:1}}>

    // ─── RESTOCK REPORT (standalone) ───
    if(modal==="restockReport"){
      const equip=(data.inventory||[]).filter(it=>["connectors","pipes","sprinklers","headsys","spray","consumables"].includes(it.category));
      const getQ=id=>((data.warehouse||{})[id]||{}).qty||0;
      const getT=id=>((data.warehouse||{})[id]||{}).threshold||0;
      const needRestock=equip.filter(it=>{const t=getT(it.id);return t>0 && getQ(it.id)<t*2;});
      const byCat={};
      needRestock.forEach(it=>{
        const c=it.category;
        const sg=it.subgroup||"כללי";
        if(!byCat[c])byCat[c]={};
        if(!byCat[c][sg])byCat[c][sg]=[];
        const qty=getQ(it.id);
        const thr=getT(it.id);
        const orderQty=Math.max(1,(thr*2)-qty);
        byCat[c][sg].push({...it,qty,thr,orderQty});
      });
      const catN={connectors:"🔌 מחברים",pipes:"🚰 צינורות",sprinklers:"💦 ממטירים וטפטפות",headsys:"⚙️ ראשי מערכת",spray:"🧪 חומרי ריסוס",consumables:"🛠 חומרים מתכלים"};
      const catOrd=["connectors","pipes","sprinklers","headsys","spray","consumables"];
      const totalUnits=needRestock.reduce((s,it)=>{const q=getQ(it.id);const t=getT(it.id);return s+Math.max(1,(t*2)-q);},0);

      const buildText=()=>{
        let txt="רשימת הזמנה - "+new Date().toLocaleDateString("he-IL")+"\n\n";
        catOrd.forEach(c=>{
          if(!byCat[c])return;
          txt+="── "+(catN[c]||c)+" ──\n";
          Object.keys(byCat[c]).forEach(sg=>{
            byCat[c][sg].forEach(it=>{
              txt+="• "+it.name+" — "+it.orderQty+" יח׳ (יש: "+it.qty+", רף: "+it.thr+")\n";
            });
          });
          txt+="\n";
        });
        txt+="סה״כ: "+needRestock.length+" פריטים שונים, "+totalUnits+" יחידות";
        return txt;
      };
      const copyText=()=>{
        try{navigator.clipboard.writeText(buildText());alert("✓ הרשימה הועתקה - אפשר להדביק לוואטסאפ / אימייל");}
        catch(e){alert("לא הצלחתי להעתיק");}
      };

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} className="print-area" style={{...bx,maxWidth:680,width:"100%",padding:0,maxHeight:"95vh",overflow:"auto"}}>
        <div className="no-print" style={{background:C.red,color:"#fff",padding:"12px 16px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:17,fontWeight:700}}>{"📋 רשימת הזמנה"}</div>
              <div style={{fontSize:11,opacity:0.85}}>{needRestock.length+" פריטים · "+totalUnits+" יח׳ בסה״כ"}</div>
            </div>
            <div style={{width:28}}></div>
          </div>
          {needRestock.length>0 && <div style={{display:"flex",gap:6,marginTop:8}}>
            <button onClick={copyText} style={{flex:1,padding:"8px",borderRadius:8,border:"none",background:"#fff",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"📋 העתק רשימה"}</button>
            <button onClick={()=>window.print()} style={{flex:1,padding:"8px",borderRadius:8,border:"none",background:"#fff",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"🖨️ הדפס"}</button>
          </div>}
        </div>

        <div style={{padding:"16px 20px"}}>
          <div className="print-only" style={{textAlign:"center",marginBottom:14,borderBottom:"2px solid #000",paddingBottom:8}}>
            <div style={{fontSize:20,fontWeight:700}}>{"📋 רשימת הזמנה"}</div>
            <div style={{fontSize:13,marginTop:3}}>{new Date().toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"})+" · "+needRestock.length+" פריטים, "+totalUnits+" יחידות"}</div>
          </div>

          {needRestock.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:40}}>
            <div style={{fontSize:40,marginBottom:8}}>{"✓"}</div>
            <div style={{fontSize:14,fontWeight:700,color:C.grn}}>{"כל הפריטים במלאי תקין"}</div>
            <div style={{fontSize:11,color:C.txtL,marginTop:4}}>{"אין צורך בהזמנה כרגע"}</div>
          </div>}

          {catOrd.map(cat=>{
            if(!byCat[cat])return null;
            const catItems=Object.values(byCat[cat]).flat();
            const catTotal=catItems.reduce((s,it)=>s+it.orderQty,0);
            return <div key={cat} style={{marginBottom:16,pageBreakInside:"avoid"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:C.hdr,color:"#fff",borderRadius:"8px 8px 0 0"}}>
                <span style={{fontSize:12,fontWeight:700}}>{catItems.length+" פריטים · "+catTotal+" יח׳"}</span>
                <span style={{fontSize:14,fontWeight:700}}>{catN[cat]}</span>
              </div>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,border:"1px solid "+C.bdr}}>
                <thead>
                  <tr style={{background:C.cardA}}>
                    <th style={{padding:"6px",textAlign:"center",fontWeight:700,width:30,border:"1px solid "+C.bdr}}>{"✓"}</th>
                    <th style={{padding:"6px",textAlign:"right",fontWeight:700,border:"1px solid "+C.bdr}}>{"פריט"}</th>
                    <th style={{padding:"6px",textAlign:"center",fontWeight:700,width:60,border:"1px solid "+C.bdr}}>{"במלאי"}</th>
                    <th style={{padding:"6px",textAlign:"center",fontWeight:700,width:50,border:"1px solid "+C.bdr}}>{"רף"}</th>
                    <th style={{padding:"6px",textAlign:"center",fontWeight:700,width:80,border:"1px solid "+C.bdr,background:"#fee"}}>{"להזמין"}</th>
                  </tr>
                </thead>
                <tbody>
                  {Object.keys(byCat[cat]).map(sg=><React.Fragment key={sg}>
                    {Object.keys(byCat[cat]).length>1 && <tr><td colSpan={5} style={{padding:"4px 8px",background:"#f5f0e6",fontWeight:700,fontSize:11,textAlign:"right",border:"1px solid "+C.bdr,color:C.txtM}}>{sg}</td></tr>}
                    {byCat[cat][sg].map(it=><tr key={it.id}>
                      <td style={{padding:"5px",textAlign:"center",border:"1px solid "+C.bdr}}>{"☐"}</td>
                      <td style={{padding:"5px",textAlign:"right",border:"1px solid "+C.bdr,fontWeight:600}}>{it.name+(((data.warehouse||{})[it.id]||{}).note?" ("+(data.warehouse[it.id].note)+")":"")}</td>
                      <td style={{padding:"5px",textAlign:"center",border:"1px solid "+C.bdr,color:it.qty===0?C.red:C.org,fontWeight:700}}>{it.qty}</td>
                      <td style={{padding:"5px",textAlign:"center",border:"1px solid "+C.bdr,color:C.txtM}}>{it.thr}</td>
                      <td style={{padding:"5px",textAlign:"center",border:"1px solid "+C.bdr,background:"#fff7ed",color:C.red,fontWeight:700,fontSize:14}}>{it.orderQty}</td>
                    </tr>)}
                  </React.Fragment>)}
                </tbody>
              </table>
            </div>;
          })}

          {needRestock.length>0 && <div style={{background:C.cardA,borderRadius:10,padding:12,marginTop:14,fontSize:11,color:C.txtM,textAlign:"right",lineHeight:1.6}}>
            <div style={{fontWeight:700,marginBottom:4,color:C.txt}}>{"💡 איך זה חושב?"}</div>
            {"כל פריט שהמלאי שלו נמוך מ-2× הרף - מופיע ברשימה. הכמות להזמנה היא ההפרש כדי להגיע ל-2× הרף, כלומר אחרי ההזמנה יהיה לך רף + רזרבה."}
          </div>}
        </div>
      </div></div>;
    }

    if(modal==="remindersArchive"){
      const completed=[];
      Object.keys(data.dailyTasks||{}).forEach(d=>{
        (data.dailyTasks[d]||[]).forEach(t=>{
          if(t.status==="done" && !t.siteId)completed.push({...t,date:d});
        });
      });
      // Sort newest first
      completed.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:520,width:"100%",padding:0,maxHeight:"92vh"}}>
        <div style={{background:C.grn,color:"#fff",padding:"14px 18px",position:"sticky",top:0,borderRadius:"16px 16px 0 0",zIndex:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:18,fontWeight:700}}>{"📜 ארכיון תזכורות"}</div>
              <div style={{fontSize:11,opacity:0.85}}>{completed.length+" תזכורות בוצעו"}</div>
            </div>
          </div>
        </div>

        <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(92vh - 70px)"}}>
          {completed.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:30,fontSize:13}}>{"עדיין לא בוצעו תזכורות"}</div>}

          {completed.map((t,i)=><div key={t.id+"_"+i} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",borderRadius:8,background:C.grnP,marginBottom:6,border:"1px solid "+C.grnL}}>
            <span onClick={()=>togTask(t.date,t.id)} title="החזר לפעיל" style={{fontSize:22,cursor:"pointer"}}>{"✅"}</span>
            <span onClick={()=>confirmDel(t.notes||"תזכורת זו",()=>delTask(t.date,t.id))} style={{fontSize:14,color:C.red,cursor:"pointer"}}>{"🗑"}</span>
            <div style={{flex:1,textAlign:"right"}}>
              <div style={{fontSize:14,fontWeight:500,textDecoration:"line-through",color:C.txtM}}>{t.notes}</div>
              <div style={{fontSize:11,color:C.txtL,marginTop:3}}>{fmtFull(new Date(t.date))}</div>
            </div>
            {t.image && <img src={t.image} onClick={()=>setZoomImg(t.image)} style={{width:40,height:40,objectFit:"cover",borderRadius:6,cursor:"pointer"}} alt=""/>}
          </div>)}

          {completed.length>0 && <div style={{textAlign:"center",fontSize:11,color:C.txtL,padding:"10px 0",marginTop:8,borderTop:"1px solid "+C.bdr}}>
            {"💡 לחץ על ✅ כדי להחזיר תזכורת לפעילה"}
          </div>}
        </div>
      </div></div>;
    }

    if(modal==="confirmDelete"){
      const itemName=form.delName||"";
      const onConfirm=form.delAction;
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:380,padding:20}}>
        <div style={{textAlign:"center",marginBottom:14}}>
          <div style={{fontSize:36,marginBottom:8}}>{"⚠️"}</div>
          <div style={{fontSize:16,fontWeight:700,marginBottom:6}}>{"האם למחוק?"}</div>
          {itemName && <div style={{fontSize:14,color:C.txtM,padding:"8px 12px",background:C.cardA,borderRadius:8,marginTop:8}}>{itemName}</div>}
          <div style={{fontSize:11,color:C.txtL,marginTop:10}}>{"פעולה זו לא ניתנת לביטול"}</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={close} style={{flex:1,padding:12,borderRadius:10,border:"1.5px solid "+C.bdr,background:"#fff",color:C.txt,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"ביטול"}</button>
          <button onClick={()=>{if(typeof onConfirm==="function")onConfirm();setModal(null);setForm({});}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:C.red,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"🗑 מחק"}</button>
        </div>
      </div></div>;
    }

    if(modal==="siteLog"){
      const siteId=form.logSiteId;
      const dyKey=form.logDate||todayISO;
      const site=[...(data.maintenanceSites||[]),...(data.devSites||[])].find(s=>s.id===siteId);
      if(!site)return null;
      const isMaint=(data.maintenanceSites||[]).some(m=>m.id===siteId);

      const summary=form.logSummary||"";
      const extras=form.logExtras||[];
      const reminders=form.logReminders||[];
      const equipment=form.logEquipment||[];

      // Equipment items - filter to warehouse-tracked categories only
      const eqCats=["connectors","pipes","sprinklers","headsys","spray","consumables"];
      const eqItems=(data.inventory||[]).filter(it=>eqCats.includes(it.category)&&!it.isFreeForm);
      const getEqQty=id=>((data.warehouse||{})[id]||{}).qty||0;

      const updExtra=(i,field,val)=>{
        const ne=[...extras];
        ne[i]={...ne[i],[field]:val};
        setForm({...form,logExtras:ne});
      };
      const remExtra=(i)=>{
        const ne=[...extras];
        ne.splice(i,1);
        setForm({...form,logExtras:ne});
      };
      const addExtra=()=>{
        setForm({...form,logExtras:[...extras,{desc:"",qty:""}]});
      };
      const updRem=(i,val)=>{
        const nr=[...reminders];
        nr[i]={text:val};
        setForm({...form,logReminders:nr});
      };
      const remRem=(i)=>{
        const nr=[...reminders];
        nr.splice(i,1);
        setForm({...form,logReminders:nr});
      };
      const addRem=()=>{
        setForm({...form,logReminders:[...reminders,{text:""}]});
      };

      const saveLog=()=>{
        const eqValid=equipment.filter(e=>e.itemId&&+e.qty>0);
        up(d=>{
          if(!d.dailyLogs)d.dailyLogs={};
          if(!d.dailyLogs[dyKey])d.dailyLogs[dyKey]={};
          d.dailyLogs[dyKey][siteId]={
            summary:summary,
            extras:extras.filter(e=>e.desc||e.qty),
            reminders:reminders.filter(r=>r.text)
          };
          // Process equipment - subtract from warehouse, add stock movement, add billing entry
          if(eqValid.length>0){
            if(!d.warehouse)d.warehouse={};
            if(!d.stockMovements)d.stockMovements=[];
            if(!d.billingExtras)d.billingExtras=[];
            const movId=uid();
            eqValid.forEach(e=>{
              const cur=(d.warehouse[e.itemId]||{}).qty||0;
              d.warehouse[e.itemId]={...(d.warehouse[e.itemId]||{}),qty:Math.max(0,cur-(+e.qty))};
            });
            d.stockMovements.push({
              id:movId,
              type:"take",
              date:dyKey,
              siteId:siteId,
              items:eqValid.map(e=>({itemId:e.itemId,qty:+e.qty,name:(eqItems.find(x=>x.id===e.itemId)||{}).name||""}))
            });
            // Add billing entry for each item
            eqValid.forEach(e=>{
              const nm=(eqItems.find(x=>x.id===e.itemId)||{}).name||"";
              d.billingExtras.push({
                id:uid(),
                siteId:siteId,
                date:dyKey,
                amount:0,
                qty:+e.qty,
                desc:nm,
                invoiced:false,
                fromWarehouse:true,
                movId:movId
              });
            });
          }
        });
        setTimeout(()=>forceSave(),100);
        setModal(null);
        setForm({});
      };

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:520,padding:0,maxHeight:"94vh"}}>
        <div style={{background:isMaint?C.blu:C.grn,color:"#fff",padding:"12px 16px",borderRadius:"16px 16px 0 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right",flex:1,marginInlineStart:10}}>
              <div style={{fontSize:17,fontWeight:700}}>{(isMaint?"🔧 ":"🌱 ")+site.name}</div>
              <div style={{fontSize:11,opacity:0.9}}>{"סיכום יומי"}</div>
            </div>
          </div>
        </div>

        <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(94vh - 70px)"}}>
          {/* 1. Summary */}
          <div style={{marginBottom:14}}>
            <label style={{...lb,fontSize:13,color:C.grn,fontWeight:700}}>{"📝 סיכום יומי"}</label>
            <textarea value={summary} onChange={e=>setForm({...form,logSummary:e.target.value})} placeholder={"מה נעשה היום? (כיסוח, גיזום, השקיה...)"} style={{...inp,minHeight:70,fontSize:13,padding:"10px 12px"}}/>
          </div>

          {/* 2. Extras */}
          <div style={{marginBottom:14}}>
            <label style={{...lb,fontSize:13,color:C.org,fontWeight:700}}>{"💰 תוספות לחיוב"}</label>
            {extras.map((ex,i)=><div key={i} style={{display:"flex",gap:6,alignItems:"center",marginBottom:5,padding:"6px 8px",background:"#fff7ed",borderRadius:8,border:"1px solid "+C.org}}>
              <button onClick={()=>remExtra(i)} style={{background:"none",border:"none",color:C.red,fontSize:14,cursor:"pointer",padding:0,fontFamily:"inherit"}}>{"✕"}</button>
              <input value={ex.desc||""} onChange={e=>updExtra(i,"desc",e.target.value)} placeholder={"מה נעשה?"} style={{flex:2,padding:"7px 10px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:12,fontFamily:"inherit"}}/>
              <input value={ex.qty||""} onChange={e=>updExtra(i,"qty",e.target.value)} placeholder={"כמות (לא חובה)"} style={{flex:1,padding:"7px 10px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:12,fontFamily:"inherit"}}/>
            </div>)}
            <button onClick={addExtra} style={{width:"100%",padding:"8px",borderRadius:8,border:"1px dashed "+C.org,background:"#fff",color:C.org,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"+ תוספת לחיוב"}</button>
          </div>

          {/* Equipment from warehouse */}
          <div style={{marginBottom:14}}>
            <label style={{...lb,fontSize:13,color:C.red,fontWeight:700}}>{"📦 ציוד שנלקח מהמחסן לאתר"}</label>
            <div style={{fontSize:10,color:C.txtM,marginBottom:6,textAlign:"right"}}>{"ירד מהמלאי + ייכנס לחיוב הלקוח אוטומטית"}</div>
            {equipment.map((eq,i)=>{
              const selItem=eqItems.find(x=>x.id===eq.itemId);
              const stockQty=eq.itemId?getEqQty(eq.itemId):0;
              return <div key={i} style={{display:"flex",gap:6,alignItems:"center",marginBottom:5,padding:"7px 8px",background:"#fee",borderRadius:8,border:"1px solid "+C.red}}>
                <button onClick={()=>{const ne=[...equipment];ne.splice(i,1);setForm({...form,logEquipment:ne});}} style={{background:"none",border:"none",color:C.red,fontSize:14,cursor:"pointer",padding:0,fontFamily:"inherit"}}>{"✕"}</button>
                <select value={eq.itemId||""} onChange={e=>{const ne=[...equipment];ne[i]={...ne[i],itemId:e.target.value};setForm({...form,logEquipment:ne});}} style={{flex:2,padding:"7px 8px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:11,fontFamily:"inherit",direction:"rtl"}}>
                  <option value="">{"-- בחר פריט --"}</option>
                  {eqCats.map(c=>{
                    const catItems=eqItems.filter(it=>it.category===c);
                    if(catItems.length===0)return null;
                    const catLabel={connectors:"🔌 מחברים",pipes:"🚰 צינורות",sprinklers:"💦 ממטירים",headsys:"⚙️ ראשי מערכת",spray:"🧪 ריסוס",consumables:"🛠 חומרים"}[c];
                    return <optgroup key={c} label={catLabel}>
                      {catItems.map(it=><option key={it.id} value={it.id}>{it.name+" (במלאי: "+getEqQty(it.id)+")"}</option>)}
                    </optgroup>;
                  })}
                </select>
                <input type="number" value={eq.qty||""} onChange={e=>{const ne=[...equipment];ne[i]={...ne[i],qty:e.target.value};setForm({...form,logEquipment:ne});}} placeholder="כמות" style={{width:60,padding:"7px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:12,textAlign:"center",fontFamily:"inherit"}}/>
                {selItem && +eq.qty>stockQty && <span style={{fontSize:9,color:C.red,fontWeight:700,whiteSpace:"nowrap"}}>{"⚠️ חורג"}</span>}
              </div>;
            })}
            <button onClick={()=>setForm({...form,logEquipment:[...equipment,{itemId:"",qty:""}]})} style={{width:"100%",padding:"8px",borderRadius:8,border:"1px dashed "+C.red,background:"#fff",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"+ הוסף פריט מהמחסן"}</button>
          </div>

          {/* 3. Reminders */}
          <div style={{marginBottom:14}}>
            <label style={{...lb,fontSize:13,color:C.blu,fontWeight:700}}>{"🔔 תזכורות לביקור הבא"}</label>
            {reminders.map((rm,i)=><div key={i} style={{display:"flex",gap:6,alignItems:"center",marginBottom:5,padding:"6px 8px",background:C.bluB,borderRadius:8,border:"1px solid "+C.blu}}>
              <button onClick={()=>remRem(i)} style={{background:"none",border:"none",color:C.red,fontSize:14,cursor:"pointer",padding:0,fontFamily:"inherit"}}>{"✕"}</button>
              <input value={rm.text||""} onChange={e=>updRem(i,e.target.value)} placeholder={"מה לבדוק / להביא בפעם הבאה?"} style={{flex:1,padding:"7px 10px",borderRadius:6,border:"1px solid "+C.bdr,fontSize:12,fontFamily:"inherit"}}/>
            </div>)}
            <button onClick={addRem} style={{width:"100%",padding:"8px",borderRadius:8,border:"1px dashed "+C.blu,background:"#fff",color:C.blu,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"+ תזכורת"}</button>
          </div>

          <button onClick={saveLog} style={{width:"100%",padding:14,borderRadius:12,border:"none",background:C.grn,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"💾 שמור"}</button>
        </div>
      </div></div>;
    }


    // ─── ADD BULK ORDER (supermarket-style picker) ───
    if(modal==="addBulkOrder"){
      const items=form.bulkItems||[];
      const inv=data.inventory||[];
      // Group inventory by category
      const byCat={};
      INV_CATS.forEach(c=>{byCat[c.id]={cat:c,items:[]};});
      inv.forEach(it=>{if(byCat[it.category])byCat[it.category].items.push(it);});

      // Add or merge item to cart
      const addToCart=(invItem,size,qty)=>{
        qty=+qty||1;
        const desc=size?invItem.name+" - "+size:invItem.name;
        // Check if same item+size already in cart, merge quantities
        const existingIdx=items.findIndex(it=>it.invItemId===invItem.id && it.size===size);
        if(existingIdx>=0){
          const newItems=[...items];
          newItems[existingIdx]={...newItems[existingIdx],qty:(+newItems[existingIdx].qty||1)+qty};
          setForm({...form,bulkItems:newItems,sizeModalFor:null});
        } else {
          // If prelocked to a site, auto-assign
          const preAssign=form.bulkPrelocked?{assignType:form.bulkPrelockedType||"project",projectId:form.bulkPrelockedSiteId||"",freeText:""}:{assignType:"project",projectId:"",freeText:""};
          setForm({...form,bulkItems:[...items,{invItemId:invItem.id,name:invItem.name,size,qty,desc,amount:invItem.defaultPrice||"",...preAssign}],sizeModalFor:null});
        }
      };
      const removeFromCart=(idx)=>{setForm({...form,bulkItems:items.filter((_,i)=>i!==idx)});};
      const updateCartItem=(idx,field,val)=>{const newItems=[...items];newItems[idx]={...newItems[idx],[field]:val};setForm({...form,bulkItems:newItems});};
      const incQty=(idx,delta)=>{const newItems=[...items];const cur=+newItems[idx].qty||1;newItems[idx]={...newItems[idx],qty:Math.max(1,cur+delta)};setForm({...form,bulkItems:newItems});};
      const total=items.reduce((s,it)=>s+((+it.amount||0)*(+it.qty||1)),0);
      const totalQty=items.reduce((s,it)=>s+(+it.qty||1),0);
      const assignAllToProject=(targetType,targetId,targetText)=>{setForm({...form,bulkAssignAll:targetType+":"+(targetId||""),bulkAssignAllText:targetText||"",bulkItems:items.map(it=>({...it,assignType:targetType,projectId:targetId||"",freeText:targetText||""}))});};
      // Manual custom item add
      const addCustomItem=()=>{
        const preAssign=form.bulkPrelocked?{assignType:form.bulkPrelockedType||"project",projectId:form.bulkPrelockedSiteId||"",freeText:""}:{assignType:"project",projectId:"",freeText:""};
        setForm({...form,bulkItems:[...items,{name:"",size:"",qty:1,desc:"",amount:"",...preAssign,saveToInv:false,saveToCat:"shrubs"}],editingIdx:items.length});
      };
      // Save custom items to inventory (called before saving the order)
      const saveCustomItemsToInventory=(d)=>{
        if(!d.inventory)d.inventory=[];
        items.forEach(it=>{
          if(!it.invItemId && it.saveToInv && it.name && it.name.trim()){
            const exists=d.inventory.some(inv=>(inv.name||"").trim().toLowerCase()===it.name.trim().toLowerCase());
            if(!exists){
              d.inventory.push({id:uid(),name:it.name.trim(),category:it.saveToCat||"shrubs"});
            }
          }
        });
      };
      // Step: 1=pick items, 2=details (project/supplier/save)
      const step=form.bulkStep||1;
      const setStep=(s)=>setForm({...form,bulkStep:s});
      // Save handler
      const saveBulkOrderEnhanced=()=>{
        // Validate: each item must have a destination
        const validItems=items.filter(it=>{
          if(!(it.desc||it.name))return false;
          const t=it.assignType||"project";
          if(t==="project"||t==="maintenance")return !!it.projectId;
          if(t==="test")return true;
          if(t==="free")return !!(it.freeText||"").trim();
          return false;
        });
        if(validItems.length===0)return;
        const supplier=form.bulkSupplier||"";
        const status=form.bulkStatus||"ordered";
        const date=form.bulkDate||todayISO;
        const orderNote=(form.bulkOrderNote||"").trim();
        up(d=>{
          // First save any custom items to inventory if requested
          saveCustomItemsToInventory(d);
          if(!d.projectOrders)d.projectOrders={};
          validItems.forEach(it=>{
            const t=it.assignType||"project";
            // Build destination key: real project id, maintenance site id (m1, m2), or special keys
            let destKey;
            if(t==="project"||t==="maintenance"){destKey=it.projectId;}
            else if(t==="test"){destKey="__test__";}
            else if(t==="free"){destKey="__free__";}
            if(!d.projectOrders[destKey])d.projectOrders[destKey]=[];
            const qty=+it.qty||1;
            let desc=qty>1?qty+"× "+(it.desc||it.name+(it.size?" - "+it.size:"")):(it.desc||it.name+(it.size?" - "+it.size:""));
            // Build combined note: free text (if applicable) + order note
            const parts=[];
            if(t==="free" && it.freeText)parts.push(it.freeText);
            if(orderNote)parts.push(orderNote);
            const note=parts.join(" · ");
            d.projectOrders[destKey].push({id:uid(),desc,supplier,amount:(+it.amount||0)*qty,status,date,note,assignType:t});
          });
        });
        setModal(null);setForm({});
      };

      // Size picker mini-modal (when user clicks an inventory item)
      const sizeModalItem=form.sizeModalFor;
      if(sizeModalItem){
        const cat=INV_CATS.find(c=>c.id===sizeModalItem.category);
        // Item-specific sizes override category sizes
        const sizes=(sizeModalItem.sizes && sizeModalItem.sizes.length>0)?sizeModalItem.sizes:(cat?.sizes||[]);
        const selectedSize=form.tempSize||sizes[0]||"";
        const selectedQty=+form.tempQty||1;
        // Special handler: head-system assembly with config picker
        if(sizeModalItem.isHeadSystem){
          const valves=form.tempValves||"2";
          const irrType=form.tempIrrType||"drip";
          const fert=form.tempFert||"no";
          const irrLabels={drip:"💧 טפטוף",sprinkler:"💦 המטרה",mixed:"💧💦 משולב"};
          const buildDesc=()=>{
            return "ראש מערכת "+valves+" ברזים - "+(irrType==="drip"?"טפטוף":irrType==="sprinkler"?"המטרה":"משולב")+" - "+(fert==="yes"?"עם דישון":"בלי דישון");
          };
          return <div onClick={()=>setForm({...form,sizeModalFor:null})} style={{...ov,zIndex:1100}}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:440}}>
            <h3 style={{fontSize:18,color:C.grn,marginBottom:6,textAlign:"center"}}>{"🚰 "+sizeModalItem.name}</h3>
            <div style={{fontSize:11,color:C.txtM,textAlign:"center",marginBottom:14}}>{"בנה את התצורה המתאימה"}</div>
            {/* Number of valves */}
            <div style={{marginBottom:12}}>
              <label style={lb}>{"1️⃣  כמה ברזים?"}</label>
              <div style={{display:"grid",gridTemplateColumns:"repeat(5, 1fr)",gap:6}}>
                {["1","2","3","4","6"].map(v=><button key={v} onClick={()=>setForm({...form,tempValves:v})} style={{padding:"12px 4px",borderRadius:8,border:"2px solid "+(valves===v?C.grn:C.bdr),background:valves===v?C.grnP:"#fff",color:valves===v?C.grn:C.txtM,fontSize:16,fontWeight:valves===v?700:500,cursor:"pointer",fontFamily:"inherit"}}>{v}</button>)}
              </div>
            </div>
            {/* Irrigation type */}
            <div style={{marginBottom:12}}>
              <label style={lb}>{"2️⃣  סוג השקיה?"}</label>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:6}}>
                {[{id:"drip",label:"💧 טפטוף"},{id:"sprinkler",label:"💦 המטרה"},{id:"mixed",label:"💧💦 משולב"}].map(opt=><button key={opt.id} onClick={()=>setForm({...form,tempIrrType:opt.id})} style={{padding:"10px 4px",borderRadius:8,border:"2px solid "+(irrType===opt.id?C.blu:C.bdr),background:irrType===opt.id?C.bluB:"#fff",color:irrType===opt.id?C.blu:C.txtM,fontSize:12,fontWeight:irrType===opt.id?700:500,cursor:"pointer",fontFamily:"inherit"}}>{opt.label}</button>)}
              </div>
            </div>
            {/* Fertilizer */}
            <div style={{marginBottom:14}}>
              <label style={lb}>{"3️⃣  עם דישון?"}</label>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2, 1fr)",gap:6}}>
                {[{id:"yes",label:"✅ עם דישון",col:C.grn},{id:"no",label:"❌ בלי דישון",col:C.txtM}].map(opt=><button key={opt.id} onClick={()=>setForm({...form,tempFert:opt.id})} style={{padding:"10px 4px",borderRadius:8,border:"2px solid "+(fert===opt.id?opt.col:C.bdr),background:fert===opt.id?(opt.id==="yes"?C.grnP:C.cardA):"#fff",color:fert===opt.id?opt.col:C.txtM,fontSize:13,fontWeight:fert===opt.id?700:500,cursor:"pointer",fontFamily:"inherit"}}>{opt.label}</button>)}
              </div>
            </div>
            {/* Quantity */}
            <div style={{marginBottom:14}}>
              <label style={lb}>{"כמות"}</label>
              <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"center"}}>
                <button onClick={()=>setForm({...form,tempQty:Math.max(1,selectedQty-1)})} style={{width:38,height:38,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:20,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>−</button>
                <input type="number" min="1" value={selectedQty} onChange={e=>{const v=parseInt(e.target.value)||1;setForm({...form,tempQty:Math.max(1,v)});}} onFocus={e=>e.target.select()} style={{width:80,height:46,fontSize:22,fontWeight:700,textAlign:"center",border:"2px solid "+C.grn,borderRadius:10,fontFamily:"inherit",outline:"none",background:C.grnP,color:C.grn}}/>
                <button onClick={()=>setForm({...form,tempQty:selectedQty+1})} style={{width:38,height:38,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:20,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>+</button>
              </div>
            </div>
            {/* Preview */}
            <div style={{background:C.cardA,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,fontWeight:600,color:C.txt,textAlign:"center",border:"1px dashed "+C.bdr}}>{"📋 "+buildDesc()}</div>
            <button onClick={()=>{
              const desc=buildDesc();
              const sizeStr=valves+" ברזים · "+(irrType==="drip"?"טפטוף":irrType==="sprinkler"?"המטרה":"משולב")+(fert==="yes"?" · דישון":"");
              addToCart({...sizeModalItem,name:desc},sizeStr,selectedQty);
              setForm(p=>({...p,sizeModalFor:null,tempSize:"",tempQty:1,tempValves:"2",tempIrrType:"drip",tempFert:"no"}));
            }} style={{...sb,background:C.grn}}>{"➕ הוסף לעגלה"}</button>
            <button onClick={()=>setForm({...form,sizeModalFor:null,tempSize:"",tempQty:1,tempValves:"2",tempIrrType:"drip",tempFert:"no"})} style={{width:"100%",padding:10,borderRadius:10,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:13,cursor:"pointer",fontFamily:"inherit",marginTop:6}}>{"ביטול"}</button>
          </div></div>;
        }
        return <div onClick={()=>setForm({...form,sizeModalFor:null})} style={{...ov,zIndex:1100}}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:400}}>
          <h3 style={{fontSize:18,color:C.grn,marginBottom:14,textAlign:"center"}}>{(cat?.icon||"")+" "+sizeModalItem.name}</h3>
          {sizes.length>0 && <div style={{marginBottom:14}}>
            <label style={lb}>{"גודל"}</label>
            <div style={{display:"grid",gridTemplateColumns:"repeat("+Math.min(sizes.length,5)+", 1fr)",gap:6}}>
              {sizes.map(sz=><button key={sz} onClick={()=>setForm({...form,tempSize:sz})} style={{padding:"12px 4px",borderRadius:8,border:"2px solid "+(selectedSize===sz?C.grn:C.bdr),background:selectedSize===sz?C.grnP:"#fff",color:selectedSize===sz?C.grn:C.txtM,fontSize:14,fontWeight:selectedSize===sz?700:500,cursor:"pointer",fontFamily:"inherit"}}>{sz}</button>)}
            </div>
          </div>}
          <div style={{marginBottom:14}}>
            <label style={lb}>{"כמות"}</label>
            <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"center",marginBottom:8}}>
              <button onClick={()=>setForm({...form,tempQty:Math.max(1,selectedQty-1)})} style={{width:42,height:42,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:22,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>−</button>
              <input type="number" min="1" value={selectedQty} onChange={e=>{const v=parseInt(e.target.value)||1;setForm({...form,tempQty:Math.max(1,v)});}} onFocus={e=>e.target.select()} style={{width:90,height:50,fontSize:24,fontWeight:700,textAlign:"center",border:"2px solid "+C.grn,borderRadius:10,fontFamily:"inherit",outline:"none",background:C.grnP,color:C.grn}}/>
              <button onClick={()=>setForm({...form,tempQty:selectedQty+1})} style={{width:42,height:42,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:22,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>+</button>
            </div>
            {/* Quick increment buttons for big quantities */}
            <div style={{display:"flex",gap:5,justifyContent:"center"}}>
              {[5,10,25,50,100].map(n=><button key={n} onClick={()=>setForm({...form,tempQty:selectedQty+n})} style={{flex:1,padding:"6px 4px",borderRadius:8,border:"1px solid "+C.bdr,background:C.cardA,color:C.grn,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"+"+n}</button>)}
            </div>
          </div>
          {/* Optional extra note */}
          <div style={{marginBottom:12}}>
            <label style={{...lb,fontSize:11,color:C.txtM}}>{"📝 פירוט נוסף (אופציונלי)"}</label>
            <input value={form.tempExtraNote||""} onChange={e=>setForm({...form,tempExtraNote:e.target.value})} placeholder={"הערה / מידה מיוחדת"} style={{...inp,fontSize:13,padding:"8px 12px"}}/>
          </div>
          <button onClick={()=>{
            const extraNote=(form.tempExtraNote||"").trim();
            const sizeWithNote=extraNote?(selectedSize?selectedSize+" ("+extraNote+")":extraNote):selectedSize;
            addToCart(sizeModalItem,sizeWithNote,selectedQty);
            setForm(p=>({...p,sizeModalFor:null,tempSize:"",tempQty:1,tempExtraNote:""}));
          }} style={{...sb,background:C.grn}}>{"➕ הוסף לעגלה"}</button>
          <button onClick={()=>setForm({...form,sizeModalFor:null,tempSize:"",tempQty:1,tempExtraNote:""})} style={{width:"100%",padding:10,borderRadius:10,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:13,cursor:"pointer",fontFamily:"inherit",marginTop:6}}>{"ביטול"}</button>
        </div></div>;
      }

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:560,width:"100%",padding:0,maxHeight:"94vh"}}>
        {/* Sticky header */}
        <div style={{background:C.org,color:"#fff",padding:"12px 16px",position:"sticky",top:0,zIndex:10,borderRadius:"16px 16px 0 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <button onClick={close} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:16,fontFamily:"inherit"}}>{"×"}</button>
            <div style={{textAlign:"right",flex:1,marginInlineStart:10}}>
              <div style={{fontSize:17,fontWeight:700}}>{step===1?"🛒 בחר פריטים":"📋 פרטי הזמנה"}</div>
              <div style={{fontSize:11,opacity:0.85}}>{items.length>0?(totalQty+" פריטים"+(total>0?" · ₪"+total.toLocaleString():"")):"עגלה ריקה"}</div>
              {form.bulkPrelocked && form.bulkPrelockedSiteName && <div style={{fontSize:11,opacity:0.95,marginTop:3,padding:"2px 8px",background:"rgba(255,255,255,0.2)",borderRadius:8,display:"inline-block",fontWeight:700}}>{"🎯 ל"+form.bulkPrelockedSiteName}</div>}
            </div>
          </div>
          {/* Step tabs */}
          <div style={{display:"flex",gap:4,marginTop:10}}>
            <button onClick={()=>setStep(1)} style={{flex:1,padding:"6px",borderRadius:14,border:"none",background:step===1?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:12,fontWeight:step===1?700:500,cursor:"pointer",fontFamily:"inherit"}}>{"1. פריטים"}</button>
            <button onClick={()=>{if(items.length>0)setStep(2);}} style={{flex:1,padding:"6px",borderRadius:14,border:"none",background:step===2?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:12,fontWeight:step===2?700:500,cursor:items.length>0?"pointer":"not-allowed",fontFamily:"inherit",opacity:items.length>0?1:0.5}}>{"2. שמירה"}</button>
          </div>
        </div>

        <div style={{padding:"14px 16px",overflowY:"auto",maxHeight:"calc(94vh - 110px)"}}>
          {/* STEP 1: Pick items */}
          {step===1 && <div>
            {/* Cart preview */}
            {items.length>0 && <div style={{background:C.grnP,borderRadius:10,padding:10,marginBottom:14,border:"1px solid "+C.grn}}>
              <div style={{fontSize:12,fontWeight:700,color:C.grn,marginBottom:8,display:"flex",justifyContent:"space-between"}}>
                <span>{totalQty+" פריטים"}</span>
                <span>{"🛒 בעגלה"}</span>
              </div>
              {items.map((it,i)=><div key={i} style={{background:"#fff",borderRadius:6,padding:"6px 8px",marginBottom:4,fontSize:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <span onClick={()=>removeFromCart(i)} style={{cursor:"pointer",color:C.red,fontSize:14,marginInlineEnd:4}}>{"✕"}</span>
                  <button onClick={()=>incQty(i,-1)} style={{width:24,height:24,borderRadius:"50%",border:"1px solid "+C.bdr,background:"#fff",fontSize:12,cursor:"pointer",fontWeight:700,fontFamily:"inherit"}}>−</button>

              if(searchQ && catItems.length===0)return null;

              // Special: connectors use 2-step subgroup navigation (when not searching)
              const useSubgroups=cat.id==="connectors" && !searchQ && allCatItems.some(it=>it.subgroup);

              if(useSubgroups){
                // Build unique subgroups
                const subgroupsMap={};
                allCatItems.forEach(it=>{
                  const sg=it.subgroup||"אחר";

                  subgroupsMap[sg].items.push(it);

                // Count items in cart per subgroup
                Object.values(subgroupsMap).forEach(sg=>{

              {form.bulkAllType==="project" && <select value={form.bulkAllId||""} onChange={e=>setForm({...form,bulkAllId:e.target.value})} style={{...inp,fontSize:13,padding:"8px 12px",marginBottom:6}}>

              {form.bulkAllType==="maintenance" && <select value={form.bulkAllId||""} onChange={e=>setForm({...form,bulkAllId:e.target.value})} style={{...inp,fontSize:13,padding:"8px 12px",marginBottom:6}}>

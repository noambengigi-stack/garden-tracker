          {/* TASKS */}
          {siteDetailTab==="tasks" && <div>
            <button onClick={()=>{setForm({notes:"",siteId:site.id,type:site.type,image:"",taskDate:todayISO});setModal("addTask");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.grn,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ משימה חדשה"}</button>
            {siteTasks.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין משימות"}</div>}
            {siteTasks.map(t=><div key={t.id} style={{padding:"10px 12px",borderRadius:8,background:t.status==="done"?C.grnP:C.cardA,marginBottom:6,border:"1px solid "+(t.status==="done"?C.grnL:C.bdr)}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span onClick={()=>togTask(t.date,t.id)} style={{fontSize:22,cursor:"pointer"}}>{t.status==="done"?"✅":"⬜"}</span>
                <span onClick={()=>confirmDel(t.notes||"משימה זו",()=>delTask(t.date,t.id))} style={{fontSize:12,color:C.red,cursor:"pointer"}}>🗑</span>
                <div style={{flex:1,textAlign:"right",fontSize:13}}>
                  <div style={{fontWeight:500,textDecoration:t.status==="done"?"line-through":"none"}}>{t.notes}</div>
                  <div style={{fontSize:10,color:C.txtM}}>{fmtFull(t.date)}</div>
                </div>
                {t.image && <img src={t.image} onClick={()=>setZoomImg(t.image)} style={{width:36,height:36,objectFit:"cover",borderRadius:5,cursor:"pointer"}} alt=""/>}
              </div>
              {t.status==="done" && !t.billable && <button onClick={()=>{setForm({taskDay:t.date,taskId:t.id,extras:""});setModal("billingForm");}} style={{marginTop:6,width:"100%",padding:"6px",borderRadius:6,border:"1px solid "+C.org,background:"#fff3cd",color:C.org,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"💰 שלח לחיוב"}</button>}
              {t.billable==="ready" && <div style={{marginTop:6,fontSize:11,color:C.org,fontWeight:700}}>{"💰 מוכן לחיוב"+(t.billingExtras?" · "+t.billingExtras:"")}</div>}
              {t.billable==="invoiced" && <div style={{marginTop:6,fontSize:11,color:C.grn,fontWeight:700}}>{"✓ חויב"}</div>}
            </div>)}
          </div>}

          {/* PHOTOS */}
          {siteDetailTab==="photos" && <div>
            <button onClick={()=>{setExpImg(null);setExpStep(0);setForm({siteId:site.id,photoType:""});setModal("quickPhoto");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.hdr,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"📷 הוסף תמונה"}</button>
            {sitePhotos.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין תמונות"}</div>}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:6}}>
              {sitePhotos.map(p=><div key={p.id} onClick={()=>setZoomImg(p)} style={{position:"relative",cursor:"pointer"}}>
                <img src={p.image} style={{width:"100%",aspectRatio:"1",objectFit:"cover",borderRadius:8}} alt=""/>
                {p.photoType && <span style={{position:"absolute",top:4,right:4,padding:"1px 5px",borderRadius:5,fontSize:8,fontWeight:700,background:p.photoType==="before"?"#fff3cd":"#d8f3dc",color:p.photoType==="before"?C.org:C.grn}}>{p.photoType==="before"?"לפני":"אחרי"}</span>}
              </div>)}
            </div>
          </div>}

          {/* ORDERS */}
          {siteDetailTab==="orders" && isDev && <div>
            <button onClick={()=>{setForm({bulkSupplier:"",bulkStatus:"ordered",bulkDate:todayISO,bulkOrderNote:"",bulkItems:[],bulkStep:1,bulkAllType:"project",bulkAllId:site.id,bulkAllText:"",bulkPrelocked:true,bulkPrelockedSiteId:site.id,bulkPrelockedSiteName:site.name,bulkPrelockedType:"project"});setModal("addBulkOrder");}} style={{width:"100%",padding:14,borderRadius:12,border:"none",background:C.org,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:8,boxShadow:"0 2px 4px rgba(0,0,0,0.08)"}}>{"🛒 הזמנה חדשה ל"+site.name}</button>
            <button onClick={()=>{setForm({orderProjectId:site.id,orderDesc:"",orderSupplier:"",orderAmount:"",orderStatus:"ordered",orderNote:""});setModal("addOrder");}} style={{width:"100%",padding:8,borderRadius:8,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ הזמנה ידנית מהירה (טקסט חופשי)"}</button>
            {siteOrders.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין הזמנות"}</div>}
            <div style={{fontSize:12,color:C.txtM,marginBottom:8,textAlign:"center"}}>{"סה\"כ הוצאות: ₪"+siteOrders.reduce((s,o)=>s+(+o.amount||0),0).toLocaleString()}</div>
            {siteOrders.map(o=>{
              const statusInfo=o.status==="received"?{ic:"✅",label:"התקבל",col:C.grn,bg:C.grnP}:o.status==="onway"?{ic:"🚛",label:"בדרך",col:C.org,bg:C.orgB}:{ic:"📞",label:"הוזמן",col:C.txtM,bg:C.cardA};
              return <div key={o.id} style={{background:"#fff",borderRadius:10,padding:"10px 12px",marginBottom:6,border:"1px solid "+C.bdr}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                  <span style={{padding:"2px 8px",borderRadius:8,fontSize:10,fontWeight:700,background:statusInfo.bg,color:statusInfo.col}}>{statusInfo.ic+" "+statusInfo.label}</span>
                  <span style={{fontWeight:700,fontSize:14,textAlign:"right",flex:1,marginRight:8}}>{o.desc}</span>
                </div>
                <div style={{fontSize:11,color:C.txtM,marginBottom:6}}>{(o.supplier?"👤 "+o.supplier+" · ":"")+"₪"+(+o.amount||0).toLocaleString()+" · "+fmtFull(o.date)}</div>
                {o.note && <div style={{fontSize:11,color:C.txtM,padding:"4px 8px",background:C.cardA,borderRadius:5,marginBottom:6}}>{o.note}</div>}
                <div style={{display:"flex",gap:4}}>
                  {o.status!=="ordered" && <button onClick={()=>upOrderStatus(site.id,o.id,"ordered")} style={{flex:1,padding:5,borderRadius:6,border:"1px solid "+C.bdr,background:"#fff",fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"📞 הוזמן"}</button>}
                  {o.status!=="onway" && <button onClick={()=>upOrderStatus(site.id,o.id,"onway")} style={{flex:1,padding:5,borderRadius:6,border:"1px solid "+C.bdr,background:"#fff",fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"🚛 בדרך"}</button>}
                  {o.status!=="received" && <button onClick={()=>upOrderStatus(site.id,o.id,"received")} style={{flex:1,padding:5,borderRadius:6,border:"1px solid "+C.grn,background:C.grnP,color:C.grn,fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>{"✅ התקבל"}</button>}
                  <button onClick={()=>confirmDel("הזמנה זו",()=>delOrder(site.id,o.id))} style={{padding:"5px 8px",borderRadius:6,border:"1px solid "+C.red,background:"#fff",color:C.red,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"🗑"}</button>
                </div>
              </div>;
            })}
          </div>}

          {/* BILLING */}
          {siteDetailTab==="billing" && <div>
            <button onClick={()=>{setForm({extraSiteId:site.id,extraAmount:"",extraDesc:"",extraDate:todayISO});setModal("addBillingExtra");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.org,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ תוספת לחיוב"}</button>

            {/* Pending bills (tasks) */}
            {siteTasks.filter(t=>t.billable==="ready").length>0 && <div style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.org}}>{"💰 משימות מוכנות לחיוב"}</div>
              {siteTasks.filter(t=>t.billable==="ready").map(t=><div key={t.id} style={{padding:"10px 12px",borderRadius:8,background:"#fff3cd",marginBottom:6,border:"1px solid "+C.org}}>
                <div style={{fontWeight:700,fontSize:13}}>{t.notes}</div>
                <div style={{fontSize:10,color:C.txtM,marginTop:2}}>{fmtFull(t.date)+(t.billingExtras?" · "+t.billingExtras:"")}</div>
                <button onClick={()=>markInvoiced(t.date,t.id)} style={{marginTop:6,padding:"4px 10px",borderRadius:6,border:"none",background:C.org,color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"✓ סמן כחויב"}</button>
              </div>)}
            </div>}

            {/* Extras */}
            {siteExtras.length>0 && <div style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.org}}>{"📌 תוספות לחיוב"}</div>
              <div style={{fontSize:11,color:C.txtM,marginBottom:6}}>{"לא חויב: ₪"+siteExtras.filter(e=>!e.invoiced).reduce((s,e)=>s+(+e.amount||0),0).toLocaleString()+" · חויב: ₪"+siteExtras.filter(e=>e.invoiced).reduce((s,e)=>s+(+e.amount||0),0).toLocaleString()}</div>
              {siteExtras.map(e=><div key={e.id} style={{padding:"10px 12px",borderRadius:8,background:e.invoiced?C.grnP:"#fff3cd",marginBottom:6,border:"1px solid "+(e.invoiced?C.grnL:C.org)}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontWeight:700,color:e.invoiced?C.grn:C.org}}>{"₪"+(+e.amount).toLocaleString()}</span>
                  <span style={{fontSize:13}}>{e.desc||"תוספת"}</span>
                </div>
                <div style={{fontSize:10,color:C.txtM,marginTop:2}}>{fmtFull(e.date)}</div>
                <div style={{display:"flex",gap:4,marginTop:6}}>
                  <button onClick={()=>togExtraInvoiced(e.id)} style={{flex:1,padding:5,borderRadius:6,border:"none",background:e.invoiced?C.cardA:C.org,color:e.invoiced?C.txt:"#fff",fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>{e.invoiced?"בטל חיוב":"סמן חויב ✓"}</button>
                  <button onClick={()=>confirmDel(e.desc||"תוספת",()=>delExtra(e.id))} style={{padding:"5px 8px",borderRadius:6,border:"1px solid "+C.red,background:"#fff",color:C.red,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{"🗑"}</button>
                </div>
              </div>)}
            </div>}

            {/* Invoiced history */}
            {siteTasks.filter(t=>t.billable==="invoiced").length>0 && <div>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.grn}}>{"✓ חויבו ("+siteTasks.filter(t=>t.billable==="invoiced").length+")"}</div>
              {siteTasks.filter(t=>t.billable==="invoiced").map(t=><div key={t.id} style={{padding:"6px 10px",borderRadius:6,background:C.grnP,marginBottom:4,fontSize:11}}>
                <div style={{fontWeight:600}}>{t.notes}</div>
                <div style={{fontSize:9,color:C.txtM}}>{fmtFull(t.date)}</div>
              </div>)}
            </div>}
          </div>}

          {/* MEETINGS */}
          {siteDetailTab==="meetings" && <div>
            <button onClick={()=>{setForm({meetingSiteId:site.id,meetingDate:todayISO,meetingTime:"",meetingNotes:""});setModal("addMeeting");}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:C.purp,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{"+ פגישה חדשה"}</button>
            {siteMeetings.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין פגישות"}</div>}
            {siteMeetings.map(m=><div key={m.id} style={{padding:"10px 12px",borderRadius:8,background:m.done?C.grnP:C.purpB,marginBottom:6,border:"1px solid "+(m.done?C.grnL:C.purp)}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span onClick={()=>togMeeting(m.id)} style={{fontSize:20,cursor:"pointer"}}>{m.done?"✅":"⬜"}</span>
                <span style={{fontWeight:700,fontSize:13}}>{fmtFull(m.date)+(m.time?" · "+m.time:"")}</span>
              </div>
              {m.notes && <div style={{fontSize:12,color:C.txtM,padding:"4px 8px",background:"#fff",borderRadius:5}}>{m.notes}</div>}
            </div>)}
          </div>}
        </div>
      </div></div>;
    }

    // ─── BILLING LIST (all sites) ───
    if(modal==="billingList"){
      const items=[];
      Object.keys(data.dailyTasks||{}).forEach(d=>{(data.dailyTasks[d]||[]).forEach(t=>{if(t.billable==="ready")items.push({...t,date:d});});});
      const extras=(data.billingExtras||[]).filter(e=>!e.invoiced);
      // Group by site
      const grouped={};
      items.forEach(t=>{const k=t.siteId||"_none";if(!grouped[k])grouped[k]={tasks:[],extras:[]};grouped[k].tasks.push(t);});
      extras.forEach(e=>{const k=e.siteId||"_none";if(!grouped[k])grouped[k]={tasks:[],extras:[]};grouped[k].extras.push(e);});

      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:520}}>
        <h3 style={{fontSize:18,color:C.org,marginBottom:14,textAlign:"center"}}>{"💰 מוכנות לחיוב"}</h3>
        {Object.keys(grouped).length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין משימות מוכנות"}</div>}
        {Object.entries(grouped).map(([sid,{tasks,extras}])=>{
          const siteName=sid==="_none"?"ללא לקוח":sn(sid);
          const total=tasks.length+extras.length;
          if(total===0)return null;
          return <div key={sid} style={{background:"#fff",borderRadius:10,padding:12,marginBottom:10,border:"2px solid "+C.org}}>
            <div style={{fontWeight:700,fontSize:15,marginBottom:8,color:C.org}}>{siteName+" ("+total+")"}</div>
            {tasks.map(t=><div key={t.id} style={{padding:"8px 10px",borderRadius:6,marginBottom:4,background:"#fff3cd",fontSize:12}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <span style={{fontSize:10,color:C.txtL}}>{fmtFull(t.date)}</span>
                <span style={{fontWeight:600}}>{t.notes}</span>
              </div>
              {t.billingExtras && <div style={{fontSize:10,color:C.txtM,marginTop:2}}>{"📌 "+t.billingExtras}</div>}
              <button onClick={()=>markInvoiced(t.date,t.id)} style={{marginTop:4,padding:"3px 8px",borderRadius:4,border:"none",background:C.org,color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"✓ חויב"}</button>
            </div>)}
            {extras.map(e=><div key={e.id} style={{padding:"8px 10px",borderRadius:6,marginBottom:4,background:"#fff3cd",fontSize:12}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <span style={{fontWeight:700,color:C.org}}>{"₪"+(+e.amount).toLocaleString()}</span>
                <span>{e.desc||"תוספת"}</span>
              </div>
              <button onClick={()=>togExtraInvoiced(e.id)} style={{marginTop:4,padding:"3px 8px",borderRadius:4,border:"none",background:C.org,color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"✓ חויב"}</button>
            </div>)}
          </div>;
        })}
      </div></div>;
    }

    // ─── MEETINGS LIST ───
    if(modal==="meetingsList"){
      const upcoming=(data.meetings||[]).filter(m=>!m.done).sort((a,b)=>a.date.localeCompare(b.date));
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:500}}>
        <h3 style={{fontSize:18,color:C.purp,marginBottom:14,textAlign:"center"}}>{"📅 פגישות קרובות"}</h3>
        {upcoming.length===0 && <div style={{textAlign:"center",color:C.txtL,padding:20}}>{"אין פגישות"}</div>}
        {upcoming.map(m=><div key={m.id} style={{padding:"12px 14px",borderRadius:10,marginBottom:8,background:C.purpB,border:"1px solid "+C.purp}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span onClick={()=>togMeeting(m.id)} style={{fontSize:20,cursor:"pointer"}}>{"⬜"}</span>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:700,fontSize:14}}>{fmtFull(m.date)+(m.time?" · "+m.time:"")}</div>
              <div style={{fontSize:12,color:C.purp}}>{meetingLabel(m)}</div>
            </div>
          </div>
          {m.notes && <div style={{fontSize:12,color:C.txtM,padding:"6px 8px",background:"#fff",borderRadius:5,marginTop:4}}>{m.notes}</div>}
        </div>)}
      </div></div>;
    }

    // ─── ADD TASK ───
    if(modal==="addTask")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.grn,marginBottom:14}}>{"משימה חדשה"}</h3>
      <div style={{marginBottom:12}}><label style={lb}>{"תיאור"}</label><input value={form.notes||""} onChange={e=>setForm({...form,notes:e.target.value})} onKeyDown={e=>e.key==="Enter"&&saveTask()} placeholder={"מה צריך?"} style={inp} autoFocus/></div>
      <div style={{marginBottom:12}}><label style={lb}>{"תאריך"}</label><input type="date" value={form.taskDate||selISO} onChange={e=>setForm({...form,taskDate:e.target.value})} style={inp}/></div>
      <div style={{marginBottom:12}}><label style={lb}>{"לקוח / אתר (אופציונלי)"}</label>
        <select value={form.siteId||""} onChange={e=>setForm({...form,siteId:e.target.value,type:allSites.find(s=>s.id===e.target.value)?.type||""})} style={inp}>
          <option value="">{"ללא"}</option>{allSites.map(s=><option key={s.id} value={s.id}>{(s.type==="m"?"🔧 ":"🌱 ")+s.name}</option>)}
        </select>
      </div>
      <div style={{marginBottom:14}}>
        <label style={lb}>{"תמונה (אופציונלי)"}</label>
        {form.image ? <div style={{position:"relative"}}>
          <img src={form.image} style={{width:"100%",borderRadius:10,maxHeight:200,objectFit:"cover"}} alt=""/>
          <button onClick={()=>setForm(p=>({...p,image:""}))} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.6)",color:"#fff",border:"none",borderRadius:"50%",width:26,height:26,cursor:"pointer",fontSize:14}}>×</button>
        </div> : <div style={{display:"flex",gap:6}}>
          <label style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px",borderRadius:10,border:"2px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:13,cursor:"pointer",fontWeight:600}}>
            <span style={{fontSize:18}}>📷</span>{"מצלמה"}
            <input type="file" accept="image/*" capture="environment" onChange={handleAnyImg(img=>setForm(p=>({...p,image:img})))} style={{display:"none"}}/>
          </label>
          <label style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px",borderRadius:10,border:"2px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:13,cursor:"pointer",fontWeight:600}}>
            <span style={{fontSize:18}}>🖼️</span>{"גלריה"}
            <input type="file" accept="image/*" onChange={handleAnyImg(img=>setForm(p=>({...p,image:img})))} style={{display:"none"}}/>
          </label>
        </div>}
      </div>
      <button onClick={saveTask} style={sb}>{"שמור"}</button>
    </div></div>;

    // ─── EDIT TASK ───
    if(modal==="editTask")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.blu,marginBottom:14}}>{"✏️ ערוך משימה"}</h3>
      <div style={{marginBottom:12}}><label style={lb}>{"תיאור"}</label><input value={form.notes||""} onChange={e=>setForm({...form,notes:e.target.value})} onKeyDown={e=>e.key==="Enter"&&editTask()} style={inp} autoFocus/></div>
      <div style={{marginBottom:12}}><label style={lb}>{"לקוח / אתר"}</label>
        <select value={form.siteId||""} onChange={e=>setForm({...form,siteId:e.target.value})} style={inp}>
          <option value="">{"ללא"}</option>{allSites.map(s=><option key={s.id} value={s.id}>{(s.type==="m"?"🔧 ":"🌱 ")+s.name}</option>)}
        </select>
      </div>
      <div style={{marginBottom:14}}>
        <label style={lb}>{"תמונה"}</label>
        {form.image ? <div style={{position:"relative"}}>
          <img src={form.image} style={{width:"100%",borderRadius:10,maxHeight:200,objectFit:"cover"}} alt=""/>
          <button onClick={()=>setForm(p=>({...p,image:""}))} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.6)",color:"#fff",border:"none",borderRadius:"50%",width:26,height:26,cursor:"pointer",fontSize:14}}>×</button>
        </div> : <div style={{display:"flex",gap:6}}>
          <label style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px",borderRadius:10,border:"2px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:13,cursor:"pointer",fontWeight:600}}>
            <span style={{fontSize:18}}>📷</span>{"מצלמה"}
            <input type="file" accept="image/*" capture="environment" onChange={handleAnyImg(img=>setForm(p=>({...p,image:img})))} style={{display:"none"}}/>
          </label>
          <label style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px",borderRadius:10,border:"2px dashed "+C.bdr,background:C.cardA,color:C.txtM,fontSize:13,cursor:"pointer",fontWeight:600}}>
            <span style={{fontSize:18}}>🖼️</span>{"גלריה"}
            <input type="file" accept="image/*" onChange={handleAnyImg(img=>setForm(p=>({...p,image:img})))} style={{display:"none"}}/>
          </label>
        </div>}
      </div>
      <button onClick={editTask} style={{...sb,background:C.blu}}>{"שמור שינויים"}</button>
    </div></div>;

    }

    // ─── COMPLETE SUB ───
    if(modal==="completeSub"){
      const sub=(data.subContracts||[]).find(s=>s.id===form.subId);
      if(!sub)return null;
      const adjustCount=(n)=>setForm(p=>({...p,subWorkerCount:Math.max(1,(p.subWorkerCount||1)+n)}));
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={{...bx,maxWidth:500}}>
        <h3 style={{fontSize:18,color:C.blu,marginBottom:14,textAlign:"center"}}>{"✓ פרטי ביצוע"}</h3>
        <div style={{marginBottom:12}}>
          <label style={lb}>{"כמה עובדים"}</label>
          <div style={{display:"flex",alignItems:"center",gap:10,justifyContent:"center"}}>
            <button onClick={()=>adjustCount(-1)} style={{width:36,height:36,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:18,cursor:"pointer",fontWeight:700}}>−</button>
            <span style={{fontSize:22,fontWeight:700,minWidth:40,textAlign:"center"}}>{form.subWorkerCount||1}</span>
            <button onClick={()=>adjustCount(1)} style={{width:36,height:36,borderRadius:"50%",border:"1px solid "+C.bdr,background:C.wht,fontSize:18,cursor:"pointer",fontWeight:700}}>+</button>
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={lb}>{"שעות"}</label>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input type="time" value={form.subFrom||dStart()} onChange={e=>setForm({...form,subFrom:e.target.value})} style={{...inp,flex:1}}/>
            <span>{"עד"}</span>
            <input type="time" value={form.subTo||dEnd()} onChange={e=>setForm({...form,subTo:e.target.value})} style={{...inp,flex:1}}/>
          </div>
        </div>
        <div style={{marginBottom:14}}><label style={lb}>{"הערות"}</label><textarea value={form.subNotes||""} onChange={e=>setForm({...form,subNotes:e.target.value})} style={{...inp,minHeight:60}}/></div>
        <button onClick={completeSub} style={{...sb,background:C.grn}}>{"✓ שמור"}</button>
      </div></div>;
    }

    // ─── CONFIRM DELETE SUB ───
    if(modal==="confirmDelSub"){
      const sub=(data.subContracts||[]).find(s=>s.id===form.subId);
      if(!sub)return null;
      const dateKey=form.subDate||todayISO;
      const multipleDates=(sub.dates||[]).length>1;
      return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
        <h3 style={{fontSize:17,color:C.red,textAlign:"center",marginBottom:14}}>{"🗑 מחק "+sub.name+"?"}</h3>
        {multipleDates ? <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button onClick={()=>{removeSubFromDay(form.subId,dateKey);setModal(null);setForm({});}} style={{padding:"14px",borderRadius:10,border:"2px solid "+C.org,background:"#fff",color:C.org,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"רק היום הזה"}</button>
          <button onClick={()=>{delSub(form.subId);setModal(null);setForm({});}} style={{padding:"14px",borderRadius:10,border:"2px solid "+C.red,background:C.red,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"מחק הכל"}</button>
          <button onClick={close} style={{padding:"10px",borderRadius:10,border:"1px solid "+C.bdr,background:"#fff",color:C.txtM,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{"ביטול"}</button>
        </div> : <div style={{display:"flex",gap:8}}>
          <button onClick={close} style={{flex:1,padding:"12px",borderRadius:10,border:"1px solid "+C.bdr,background:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"ביטול"}</button>
          <button onClick={()=>{delSub(form.subId);setModal(null);setForm({});}} style={{flex:1,padding:"12px",borderRadius:10,border:"none",background:C.red,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"מחק"}</button>
        </div>}
      </div></div>;
    }

    // ─── ADD SITE QUICK ───
    if(modal==="addSiteQuick")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.grn,marginBottom:14}}>{"הוסף אתר / פרויקט"}</h3>
      <div style={{marginBottom:10}}><input value={form.newSiteName||""} onChange={e=>setForm({...form,newSiteName:e.target.value})} placeholder={"שם"} style={inp}/></div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>{if(!(form.newSiteName||"").trim())return;up(d=>{d.devSites=[...(d.devSites||[]),{id:uid(),name:form.newSiteName.trim(),deadline:"",status:"active"}];});setForm({});setModal(null);}} style={{flex:1,...sb,background:C.blu}}>{"🌱 פרויקט"}</button>
        <button onClick={()=>{if(!(form.newSiteName||"").trim())return;up(d=>{d.maintenanceSites=[...(d.maintenanceSites||[]),{id:uid(),name:form.newSiteName.trim(),frequency:"כל שבוע"}];});setForm({});setModal(null);}} style={{flex:1,...sb,background:C.org}}>{"🔧 תחזוקה"}</button>
      </div>
    </div></div>;

    // ─── RESET ───
    if(modal==="reset")return <div onClick={close} style={ov}><div onClick={e=>e.stopPropagation()} style={bx}>
      <h3 style={{fontSize:17,color:C.red,textAlign:"center",marginBottom:10}}>{"⚠️ למחוק הכל?"}</h3>
      <div style={{display:"flex",gap:8}}>
        <button onClick={async()=>{await save({...INIT});setData({...INIT});setModal(null);}} style={{flex:1,padding:14,borderRadius:10,border:"none",background:C.red,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"כן"}</button>
        <button onClick={close} style={{flex:1,padding:14,borderRadius:10,border:"1px solid "+C.bdr,background:C.wht,fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"לא"}</button>
      </div>
    </div></div>;

    return null;
  };

  // ZOOM IMAGE OVERLAY
  const zoomOverlay = zoomImg && <div onClick={()=>setZoomImg(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2000,padding:20}}>
    <button onClick={()=>setZoomImg(null)} style={{position:"absolute",top:20,right:20,background:"rgba(255,255,255,0.2)",color:"#fff",border:"none",width:40,height:40,borderRadius:"50%",fontSize:20,cursor:"pointer",fontFamily:"inherit"}}>{"×"}</button>
    <img src={typeof zoomImg==="string"?zoomImg:zoomImg.image} style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain"}} alt=""/>
    {typeof zoomImg!=="string" && <div style={{position:"absolute",bottom:20,left:20,right:20,padding:"10px 14px",background:"rgba(0,0,0,0.7)",color:"#fff",borderRadius:10,fontSize:13}}>
      {zoomImg.siteId && <div style={{fontWeight:700,marginBottom:4}}>{sn(zoomImg.siteId)}</div>}
      {zoomImg.photoType && <span style={{padding:"2px 8px",borderRadius:6,fontSize:11,background:zoomImg.photoType==="before"?"#fff3cd":"#d8f3dc",color:zoomImg.photoType==="before"?C.org:C.grn,marginLeft:8}}>{zoomImg.photoType==="before"?"לפני":"אחרי"}</span>}
      {zoomImg.note && <div style={{fontSize:12,marginTop:4,opacity:0.9}}>{zoomImg.note}</div>}
      {zoomImg.date && <div style={{fontSize:11,opacity:0.7,marginTop:4}}>{fmtFull(zoomImg.date)}</div>}
    </div>}
  </div>;

  return(<div style={{minHeight:"100vh",background:C.bg,fontFamily:"'Rubik',sans-serif",direction:"rtl",color:C.txt,maxWidth:480,margin:"0 auto",boxShadow:"0 0 40px rgba(0,0,0,0.08)"}}>
    {header}
    <div style={{paddingBottom:20}}>
      {cv==="monthly"&&monthlyView}
      {cv==="weekly"&&weeklyView}
      {cv==="daily"&&dailyView}
      {cv==="gallery"&&galleryView}
      {cv==="projects"&&projectsView}
      {cv==="settings"&&settingsView}
      {cv==="map"&&<MapView sites={allSites} initialSite={mapSite}/>}
    </div>
    {renderModal()}
    {zoomOverlay}
  </div>);
}

/* ═══════════ מפת מקטעים — תצלומי אוויר ═══════════ */
const SITE_COORDS=[
  {match:"כפר עציון",lat:31.6531,lng:35.1176,zoom:16},
  {match:"ראש צורים",lat:31.6644,lng:35.1231,zoom:16},
  {match:"נוקדים",lat:31.6444,lng:35.2431,zoom:16},
  {match:"כרמי צור",lat:31.6153,lng:35.1000,zoom:16},
  {match:"מגדל עוז",lat:31.6394,lng:35.1408,zoom:16},
  {match:"אלון",lat:31.8328,lng:35.3536,zoom:16},
  {match:"ביס",lat:31.6531,lng:35.1176,zoom:17},
  {match:"חצר הכפר",lat:31.6531,lng:35.1176,zoom:17},
];
const MAP_DEFAULT={lat:31.652,lng:35.15,zoom:12};
const SEC_COLORS=["#e63946","#f4a261","#e9c46a","#2a9d8f","#0077b6","#7209b7","#d81159","#588157"];
function polyAreaM2(pts){
  if(!pts||pts.length<3)return 0;
  const R=6378137;let a=0;
  for(let i=0;i<pts.length;i++){
    const p1=pts[i],p2=pts[(i+1)%pts.length];
    a+=(p2[1]-p1[1])*Math.PI/180*(2+Math.sin(p1[0]*Math.PI/180)+Math.sin(p2[0]*Math.PI/180));
  }
  return Math.abs(a*R*R/2);
}
function fmtDunam(m2){
  const d=m2/1000;
  if(d>=10)return d.toFixed(0)+" דונם";
  if(d>=1)return d.toFixed(1)+" דונם";
  return Math.round(m2)+" מ״ר";
}
function MapView({sites,initialSite}){
  const [siteId,setSiteId]=useState(initialSite||sites[0]?.id||"");
  const [store,setStore]=useState(null); // {sections:[],centers:{}}
  const [drawPts,setDrawPts]=useState(null); // null = not drawing
  const [namePanel,setNamePanel]=useState(null); // {pts,name,color}
  const [status,setStatus]=useState("");
  const [q,setQ]=useState("");
  const [searching,setSearching]=useState(false);
  const mapRef=useRef(null);
  const mapObj=useRef(null);
  const layerG=useRef(null);
  const drawG=useRef(null);
  const drawPtsRef=useRef(null);
  drawPtsRef.current=drawPts;

  const sections=(store?.sections||[]).filter(s=>s.siteId===siteId);

  // load from supabase
  useEffect(()=>{(async()=>{
    try{
      const {data}=await sb.from("app_data").select("data").eq("id","map_sections").maybeSingle();
      setStore((data&&data.data)||{sections:[],centers:{}});
    }catch(_){setStore({sections:[],centers:{}});}
  })();},[]);

  const saveStore=async(next)=>{
    setStore(next);
    setStatus("שומר…");
    try{
      await sb.from("app_data").upsert({id:"map_sections",data:next});
      setStatus("נשמר ✓");setTimeout(()=>setStatus(""),2000);
    }catch(_){setStatus("שגיאת שמירה");}
  };

  // init map once
  useEffect(()=>{
    if(!window.L||!mapRef.current||mapObj.current)return;
    const m=window.L.map(mapRef.current,{zoomControl:true,attributionControl:false}).setView([MAP_DEFAULT.lat,MAP_DEFAULT.lng],MAP_DEFAULT.zoom);
    window.L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19}).addTo(m);
    window.L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19}).addTo(m);
    layerG.current=window.L.layerGroup().addTo(m);
    drawG.current=window.L.layerGroup().addTo(m);
    m.on("click",e=>{
      if(drawPtsRef.current===null)return;
      setDrawPts(p=>[...(p||[]),[e.latlng.lat,e.latlng.lng]]);
    });
    mapObj.current=m;
    setTimeout(()=>m.invalidateSize(),100);
  },[]);

  // center on site
  useEffect(()=>{
    if(!mapObj.current||!store)return;
    const saved=store.centers?.[siteId];
    if(saved){mapObj.current.setView([saved.lat,saved.lng],saved.zoom);return;}
    const name=sites.find(s=>s.id===siteId)?.name||"";
    const hit=SITE_COORDS.find(c=>name.includes(c.match));
    if(hit)mapObj.current.setView([hit.lat,hit.lng],hit.zoom);
    // if there are sections here, fit them
    const secs=(store.sections||[]).filter(s=>s.siteId===siteId);
    if(!saved&&!hit&&secs.length>0){
      const b=window.L.latLngBounds(secs.flatMap(s=>s.pts));
      mapObj.current.fitBounds(b,{padding:[30,30]});
    }
  },[siteId,store===null]);

  // render saved polygons
  useEffect(()=>{
    if(!layerG.current||!store)return;
    layerG.current.clearLayers();
    sections.forEach(s=>{
      const poly=window.L.polygon(s.pts,{color:s.color,weight:3,fillOpacity:0.25});
      poly.bindTooltip(s.name,{permanent:true,direction:"center",className:"sec-label"});
      poly.addTo(layerG.current);
    });
  },[store,siteId]);

  // render in-progress drawing
  useEffect(()=>{
    if(!drawG.current)return;
    drawG.current.clearLayers();
    if(!drawPts)return;
    drawPts.forEach(p=>window.L.circleMarker(p,{radius:5,color:"#fff",weight:2,fillColor:"#e63946",fillOpacity:1}).addTo(drawG.current));
    if(drawPts.length>=2)window.L.polyline(drawPts,{color:"#e63946",weight:2,dashArray:"6 4"}).addTo(drawG.current);
    if(drawPts.length>=3)window.L.polygon(drawPts,{color:"#e63946",weight:1,fillOpacity:0.15}).addTo(drawG.current);
  },[drawPts]);

  const finishDraw=()=>{
    if(!drawPts||drawPts.length<3)return;
    setNamePanel({pts:drawPts,name:"",color:SEC_COLORS[sections.length%SEC_COLORS.length]});
    setDrawPts(null);
  };
  const saveSection=()=>{
    if(!namePanel||!namePanel.name.trim())return;
    const next={...store,sections:[...(store.sections||[]),{id:"sec"+Date.now(),siteId,name:namePanel.name.trim(),color:namePanel.color,pts:namePanel.pts}]};
    setNamePanel(null);
    saveStore(next);
  };
  const delSection=(id)=>{
    if(!window.confirm("למחוק את המקטע?"))return;
    saveStore({...store,sections:(store.sections||[]).filter(s=>s.id!==id)});
  };
  const zoomSection=(s)=>{
    if(!mapObj.current)return;
    mapObj.current.fitBounds(window.L.latLngBounds(s.pts),{padding:[40,40]});
  };
  const saveCenter=()=>{
    if(!mapObj.current)return;
    const c=mapObj.current.getCenter();
    saveStore({...store,centers:{...(store.centers||{}),[siteId]:{lat:c.lat,lng:c.lng,zoom:mapObj.current.getZoom()}}});
  };
  const doSearch=async()=>{
    if(!q.trim()||!mapObj.current)return;
    setSearching(true);
    try{
      const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=he&q="+encodeURIComponent(q.trim()));
      const js=await r.json();
      if(js&&js[0])mapObj.current.setView([parseFloat(js[0].lat),parseFloat(js[0].lon)],16);
      else alert("לא נמצא — נסה שם אחר או הוסף 'ישראל'");
    }catch(_){alert("שגיאה בחיפוש — בדוק חיבור");}
    setSearching(false);
  };

  if(!window.L)return <div style={{padding:20,textAlign:"center",color:C.txtM}}>{"המפה לא נטענה — בדוק חיבור אינטרנט ורענן"}</div>;

  return(<div style={{padding:"0 12px"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",margin:"12px 0 8px"}}>
      <h3 style={{fontSize:16}}>{"🗺️ מפת מקטעים"}</h3>
      <span style={{fontSize:11,color:status==="שגיאת שמירה"?C.red:C.grn,fontWeight:600}}>{status}</span>
    </div>
    <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:8,WebkitOverflowScrolling:"touch"}}>
      {sites.map(s=><button key={s.id} onClick={()=>{setDrawPts(null);setNamePanel(null);setSiteId(s.id);}} style={{flexShrink:0,padding:"7px 12px",borderRadius:20,border:"1.5px solid "+(siteId===s.id?C.grn:C.bdr),background:siteId===s.id?C.grnP:C.wht,color:siteId===s.id?C.grn:C.txtM,fontSize:12,fontWeight:siteId===s.id?700:500,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{s.name}</button>)}
    </div>
    <div style={{display:"flex",gap:6,marginBottom:8}}>
      <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")doSearch();}} placeholder={"🔍 חפש מקום (למשל: אלון ישראל)"} style={{flex:1,padding:"9px 12px",borderRadius:10,border:"1px solid "+C.bdr,fontSize:13,fontFamily:"inherit",background:C.wht}}/>
      <button onClick={doSearch} disabled={searching} style={{padding:"9px 14px",borderRadius:10,border:"none",background:C.blu,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{searching?"…":"חפש"}</button>
    </div>
    <div ref={mapRef} style={{height:380,borderRadius:12,overflow:"hidden",border:"2px solid "+C.bdr,direction:"ltr",zIndex:0,position:"relative"}}/>
    {drawPts===null&&!namePanel&&<div style={{display:"flex",gap:6,marginTop:8}}>
      <button onClick={()=>setDrawPts([])} style={{flex:2,padding:12,borderRadius:10,border:"none",background:C.grn,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"➕ מקטע חדש"}</button>
      <button onClick={saveCenter} style={{flex:1,padding:12,borderRadius:10,border:"1px solid "+C.bdr,background:C.wht,color:C.txtM,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{"📍 שמור מיקום"}</button>
    </div>}
    {drawPts!==null&&<div style={{marginTop:8,padding:10,borderRadius:10,background:C.orgB,border:"1px solid "+C.org}}>
      <div style={{fontSize:12,fontWeight:600,color:C.txt,marginBottom:8,textAlign:"center"}}>{"לחץ על המפה כדי לסמן נקודות ("+drawPts.length+" נקודות)"}</div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={finishDraw} disabled={drawPts.length<3} style={{flex:2,padding:11,borderRadius:10,border:"none",background:drawPts.length<3?C.bdr:C.grn,color:"#fff",fontSize:13,fontWeight:700,cursor:drawPts.length<3?"default":"pointer",fontFamily:"inherit"}}>{"✔️ סיים מקטע"}</button>
        <button onClick={()=>setDrawPts(p=>p.slice(0,-1))} disabled={drawPts.length===0} style={{flex:1,padding:11,borderRadius:10,border:"1px solid "+C.bdr,background:C.wht,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{"↩️ בטל נקודה"}</button>
        <button onClick={()=>setDrawPts(null)} style={{flex:1,padding:11,borderRadius:10,border:"1px solid "+C.red,background:C.wht,color:C.red,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{"✖ בטל"}</button>
      </div>
    </div>}
    {namePanel&&<div style={{marginTop:8,padding:12,borderRadius:10,background:C.wht,border:"2px solid "+C.grn}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>{"שם המקטע:"}</div>
      <input autoFocus value={namePanel.name} onChange={e=>setNamePanel({...namePanel,name:e.target.value})} placeholder={"למשל: כניסה ראשית, פארק, מדשאה צפונית"} style={{width:"100%",padding:11,borderRadius:8,border:"1px solid "+C.bdr,fontSize:14,fontFamily:"inherit",marginBottom:10}}/>
      <div style={{display:"flex",gap:8,marginBottom:10,justifyContent:"center"}}>
        {SEC_COLORS.map(col=><div key={col} onClick={()=>setNamePanel({...namePanel,color:col})} style={{width:28,height:28,borderRadius:"50%",background:col,cursor:"pointer",border:namePanel.color===col?"3px solid "+C.txt:"2px solid #fff",boxShadow:"0 1px 3px rgba(0,0,0,0.3)"}}/>)}
      </div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={saveSection} disabled={!namePanel.name.trim()} style={{flex:2,padding:12,borderRadius:10,border:"none",background:!namePanel.name.trim()?C.bdr:C.grn,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"💾 שמור מקטע"}</button>
        <button onClick={()=>setNamePanel(null)} style={{flex:1,padding:12,borderRadius:10,border:"1px solid "+C.bdr,background:C.wht,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{"בטל"}</button>
      </div>
    </div>}
    {store&&<div style={{marginTop:12}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>{"מקטעים ("+sections.length+")"}</div>
      {sections.length===0&&<div style={{fontSize:12,color:C.txtL,textAlign:"center",padding:14,background:C.wht,borderRadius:10,border:"1px dashed "+C.bdr}}>{"אין עדיין מקטעים בישוב הזה — לחץ על ➕ מקטע חדש"}</div>}
      {sections.map(s=><div key={s.id} onClick={()=>zoomSection(s)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:C.wht,borderRadius:10,border:"1px solid "+C.bdr,marginBottom:6,cursor:"pointer"}}>
        <div style={{width:16,height:16,borderRadius:4,background:s.color,flexShrink:0}}/>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:600}}>{s.name}</div>
          <div style={{fontSize:11,color:C.txtL}}>{fmtDunam(polyAreaM2(s.pts))}</div>
        </div>
        <button onClick={e=>{e.stopPropagation();delSection(s.id);}} style={{background:"none",border:"none",color:C.red,fontSize:16,cursor:"pointer",padding:4}}>{"🗑"}</button>
      </div>)}
    </div>}
    <style>{".sec-label{background:rgba(0,0,0,0.65) !important;color:#fff !important;border:none !important;border-radius:6px !important;font-family:'Rubik',sans-serif !important;font-weight:700 !important;font-size:11px !important;box-shadow:none !important;padding:2px 8px !important}.sec-label:before{display:none !important}"}</style>
  </div>);
}

/* ═══════════ צ'ק-אין עובדים (מיקום הגעה/יציאה) ═══════════ */
const CI_G={grn:"#2d6a4f",grnD:"#1b4332",red:"#c0392b",bg:"#f5f0e6",card:"#ffffff",txt:"#2d3a2e",muted:"#7a8a7e",bdr:"#dcd6c8"};
const ciT=(iso)=>{try{return new Date(iso).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});}catch(_){return"";}};
const ciD=(iso)=>{try{return new Date(iso).toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"});}catch(_){return"";}};

function CheckIn(){
  const [workers,setWorkers]=useState([]);
  const [name,setName]=useState("");
  const [typed,setTyped]=useState("");
  const [status,setStatus]=useState("");
  const [done,setDone]=useState(null);
  const [err,setErr]=useState("");
  const [pending,setPending]=useState(null);
  useEffect(()=>{(async()=>{try{const {data}=await sb.from("app_data").select("data").eq("id","main").maybeSingle();const ws=(data&&data.data&&data.data.workers)||[];setWorkers(ws.filter(w=>w.type!=="sub").map(w=>w.name));}catch(_){}})();},[]);
  const chosen=(typed.trim()||name).trim();
  async function saveRecord(type,coords){
    setStatus("saving");
    const rec={id:Math.random().toString(36).slice(2,9),worker:chosen,type:type,ts:new Date().toISOString(),lat:coords?coords.latitude:null,lng:coords?coords.longitude:null,acc:coords?Math.round(coords.accuracy):null};
    try{
      const {data}=await sb.from("app_data").select("data").eq("id","checkins").maybeSingle();
      const list=(data&&data.data&&data.data.list)||[];
      list.push(rec);
      const {error}=await sb.from("app_data").upsert({id:"checkins",data:{list:list},updated_at:new Date().toISOString()});
      if(error)throw error;
      setDone(rec);setStatus("");setErr("");setPending(null);
    }catch(e){setStatus("");setErr("שגיאת שמירה — נסה שוב");}
  }
  function press(type){
    setErr("");setPending(null);
    if(!chosen){setErr("בחר או הקלד שם");return;}
    if(!navigator.geolocation){setPending(type);setErr("אין גישה למיקום במכשיר");return;}
    setStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos)=>saveRecord(type,pos.coords),
      (e)=>{setStatus("");setPending(type);setErr(e.code===1?"המיקום חסום. אפשר להפעיל מיקום בהגדרות — או לשמור בלי מיקום.":"לא הצלחתי לאתר מיקום. נסה שוב או שמור בלי מיקום.");},
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
  }
  const wrap={minHeight:"100vh",background:CI_G.bg,fontFamily:"'Rubik',sans-serif",direction:"rtl",color:CI_G.txt,maxWidth:480,margin:"0 auto",padding:"0 0 40px",boxShadow:"0 0 40px rgba(0,0,0,0.08)"};
  const head={background:CI_G.grn,color:"#fff",padding:"22px 18px",textAlign:"center"};
  if(done){
    const inn=done.type==="in";
    return (
      <div style={wrap}>
        <div style={head}><div style={{fontSize:18,fontWeight:700}}>🌿 מעקב גינון</div></div>
        <div style={{padding:"28px 18px",textAlign:"center"}}>
          <div style={{fontSize:54,marginBottom:10}}>✅</div>
          <div style={{fontSize:22,fontWeight:700,color:inn?CI_G.grn:CI_G.red,marginBottom:6}}>{inn?"הגעה נרשמה":"יציאה נרשמה"}</div>
          <div style={{fontSize:34,fontWeight:700,marginBottom:4}}>{ciT(done.ts)}</div>
          <div style={{fontSize:16,color:CI_G.muted,marginBottom:20}}>{done.worker}</div>
          {done.lat!=null
            ? <a href={"https://www.google.com/maps?q="+done.lat+","+done.lng} target="_blank" rel="noopener" style={{display:"inline-block",padding:"12px 20px",borderRadius:12,background:CI_G.card,border:"1.5px solid "+CI_G.bdr,color:CI_G.grn,fontWeight:700,textDecoration:"none",marginBottom:8}}>📍 פתח מיקום במפה</a>
            : <div style={{fontSize:13,color:CI_G.muted,marginBottom:8}}>נשמר בלי מיקום</div>}
          <div style={{marginTop:22}}>
            <button onClick={()=>{setDone(null);setName("");setTyped("");}} style={{padding:"12px 22px",borderRadius:12,border:"1.5px solid "+CI_G.bdr,background:CI_G.card,color:CI_G.txt,fontSize:15,fontWeight:700,fontFamily:"inherit",cursor:"pointer"}}>רישום נוסף</button>
          </div>
        </div>
      </div>
    );
  }
  const busy=status==="locating"||status==="saving";
  const bigBtn=(bg)=>({width:"100%",padding:"22px",borderRadius:16,border:"none",color:"#fff",background:bg,fontSize:24,fontWeight:700,fontFamily:"inherit",cursor:busy?"default":"pointer",opacity:busy?0.6:1,marginBottom:14,boxShadow:"0 4px 14px rgba(0,0,0,0.12)"});
  return (
    <div style={wrap}>
      <div style={head}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:2}}>🌿 מעקב גינון</div>
        <div style={{fontSize:13,opacity:0.9}}>רישום הגעה ויציאה</div>
      </div>
      <div style={{padding:"18px"}}>
        <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>מי אתה?</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
          {workers.map(w=>(
            <button key={w} onClick={()=>{setName(w);setTyped("");setErr("");}} style={{padding:"10px 16px",borderRadius:20,border:"1.5px solid "+((name===w&&!typed.trim())?CI_G.grn:CI_G.bdr),background:(name===w&&!typed.trim())?CI_G.grn:CI_G.card,color:(name===w&&!typed.trim())?"#fff":CI_G.txt,fontSize:15,fontWeight:600,fontFamily:"inherit",cursor:"pointer"}}>{w}</button>
          ))}
        </div>
        <input value={typed} onChange={e=>{setTyped(e.target.value);setErr("");}} placeholder="או הקלד שם אחר..." style={{width:"100%",padding:12,borderRadius:10,border:"1.5px solid "+CI_G.bdr,fontSize:15,fontFamily:"inherit",direction:"rtl",outline:"none",marginBottom:18,boxSizing:"border-box"}}/>
        <button onClick={()=>press("in")} disabled={busy} style={bigBtn(CI_G.grn)}>🟢 הגעתי</button>
        <button onClick={()=>press("out")} disabled={busy} style={bigBtn(CI_G.red)}>🔴 סיימתי</button>
        {status==="locating"&&<div style={{textAlign:"center",color:CI_G.muted,fontSize:14,marginTop:6}}>📍 מאתר מיקום...</div>}
        {status==="saving"&&<div style={{textAlign:"center",color:CI_G.muted,fontSize:14,marginTop:6}}>שומר...</div>}
        {err&&<div style={{textAlign:"center",color:CI_G.red,fontSize:14,marginTop:10}}>{err}</div>}
        {pending&&<button onClick={()=>saveRecord(pending,null)} style={{width:"100%",marginTop:12,padding:14,borderRadius:12,border:"1.5px dashed "+CI_G.bdr,background:CI_G.card,color:CI_G.txt,fontSize:15,fontWeight:700,fontFamily:"inherit",cursor:"pointer"}}>שמור בכל זאת (בלי מיקום)</button>}
        <div style={{textAlign:"center",fontSize:12,color:CI_G.muted,marginTop:22}}>כשהדפדפן מבקש — אשרו גישה למיקום 📍</div>
      </div>
    </div>
  );
}

function CheckinsAdmin(){
  const [ok,setOk]=useState(false);
  const [pw,setPw]=useState("");
  const [pwErr,setPwErr]=useState(false);
  const [list,setList]=useState(null);
  const [loading,setLoading]=useState(false);
  async function refresh(){
    setLoading(true);
    try{const {data}=await sb.from("app_data").select("data").eq("id","checkins").maybeSingle();
      const l=((data&&data.data&&data.data.list)||[]).slice().sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
      setList(l);}catch(_){setList([]);}
    setLoading(false);
  }
  useEffect(()=>{if(ok){refresh();const t=setInterval(refresh,15000);return ()=>clearInterval(t);}},[ok]);
  const wrap={minHeight:"100vh",background:CI_G.bg,fontFamily:"'Rubik',sans-serif",direction:"rtl",color:CI_G.txt,maxWidth:480,margin:"0 auto",boxShadow:"0 0 40px rgba(0,0,0,0.08)"};
  if(!ok){
    return (
      <div style={{...wrap,padding:"60px 24px"}}>
        <div style={{fontSize:20,fontWeight:700,textAlign:"center",marginBottom:16}}>📍 צ'ק-אין עובדים</div>
        <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setPwErr(false);}} onKeyDown={e=>e.key==="Enter"&&(pw===PW?setOk(true):setPwErr(true))} placeholder="סיסמה" style={{width:"100%",padding:14,borderRadius:10,border:"2px solid "+(pwErr?CI_G.red:CI_G.bdr),fontSize:20,textAlign:"center",letterSpacing:6,fontFamily:"inherit",outline:"none",boxSizing:"border-box",marginBottom:12}}/>
        <button onClick={()=>pw===PW?setOk(true):setPwErr(true)} style={{width:"100%",padding:14,borderRadius:10,border:"none",background:CI_G.grn,color:"#fff",fontSize:16,fontWeight:700,fontFamily:"inherit",cursor:"pointer"}}>כניסה</button>
      </div>
    );
  }
  const groups={};
  (list||[]).forEach(r=>{const k=ciD(r.ts);(groups[k]=groups[k]||[]).push(r);});
  const days=Object.keys(groups);
  return (
    <div style={wrap}>
      <div style={{background:CI_G.grn,color:"#fff",padding:"18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:17,fontWeight:700}}>📍 צ'ק-אין עובדים</div>
        <button onClick={refresh} style={{padding:"7px 14px",borderRadius:10,border:"none",background:"rgba(255,255,255,0.2)",color:"#fff",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer"}}>{loading?"...":"רענן"}</button>
      </div>
      <div style={{padding:"14px"}}>
        {list&&list.length===0&&<div style={{textAlign:"center",color:CI_G.muted,padding:"40px 0"}}>אין רישומים עדיין</div>}
        {days.map(day=>(
          <div key={day} style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,color:CI_G.muted,margin:"6px 2px"}}>{day}</div>
            {groups[day].map(r=>{const inn=r.type==="in";return (
              <div key={r.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:CI_G.card,border:"1px solid "+CI_G.bdr,borderRadius:12,padding:"10px 12px",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{padding:"3px 10px",borderRadius:10,fontSize:12,fontWeight:700,background:inn?"#e3f0e8":"#f7e3e0",color:inn?CI_G.grn:CI_G.red}}>{inn?"הגעה":"יציאה"}</span>
                  <span style={{fontWeight:700,fontSize:15}}>{r.worker}</span>
                  {r.acc!=null&&<span style={{fontSize:11,color:CI_G.muted}}>{"±"+r.acc+"מ׳"}</span>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:16,fontWeight:700}}>{ciT(r.ts)}</span>
                  {r.lat!=null
                    ? <a href={"https://www.google.com/maps?q="+r.lat+","+r.lng} target="_blank" rel="noopener" style={{textDecoration:"none",fontSize:18}}>🗺️</a>
                    : <span style={{fontSize:12,color:CI_G.muted}}>—</span>}
                </div>
              </div>
            );})}
          </div>
        ))}
      </div>
    </div>
  );
}
/* ═══════════ end צ'ק-אין ═══════════ */

const CI_Q=new URLSearchParams(location.search);
const root = ReactDOM.createRoot(document.getElementById('root'));
if(CI_Q.has("checkin")){ root.render(React.createElement(CheckIn)); }
else if(CI_Q.has("checkins")){ root.render(React.createElement(CheckinsAdmin)); }
else { root.render(React.createElement(App)); }
</script>
</body>
